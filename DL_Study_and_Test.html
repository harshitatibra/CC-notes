ntee learning arbitrary long-range relationships.<\/p>\n<p>For norm threshold C&gt;0, <strong>gclip = g·min(1,C/‖g‖₂)<\/strong> for nonzero g; leave the zero vector unchanged. With g=(3,4) and C=2, ‖g‖=5, so gclip=(1.2,1.6). Norm clipping preserves direction. Coordinatewise clipping is a different operation and need not preserve direction. Clip the gradient, then apply the optimizer update.<\/p>\n<p><strong>Likely patterns:<\/strong> count recurrent paths; distinguish direct and total derivatives; compute a Jacobian product; identify what truncation forgets; calculate a clipped gradient. <strong>Remember:<\/strong> BPTT adds uses and multiplies paths; clipping shrinks explosions, gates help carry memory.<\/p>\n"}, {"number": 3, "title": "LSTM: retain, update & expose memory", "scope": "Lecture 14", "html": "<h3 id=\"two-states-and-three-learned-gates\">Two states and three learned gates<\/h3>\n<p>Imagine a small whiteboard: keep useful facts, add relevant new facts, and expose only what is useful now. An <strong>LSTM<\/strong> separates a cell memory cₜ from an exposed hidden state hₜ. In the slides the cell memory is called <strong>sₜ<\/strong>, so their sₜ corresponds to cₜ below.<\/p>\n<p>Using the common tanh candidate/output convention:<\/p>\n<p><code>fₜ = sigmoid(Wf hₜ₋₁ + Uf xₜ + bf)<\/code><\/p>\n<p><code>iₜ = sigmoid(Wi hₜ₋₁ + Ui xₜ + bi)<\/code><\/p>\n<p><code>oₜ = sigmoid(Wo hₜ₋₁ + Uo xₜ + bo)<\/code><\/p>\n<p><code>gₜ = tanh(Wg hₜ₋₁ + Ug xₜ + bg)<\/code><\/p>\n<p><code>cₜ = fₜ ⊙ cₜ₋₁ + iₜ ⊙ gₜ<\/code><\/p>\n<p><code>hₜ = oₜ ⊙ tanh(cₜ)<\/code><\/p>\n<p>⊙ means elementwise multiplication. Each gate has one value per memory coordinate; gates are vectors, not necessarily single scalars. Logistic sigmoid gives values between 0 and 1, allowing soft decisions. They are <strong>learned functions<\/strong> of the input and previous hidden state, trained with the rest of the model. They are not manually specified word lists or binary labels.<\/p>\n<table>\n<thead>\n<tr>\n<th>Quantity<\/th>\n<th>Main role<\/th>\n<th>Boundary intuition<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Forget gate f<\/td>\n<td>Retains part of old memory<\/td>\n<td>f≈1 keep; f≈0 erase old contribution<\/td>\n<\/tr>\n<tr>\n<td>Input gate i<\/td>\n<td>Controls candidate entering memory<\/td>\n<td>i≈0 blocks new candidate<\/td>\n<\/tr>\n<tr>\n<td>Candidate g<\/td>\n<td>Proposed new content<\/td>\n<td>Can be positive or negative with tanh<\/td>\n<\/tr>\n<tr>\n<td>Output gate o<\/td>\n<td>Controls exposed hidden state<\/td>\n<td>o≈0 hides memory; does not necessarily erase it<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The lecture's whiteboard labels call the output-gating operation <strong>selective write<\/strong>, input-gating <strong>selective read<\/strong>, and forget-gating <strong>selective forget<\/strong>. For option questions, identify the equation and gate role rather than relying only on the English label. Some presentations use σ as a generic activation symbol; gate equations use logistic sigmoid, while tanh is the common candidate and cell-output activation. Follow any activation explicitly specified in a numerical question.<\/p>\n<p><strong>Worked update:<\/strong> cₜ₋₁=2, f=0.75, i=0.4, g=−0.5 gives cₜ=1.5−0.2=<strong>1.3<\/strong>. If o=0.6, hₜ=0.6tanh(1.3)≈<strong>0.517<\/strong>. The cell value 1.3 is valid: the cell itself is not forced into [−1,1]. With this tanh output, each exposed h coordinate lies in [−1,1].<\/p>\n<p><strong>Useful gate combinations:<\/strong> f≈1,i≈0 copies old memory; f≈0,i≈1 replaces it with the candidate; f≈0,i≈0 clears it; f≈1,i≈1 retains old content and adds new content. Input and forget gates are independently learned in the standard LSTM; they need not sum to 1.<\/p>\n<h3 id=\"gradient-flow-through-the-cell\">Gradient flow through the cell<\/h3>\n<p>Along the <strong>direct memory path<\/strong>, holding gate/candidate computations fixed, <strong>∂⁺cₜ/∂cₜ₋₁=diag(fₜ)<\/strong>. Across multiple steps the direct path multiplies forget gates. Values near 1 allow a relatively unchanged gradient to travel, without multiplying a recurrent weight matrix at every step on that path.<\/p>\n<p>This is a path contribution, <strong>not the entire total derivative<\/strong>: gates and candidates also depend indirectly on earlier states through h. LSTM mitigates unintended vanishing; closed gates, saturation, and other paths can still cause vanishing or exploding gradients. Norm clipping can still be needed. A path with f=0.9 for 10 steps carries a factor 0.9¹⁰≈0.349; f=0.99 gives ≈0.904. Even a forget gate below 1 eventually attenuates over enough steps.<\/p>\n<p>A standard LSTM has <strong>4d(n+d+1)<\/strong> recurrent-cell parameters: three gates plus one candidate affine transform. This excludes embeddings and the task output layer, and assumes one bias per transform with no peephole connections. An LSTM with n=3,d=4 has <strong>128<\/strong> cell parameters. If a question gives an output layer or a different LSTM variant, count those separately.<\/p>\n<p><strong>Likely patterns:<\/strong> identify a gate, predict behavior as a gate approaches 0 or 1, compute c and h separately, count four transforms, explain why an additive path helps gradients. <strong>Remember:<\/strong> forget keeps old; input adds new; output shows memory.<\/p>\n"}, {"number": 4, "title": "GRU, comparisons & rapid question method", "scope": "Lecture 14", "html": "<h3 id=\"two-gates-and-a-single-state\">Two gates and a single state<\/h3>\n<p>A <strong>GRU<\/strong> combines memory and hidden output into a single state. Use reset r and update z with this explicitly defined convention:<\/p>\n<p><code>rₜ = sigmoid(Wr hₜ₋₁ + Ur xₜ + br)<\/code><\/p>\n<p><code>zₜ = sigmoid(Wz hₜ₋₁ + Uz xₜ + bz)<\/code><\/p>\n<p><code>gₜ = tanh(Wg(rₜ ⊙ hₜ₋₁) + Ug xₜ + bg)<\/code><\/p>\n<p><code>hₜ = (1−zₜ) ⊙ hₜ₋₁ + zₜ ⊙ gₜ<\/code><\/p>\n<p>The reset gate determines how much past state contributes to <strong>forming the candidate<\/strong>. The update gate mixes old state and candidate. With the equation above, z≈0 retains the old state; z≈1 replaces it with the candidate. A reset value r≈0 suppresses old-state input to the candidate; it does <strong>not<\/strong> by itself force the final state to zero.<\/p>\n<p><strong>Convention trap:<\/strong> some texts use hₜ=zₜ⊙hₜ₋₁+(1−zₜ)⊙gₜ, reversing the interpretation of z. The supplied lecture set also switches the mixing coefficients between presentations. Always read the displayed equation. In Lecture 14's GRU equations, its oₜ acts like the reset gate r here, its iₜ like z here, and its state sₜ like h here. That GRU oₜ is not an LSTM output gate exposing a separate cell memory.<\/p>\n<p><strong>Example:<\/strong> old h=0.8, candidate g=−0.2, z=0.25 gives hnew=0.75(0.8)+0.25(−0.2)=<strong>0.55<\/strong>. Under the reversed convention using the same numerical gate, the answer would be 0.25(0.8)+0.75(−0.2)=<strong>0.05<\/strong>. The equation decides.<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Vanilla RNN<\/th>\n<th>Standard LSTM<\/th>\n<th>GRU used here<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>State variables carried<\/td>\n<td>h<\/td>\n<td>c and h<\/td>\n<td>h<\/td>\n<\/tr>\n<tr>\n<td>Learned gates<\/td>\n<td>None<\/td>\n<td>Forget, input, output<\/td>\n<td>Reset, update<\/td>\n<\/tr>\n<tr>\n<td>Affine transforms per step<\/td>\n<td>1<\/td>\n<td>4<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>Cell parameters, no output layer<\/td>\n<td>d(n+d+1)<\/td>\n<td>4d(n+d+1)<\/td>\n<td>3d(n+d+1)<\/td>\n<\/tr>\n<tr>\n<td>Memory update<\/td>\n<td>Repeated nonlinear overwrite<\/td>\n<td>Gated old cell + gated candidate<\/td>\n<td>Complementary mix of old state and candidate<\/td>\n<\/tr>\n<tr>\n<td>Long-range learning<\/td>\n<td>Often difficult<\/td>\n<td>Improved by memory path<\/td>\n<td>Improved by gated carry path<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>GRU has no separate cell state or independent LSTM-style output gate. Its retention and replacement coefficients are coupled as 1−z and z; a standard LSTM can independently retain and add. With the same input and hidden widths, a GRU has fewer cell parameters than a standard LSTM, but this does not prove it is more accurate or always faster in every implementation.<\/p>\n<h3 id=\"solve-unfamiliar-questions-in-this-order\">Solve unfamiliar questions in this order<\/h3>\n<ol type=\"1\">\n<li><strong>Write the convention and dimensions.<\/strong> Does the gate multiply the old state or the candidate? Are vectors rows or columns?<\/li>\n<li><strong>Separate forward memory from training credit.<\/strong> Carrying a hidden state across chunks does not mean gradients cross a detached boundary.<\/li>\n<li><strong>Evaluate preactivation, then activation.<\/strong> Never treat tanh(z) as z unless the problem explicitly makes a linear approximation.<\/li>\n<li><strong>Separate cell and hidden output.<\/strong> Compute c before o⊙tanh(c); closing o hides memory without automatically erasing c.<\/li>\n<li><strong>Count transformations, not time copies.<\/strong> One shared recurrent cell serves every time step. Add output and embedding parameters only when included.<\/li>\n<li><strong>Check the gradient claim.<\/strong> LSTM improves the path for long-range gradients; clipping controls large gradient norms; neither guarantees perfect learning.<\/li>\n<\/ol>\n<p><strong>Rapid recall:<\/strong> RNN = reused state update. BPTT = chain rule across time. Vanishing = repeated small factors. Explosion = repeated amplification. TBPTT = bounded backward horizon. LSTM = separate memory and exposed state. GRU = reset candidate, mix old/new. Norm clipping preserves gradient direction.<\/p>\n"}], "cases": [{"number": 1, "title": "Recurrent sequence models", "html": "<p>Use a vanilla RNN with column vectors: <strong>hₜ=φ(Uxₜ+Whₜ₋₁+b)<\/strong> and <strong>pₜ=softmax(Vhₜ+c)<\/strong>. Input width n=3, hidden width d=4, output width k=2. Include one hidden bias and one output bias when counting parameters. Question 5 explicitly replaces φ by the identity.<\/p>\n"}, {"number": 2, "title": "Loss, BPTT and gradient horizons", "html": "<p>Use natural logarithms for cross-entropy. BPTT differentiates the unrolled recurrence with shared parameters. For the scalar derivative in Question 8, <strong>h₀=1,h₁=wh₀,h₂=wh₁<\/strong>. Truncation means detaching a computation graph at a chunk boundary while optionally carrying its numerical hidden state forward.<\/p>\n"}, {"number": 3, "title": "LSTM memory and gradient control", "html": "<p>Use <strong>cₜ=fₜcₜ₋₁+iₜgₜ<\/strong>, <strong>hₜ=oₜtanh(cₜ)<\/strong> for scalar calculations. Question 12 has <strong>cₜ₋₁=2,fₜ=0.75,iₜ=0.4,gₜ=−0.5<\/strong>. The direct cell-memory derivative holds gate and candidate computations fixed. Norm clipping uses one common scaling factor for the entire gradient.<\/p>\n"}, {"number": 4, "title": "GRU gates and architecture comparisons", "html": "<p>Unless a question explicitly gives another equation, use <strong>gₜ=tanh(W(rₜ⊙hₜ₋₁)+Uxₜ+b)<\/strong> and <strong>hₜ=(1−zₜ)⊙hₜ₋₁+zₜ⊙gₜ<\/strong>. Count standard recurrent cells with one bias per affine transform, no peepholes, and no task output layer.<\/p>\n"}], "questions": [{"n": 1, "stem": "Which task naturally uses a many-to-one sequence model?", "options": {"A": "Assigning a part-of-speech tag to every input word", "B": "Predicting the next character at every input step", "C": "Assigning one sentiment label to an entire review", "D": "Classifying one independent photograph"}, "answer": "C", "explanation": {"right": "<p>A review contains many ordered words, but the requested output is one sentiment label. The model can read the sequence and classify from its final summary.<\/p>\n", "wrong": "<p><strong>A:<\/strong> one tag per word is many-to-many. <strong>B:<\/strong> one next-character prediction per step is also many-to-many. <strong>D:<\/strong> one independent image to one label is ordinarily one-to-one, without a sequence dimension.<\/p>\n", "cue": "<p>Count input and output time steps: many words, one decision → many-to-one.<\/p>\n"}}, {"n": 2, "stem": "What happens to the number of trainable RNN parameters when sequence length increases from 5 to 50, with widths unchanged?", "options": {"A": "It increases tenfold", "B": "It stays unchanged because weights are shared over time", "C": "It increases by 45 independent recurrent matrices", "D": "It becomes independent of hidden-state width"}, "answer": "B", "explanation": {"right": "<p>U, W, V and their biases are reused at every time step. More steps increase their number of uses, not the number of distinct trainable values. Forward computation and training activations can still grow.<\/p>\n", "wrong": "<p><strong>A:<\/strong> confuses computation with parameters. <strong>C:<\/strong> would describe separate weights per step, contrary to sharing. <strong>D:<\/strong> hidden width still controls W, U, V and bias sizes.<\/p>\n", "cue": "<p>Unrolling copies computation, not trainable weights.<\/p>\n"}}, {"n": 3, "stem": "With the column-vector convention and n=3,d=4,k=2, which shapes are correct for U,W,V?", "options": {"A": "U: 3×4; W: 4×4; V: 4×2", "B": "U: 4×4; W: 4×3; V: 2×4", "C": "U: 4×3; W: 2×2; V: 4×2", "D": "U: 4×3; W: 4×4; V: 2×4"}, "answer": "D", "explanation": {"right": "<p>Ux must map a 3-vector to a 4-vector, so U is 4×3. W maps a 4-state to a 4-state, so W is 4×4. V maps that state to 2 logits, so V is 2×4.<\/p>\n", "wrong": "<p><strong>A:<\/strong> transposes the input/output matrices relative to the stated column-vector equations. <strong>B:<\/strong> swaps the roles of U and W. <strong>C:<\/strong> gives incompatible hidden and output dimensions.<\/p>\n", "cue": "<p>Matrix shape = destination width × source width.<\/p>\n"}}, {"n": 4, "stem": "How many trainable parameters does the specified RNN have, including the output layer and both biases?", "options": {"A": "42", "B": "36", "C": "210", "D": "128"}, "answer": "A", "explanation": {"right": "<p>Count U:4×3=12, W:4×4=16, V:2×4=8, hidden bias:4, output bias:2. Total <strong>12+16+8+4+2=42<\/strong>. Sequence length does not enter this sum.<\/p>\n", "wrong": "<p><strong>B:<\/strong> 36 omits the six biases. <strong>C:<\/strong> 210 multiplies 42 by five time steps, counting shared weights repeatedly. <strong>D:<\/strong> 128 is the standard LSTM cell count for n=3,d=4, excluding its output layer, not this vanilla RNN.<\/p>\n", "cue": "<p>Count every matrix and bias once; do not multiply by T.<\/p>\n"}}, {"n": 5, "stem": "For the scalar linear recurrence hₜ=2xₜ+0.5hₜ₋₁ with h₀=0,x₁=1,x₂=2, what is h₂?", "options": {"A": "2", "B": "4", "C": "5", "D": "6"}, "answer": "C", "explanation": {"right": "<p>First h₁=2(1)+0.5(0)=2. Then h₂=2(2)+0.5(2)=<strong>5<\/strong>. The question explicitly uses an identity activation, so no tanh or sigmoid is applied.<\/p>\n", "wrong": "<p><strong>A:<\/strong> is h₁, not h₂. <strong>B:<\/strong> ignores the recurrent contribution. <strong>D:<\/strong> adds all of h₁ rather than its weighted contribution 0.5h₁.<\/p>\n", "cue": "<p>At each step: current input contribution + weighted previous state.<\/p>\n"}}, {"n": 6, "stem": "At two scored steps, the correct-token probabilities are 0.5 and 0.25. What is their summed cross-entropy loss?", "options": {"A": "−ln(0.75)", "B": "−ln(0.125) ≈ 2.079", "C": "0.75", "D": "−ln(0.5) ≈ 0.693"}, "answer": "B", "explanation": {"right": "<p>L=−ln(0.5)−ln(0.25)=−ln(0.5×0.25)=<strong>−ln(0.125)≈2.079<\/strong>. This is the sum, not the average, of the two token losses.<\/p>\n", "wrong": "<p><strong>A:<\/strong> adds probabilities before taking a log; independent factors in the sequence likelihood multiply. <strong>C:<\/strong> is the sum of the given probabilities, not cross-entropy. <strong>D:<\/strong> scores only the first step.<\/p>\n", "cue": "<p>Multiply probabilities; add negative logs. Divide only if a mean is requested.<\/p>\n"}}, {"n": 7, "stem": "A sequence has a loss only at the final step. During full BPTT, which statement is correct?", "options": {"A": "Only the final hidden state can receive a gradient", "B": "Earlier uses of W are unrelated to the final loss", "C": "Every time step needs independent W parameters", "D": "Earlier states and shared-weight uses can receive gradient through recurrent paths"}, "answer": "D", "explanation": {"right": "<p>The final state depends on earlier states, which depend on earlier uses of W. The chain rule follows these paths backward, and gradient contributions to shared W are accumulated. Actual values may be small or zero in a particular network, but the dependency paths exist.<\/p>\n", "wrong": "<p><strong>A:<\/strong> ignores indirect dependencies. <strong>B:<\/strong> earlier W uses affect later states. <strong>C:<\/strong> BPTT trains repeated uses of the same parameters; it does not require different weights at different steps.<\/p>\n", "cue": "<p>No local loss does not mean no gradient: future losses can flow backward.<\/p>\n"}}, {"n": 8, "stem": "For h₀=1,h₁=wh₀,h₂=wh₁, what is the total derivative dh₂/dw at w=2?", "options": {"A": "4", "B": "2", "C": "1", "D": "0"}, "answer": "A", "explanation": {"right": "<p>h₁=w and h₂=w², so dh₂/dw=2w=<strong>4<\/strong> at w=2. Both uses of w contribute. Equivalently, h₁+w(dh₁/dw)=2+2(1)=4.<\/p>\n", "wrong": "<p><strong>B:<\/strong> differentiates only the final multiplication while treating h₁ as fixed, missing the indirect path. <strong>C:<\/strong> is dh₁/dw. <strong>D:<\/strong> would incorrectly treat both state computations as constants.<\/p>\n", "cue": "<p>Shared parameters influence the current state directly and through earlier states.<\/p>\n"}}, {"n": 9, "stem": "Suppose ‖∂hₜ/∂hₖ‖ ≤ (γ‖W‖)^(t−k), with γ‖W‖=0.5. What follows as t−k becomes large?", "options": {"A": "The bound proves exponential gradient explosion", "B": "Every gradient is exactly zero after two steps", "C": "This recurrent-path gradient bound decays exponentially", "D": "The recurrent gradient stays exactly one"}, "answer": "C", "explanation": {"right": "<p>The bound is 0.5 raised to the number of steps, so it approaches zero exponentially. This gives a sufficient contraction condition for the distant-state sensitivity being bounded. A factor greater than one would allow, rather than prove, explosion.<\/p>\n", "wrong": "<p><strong>A:<\/strong> reverses the effect of a factor below one. <strong>B:<\/strong> small is not the same as exactly zero, and the bound gives no two-step cutoff. <strong>D:<\/strong> would require an identity-like factor of one instead of 0.5.<\/p>\n", "cue": "<p>Repeated factors below one shrink; factors above one can amplify.<\/p>\n"}}, {"n": 10, "stem": "With truncated BPTT and a detached chunk boundary, which description is accurate?", "options": {"A": "The hidden-state value must always be reset to zero at that boundary", "B": "The numerical state may be carried forward, but gradients do not cross the detached boundary", "C": "Every long-range dependency is guaranteed to be learned", "D": "The recurrence becomes an ordinary independent feedforward classifier"}, "answer": "B", "explanation": {"right": "<p>Detaching keeps the state value while treating its previous computation as constant for the next backward pass. Thus forward context can cross a chunk boundary even when gradient credit cannot. This reduces the stored backward horizon.<\/p>\n", "wrong": "<p><strong>A:<\/strong> resetting is optional and differs from detaching. <strong>C:<\/strong> removing long gradient paths limits direct learning of distant credit. <strong>D:<\/strong> the next forward step still uses a recurrent state.<\/p>\n", "cue": "<p>Carried value ≠ connected gradient graph.<\/p>\n"}}, {"n": 11, "stem": "In a standard LSTM, which setting most directly preserves the old cell memory while blocking candidate input?", "options": {"A": "f≈0,i≈1", "B": "f≈0,i≈0", "C": "f≈1,i≈1", "D": "f≈1,i≈0"}, "answer": "D", "explanation": {"right": "<p>From cnew=f·cold+i·g, f≈1 retains the old memory and i≈0 suppresses the candidate. Therefore cnew≈cold along this update.<\/p>\n", "wrong": "<p><strong>A:<\/strong> replaces the old memory with the candidate. <strong>B:<\/strong> suppresses both contributions and drives the cell toward zero. <strong>C:<\/strong> keeps the old memory but also adds the candidate, so it generally changes the cell.<\/p>\n", "cue": "<p>Keep old = forget gate one; block new = input gate zero.<\/p>\n"}}, {"n": 12, "stem": "For the given LSTM values cprev=2,f=0.75,i=0.4,g=−0.5, what is the new cell value?", "options": {"A": "1.3", "B": "1.7", "C": "0.6", "D": "0.517 approximately"}, "answer": "A", "explanation": {"right": "<p>c=0.75(2)+0.4(−0.5)=1.5−0.2=<strong>1.3<\/strong>. Compute the cell before the output gate and output activation. A cell value greater than one is valid.<\/p>\n", "wrong": "<p><strong>B:<\/strong> adds +0.2 instead of the negative candidate contribution. <strong>C:<\/strong> does not equal the specified gated sum. <strong>D:<\/strong> would be the hidden output if o=0.6 and h=0.6tanh(1.3), not the cell value requested here.<\/p>\n", "cue": "<p>Cell = retained old memory + gated new content; keep the candidate sign.<\/p>\n"}}, {"n": 13, "stem": "What does setting the LSTM output gate oₜ near zero do?", "options": {"A": "Necessarily erases cₜ to zero", "B": "Makes the candidate update unconditionally equal to one", "C": "Makes hₜ near zero while cₜ may remain stored", "D": "Removes the forget gate from the model"}, "answer": "C", "explanation": {"right": "<p>hₜ=oₜ⊙tanh(cₜ), so closing oₜ hides the memory from the exposed hidden state. The cell update is controlled by f and i, so the cell can retain nonzero information.<\/p>\n", "wrong": "<p><strong>A:<\/strong> confuses hiding with erasing. <strong>B:<\/strong> candidate creation and its input gate are separate from o. <strong>D:<\/strong> all three standard gates still exist; changing a gate value does not change the architecture.<\/p>\n", "cue": "<p>Output gate closes the window; it does not necessarily wipe the whiteboard.<\/p>\n"}}, {"n": 14, "stem": "Holding gates and candidate computations fixed, what is the direct LSTM derivative ∂⁺cₜ/∂cₜ₋₁?", "options": {"A": "The recurrent matrix W alone", "B": "diag(fₜ)", "C": "The all-zero matrix for every input", "D": "The identity matrix regardless of the gates"}, "answer": "B", "explanation": {"right": "<p>Differentiating cₜ=fₜ⊙cₜ₋₁+iₜ⊙gₜ directly with respect to cₜ₋₁ gives <strong>diag(fₜ)<\/strong>. This identifies the memory carry path; indirect dependencies through gates and hidden states also enter the full total derivative.<\/p>\n", "wrong": "<p><strong>A:<\/strong> describes neither the direct gated cell path nor the complete LSTM derivative. <strong>C:<\/strong> is possible on that path only when forget-gate entries are zero, not always. <strong>D:<\/strong> applies to that path only when all forget-gate entries are one.<\/p>\n", "cue": "<p>Differentiate retained memory: f times old gives f on the direct path.<\/p>\n"}}, {"n": 15, "stem": "A gradient g=(3,4) is clipped by its L2 norm with threshold C=2. What is the clipped gradient?", "options": {"A": "(2,2)", "B": "(0,0)", "C": "(3,4)", "D": "(1.2,1.6)"}, "answer": "D", "explanation": {"right": "<p>‖g‖₂=√(9+16)=5, which exceeds 2. Scale both components by 2/5: <strong>gclip=(1.2,1.6)<\/strong>. The resulting norm is 2 and its direction is unchanged.<\/p>\n", "wrong": "<p><strong>A:<\/strong> independently clips coordinates, giving norm √8&gt;2 and changing direction. <strong>B:<\/strong> discards the gradient rather than scaling it. <strong>C:<\/strong> leaves a norm of 5 and violates the threshold.<\/p>\n", "cue": "<p>One factor for the whole vector: threshold ÷ original norm.<\/p>\n"}}, {"n": 16, "stem": "Which statement correctly compares a standard LSTM with the GRU defined here?", "options": {"A": "The GRU carries one state and uses reset/update gates; the LSTM carries cell and hidden states", "B": "The GRU must have an independent LSTM-style output gate", "C": "The LSTM has no learned gates", "D": "The GRU forget and input coefficients must be independently learned"}, "answer": "A", "explanation": {"right": "<p>The GRU uses a single carried state, a reset gate in candidate construction, and an update gate mixing old/new content. The standard LSTM carries c and h and has forget, input and output gates.<\/p>\n", "wrong": "<p><strong>B:<\/strong> the GRU lacks a separate LSTM cell-output gate. <strong>C:<\/strong> the LSTM has three learned gates. <strong>D:<\/strong> the specified GRU ties retention/replacement coefficients as 1−z and z; they are not independent.<\/p>\n", "cue": "<p>LSTM: two states, three gates. GRU: one state, two gates.<\/p>\n"}}, {"n": 17, "stem": "Using hnew=(1−z)hold+zg with hold=0.8,g=−0.2,z=0.25, what is hnew?", "options": {"A": "0.05", "B": "−0.2", "C": "0.55", "D": "0.8"}, "answer": "C", "explanation": {"right": "<p>The old-state coefficient is 0.75. Thus hnew=0.75(0.8)+0.25(−0.2)=0.6−0.05=<strong>0.55<\/strong>. Both contributions use the specified gate convention.<\/p>\n", "wrong": "<p><strong>A:<\/strong> 0.05 comes from the reversed mixing convention z·hold+(1−z)g. <strong>B:<\/strong> would require full replacement, z=1. <strong>D:<\/strong> would require keeping the old state unchanged, z=0, or an identical candidate.<\/p>\n", "cue": "<p>Read which term z multiplies before substituting any numbers.<\/p>\n"}}, {"n": 18, "stem": "If the reset gate r is zero in g=tanh(W(r⊙hprev)+Ux+b), what follows?", "options": {"A": "The final state must be zero", "B": "The candidate ignores the recurrent old-state term, but the final state may still retain old information", "C": "The update gate z must also become zero", "D": "The GRU becomes an LSTM with a separate cell"}, "answer": "B", "explanation": {"right": "<p>r⊙hprev=0 removes that recurrent contribution from the candidate, leaving g=tanh(Ux+b). The final mix can still retain hprev through its (1−z) term.<\/p>\n", "wrong": "<p><strong>A:<\/strong> the candidate may be nonzero, and the carry term may retain old state. <strong>C:<\/strong> reset and update are separate learned gates. <strong>D:<\/strong> a particular gate value does not add a second state or change the architecture.<\/p>\n", "cue": "<p>Reset affects candidate construction; update decides the final mixture.<\/p>\n"}}, {"n": 19, "stem": "For input width 3 and hidden width 4, how many standard LSTM cell parameters are there, excluding embeddings and the output layer?", "options": {"A": "32", "B": "96", "C": "42", "D": "128"}, "answer": "D", "explanation": {"right": "<p>Each of four transforms has 4×3 input weights, 4×4 recurrent weights and 4 biases: 12+16+4=32. Three gates plus one candidate give <strong>4×32=128<\/strong> parameters.<\/p>\n", "wrong": "<p><strong>A:<\/strong> counts one transform, the vanilla recurrent-cell count. <strong>B:<\/strong> counts three transforms, matching this GRU cell instead. <strong>C:<\/strong> is the earlier vanilla RNN including its two-class output layer, not the LSTM cell.<\/p>\n", "cue": "<p>LSTM has four affine blocks, including the candidate block.<\/p>\n"}}, {"n": 20, "stem": "A question instead defines hnew=z·hold+(1−z)g. What happens as z approaches 1?", "options": {"A": "It retains the old state", "B": "It replaces the old state with the candidate", "C": "It necessarily makes every gradient explode", "D": "It sets the state to zero irrespective of hold"}, "answer": "A", "explanation": {"right": "<p>Under this explicitly reversed convention, the coefficient of hold approaches one and the candidate coefficient approaches zero, so hnew≈hold. The equation takes precedence over a memorized gate interpretation.<\/p>\n", "wrong": "<p><strong>B:<\/strong> would be true for z→0 in this equation, or z→1 under the other convention. <strong>C:<\/strong> a gate limit alone does not prove gradient explosion. <strong>D:<\/strong> retaining hold does not imply hold is zero.<\/p>\n", "cue": "<p>Gate names are not enough: inspect the coefficient of the old state.<\/p>\n"}}]}, {"number": 12, "title": "Encoder–decoder & attention", "assessmentLabel": "Practice test", "source": "Lecture-based practice from Lecture 15; no official Week 12 assignment was supplied.", "notes": [{"number": 1, "title": "Language models & encoder–decoder learning", "scope": "Lecture 15: foundations", "html": "<h3 id=\"from-predicting-the-next-word-to-generating-an-output\">From predicting the next word to generating an output<\/h3>\n<p>A language model predicts a word from its prefix: <strong>P(yₜ|y₁,…,yₜ₋₁)<\/strong>. A recurrent hidden state summarizes that prefix, and a vocabulary softmax gives the next-token distribution. A one-hot token can be mapped to a dense embedding before entering the recurrent cell.<\/p>\n<p>An <strong>encoder–decoder<\/strong> adds conditioning information x: a source sentence, image, video, or document. The encoder converts x into useful representations. The decoder generates an output from those representations and its previous output tokens.<\/p>\n<p><code>P(y₁,…,yM|x) = ∏ₜ₌₁ᴹ P(yₜ|y&lt;ₜ,x)<\/code><\/p>\n<p><code>L = −Σₜ₌₁ᴹ ln P(yₜ*|y*&lt;ₜ,x)<\/code><\/p>\n<p>y* denotes the target sequence; M includes the scored end token when used. Cross-entropy for a one-hot target is the negative log probability of the correct token. Encoder and decoder parameters can be trained together through backpropagation. Their recurrent weights are normally <strong>separate from each other<\/strong>, while each network reuses its own weights across time.<\/p>\n<p>For a text encoder, <strong>hⱼ=RNNenc(hⱼ₋₁,Esrc(xⱼ))<\/strong>. A basic fixed-context decoder uses the final encoder state hN as a summary c:<\/p>\n<p><code>s₀ = hN<\/code> (or a learned projection when dimensions differ)<\/p>\n<p><code>sₜ = RNNdec(sₜ₋₁,Etgt(yₜ₋₁))<\/code><\/p>\n<p><code>pₜ = softmax(Vsₜ+b)<\/code><\/p>\n<p>Another option feeds the same context at every decoding step: <strong>sₜ=RNNdec(sₜ₋₁,[Etgt(yₜ₋₁);c])<\/strong>. Brackets with a semicolon mean concatenation. Both methods condition on the source. Refeeding the same c does not make it a changing attention context.<\/p>\n<p>Input length N and output length M can differ. Translation and transliteration do not require one output at each matching source position. The decoder may start after the encoder finishes, then stop when it predicts <strong>EOS/STOP<\/strong>. <strong>BOS/GO<\/strong> is the starting input, not a real word whose meaning must be translated. A maximum output length is also used to stop runaway generation.<\/p>\n<h3 id=\"training-and-generation\">Training and generation<\/h3>\n<p>During <strong>teacher forcing<\/strong>, the decoder receives the previous correct target token when predicting the next one. During ordinary autoregressive generation, the target is unknown, so the previous generated token is fed back. A mistake can alter later predictions; this training–generation mismatch is often called exposure bias. The supplied equations may show predicted-token feedback; recognize the difference when the question specifies the training procedure.<\/p>\n<p>Greedy decoding picks the highest-probability token at each step; it does not guarantee the highest-probability <strong>whole sequence<\/strong>. Example: first-token A has probability 0.6 and its best next token 0.5, giving 0.30; B has probability 0.4 and its best next token 0.9, giving 0.36. Greedy starts with A and can miss B's better sequence. Beam search keeps several partial hypotheses, but finite beam search is still approximate. Include termination probabilities when comparing complete sequences in a question.<\/p>\n<p><strong>Loss example:<\/strong> correct-token probabilities 0.8 and 0.5 give sequence probability <strong>0.4<\/strong>, summed negative log loss <strong>−ln(0.4)≈0.916<\/strong>, and mean token loss <strong>≈0.458<\/strong>. Multiply probabilities; add log losses. Logs are natural unless the question specifies another base.<\/p>\n<p><strong>Likely patterns:<\/strong> identify the conditional distribution, choose encoder and decoder, distinguish GO from STOP, compare teacher forcing and inference, compute sequence probability/loss, or explain unequal input/output lengths.<\/p>\n"}, {"number": 2, "title": "Choose architectures for each application", "scope": "Lecture 15: applications", "html": "<h3 id=\"match-the-encoder-to-the-input-and-the-output-head-to-the-task\">Match the encoder to the input and the output head to the task<\/h3>\n<table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>Encoder<\/th>\n<th>Decoder / output<\/th>\n<th>Typical loss<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Image captioning<\/td>\n<td>CNN image representation<\/td>\n<td>Recurrent word generator<\/td>\n<td>Sum of target-token cross-entropies<\/td>\n<\/tr>\n<tr>\n<td>Machine translation<\/td>\n<td>RNN/LSTM/GRU over source words<\/td>\n<td>Recurrent target-word generator<\/td>\n<td>Target-token cross-entropy<\/td>\n<\/tr>\n<tr>\n<td>Transliteration<\/td>\n<td>Recurrent encoder over characters<\/td>\n<td>Recurrent target-script character generator<\/td>\n<td>Target-character cross-entropy<\/td>\n<\/tr>\n<tr>\n<td>Document summarization<\/td>\n<td>Recurrent or hierarchical text encoder<\/td>\n<td>Summary word generator<\/td>\n<td>Target-token cross-entropy<\/td>\n<\/tr>\n<tr>\n<td>Dialogue response<\/td>\n<td>Utterance or dialogue encoder<\/td>\n<td>Response word generator<\/td>\n<td>Target-token cross-entropy<\/td>\n<\/tr>\n<tr>\n<td>Image question answering<\/td>\n<td>CNN for image + RNN for question<\/td>\n<td>Fused representation and answer classifier<\/td>\n<td>Class cross-entropy for a single-answer class<\/td>\n<\/tr>\n<tr>\n<td>Video captioning<\/td>\n<td>CNN per frame, then RNN over frame features<\/td>\n<td>Description word generator<\/td>\n<td>Target-token cross-entropy<\/td>\n<\/tr>\n<tr>\n<td>Video activity classification<\/td>\n<td>CNN per frame, then RNN<\/td>\n<td>One activity softmax<\/td>\n<td>One class cross-entropy<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Image captioning:<\/strong> a CNN feature vector can initialize the decoder, or be concatenated with the token input at every step. A CNN encoder and a recurrent decoder do different jobs; they need not have identical structures or parameter sizes.<\/p>\n<p><strong>Video:<\/strong> a CNN captures spatial content within a frame. A recurrent encoder combines features in frame order to represent temporal change. Captioning outputs a variable-length sentence; classification outputs one activity label. A static image classifier alone cannot explicitly model the temporal ordering of a video.<\/p>\n<p><strong>Image question answering:<\/strong> encode “What is the bird's color?” with an RNN and encode the image with a CNN. Concatenate the two summaries and classify the answer, for example “white.” If a question instead specifies a multiword answer generator, use a sequence decoder and token losses; the single-class formulation is one task choice.<\/p>\n<p><strong>Textual entailment example:<\/strong> the deck illustrates generating a hypothesis such as “The ground is wet” from a premise such as “It is raining outside.” That is a conditional generation formulation. A task asking whether a given premise–hypothesis pair entails, contradicts, or is neutral uses a classifier instead. Identify the required output before choosing the loss.<\/p>\n<p><strong>Fixed-vector bottleneck:<\/strong> compressing a long source into one fixed-width c makes it difficult to preserve every needed detail. Reusing c at each output step still leaves the same compressed source representation. Attention instead allows the decoder to consult different source locations as it generates different tokens.<\/p>\n<p><strong>Likely patterns:<\/strong> select CNN versus RNN; distinguish classification from generation; decide whether output length is fixed; determine which parameters train jointly. <strong>Remember:<\/strong> input modality chooses the encoder; requested output chooses the head and loss.<\/p>\n"}, {"number": 3, "title": "Soft attention: scores, weights & context", "scope": "Lecture 15: attention mechanism", "html": "<h3 id=\"retrieve-relevant-source-information-for-each-output-step\">Retrieve relevant source information for each output step<\/h3>\n<p>Keep <strong>all encoder states h₁,…,hN<\/strong>. At decoder step t, compare its previous state sₜ₋₁ with each source state. For additive attention:<\/p>\n<p><code>eₜⱼ = vₐᵀ tanh(Wₐsₜ₋₁ + Uₐhⱼ + bₐ)<\/code><\/p>\n<p><code>αₜⱼ = exp(eₜⱼ) / Σₖ₌₁ᴺ exp(eₜₖ)<\/code><\/p>\n<p><code>cₜ = Σⱼ₌₁ᴺ αₜⱼhⱼ<\/code><\/p>\n<p><code>sₜ = RNNdec(sₜ₋₁,[Etgt(yₜ₋₁);cₜ])<\/code><\/p>\n<p><code>pₜ = softmax(Vsₜ+b)<\/code><\/p>\n<p>eₜⱼ is a scalar compatibility score; αₜⱼ is its normalized weight; cₜ is a vector. The <strong>query<\/strong> is the decoder state, and source states supply the locations being compared and averaged. This order uses sₜ₋₁ to form cₜ before computing sₜ, avoiding a circular definition. Other architectures can use a provisional decoder state, but their computation order must be specified.<\/p>\n<p>For each fixed t, weights normalize <strong>over source positions j<\/strong>, not over decoder time. Weights are nonnegative and sum to 1 across valid source locations. Their values can change with t even though the encoder states have already been computed. Padding locations should be masked before softmax, so they get zero weight rather than consuming attention mass.<\/p>\n<h3 id=\"numerical-patterns\">Numerical patterns<\/h3>\n<p>If scores are <strong>[0,ln2,ln3]<\/strong>, exponentials are [1,2,3], so weights are <strong>[1/6,1/3,1/2]<\/strong>. Given h₁=(6,0), h₂=(0,3), h₃=(2,2), the context is <strong>(2,2)<\/strong>. Multiply every vector by its own weight and add coordinatewise; do not concatenate the weighted vectors.<\/p>\n<p>If all N scores are equal, every weight is 1/N and context is the simple mean. Adding the same constant to all scores leaves softmax unchanged. For numerical stability calculate <strong>exp(eₜⱼ−maxₖeₜₖ)<\/strong> before normalizing. Scores can be negative; normalized weights cannot be negative. A finite unmasked softmax gives strictly positive weights; exact zeros arise through masking or numerical/limiting behavior.<\/p>\n<p>The weighted average has the <strong>same dimension as an encoder state<\/strong>, independent of source length. If source states have width dh, decoder state width ds, and attention hidden width a, then <strong>Uₐ is a×dh, Wₐ is a×ds, vₐ is a×1, bₐ is a×1<\/strong>. With no score bias, the attention score network has <strong>a·dh+a·ds+a<\/strong> parameters; adding bₐ adds a. These weights are shared across source and target positions, so their count does not multiply by NM. There are NM source–target score evaluations for N source positions and M output steps in full attention.<\/p>\n<h3 id=\"how-the-weights-are-learned\">How the weights are learned<\/h3>\n<p>Soft attention uses a differentiable weighted sum, so the usual target-token loss can train the encoder, decoder, and attention scoring parameters together. <strong>Ground-truth word alignments are not required<\/strong> for this standard training setup. An additional alignment loss is optional when such supervision exists.<\/p>\n<p>Soft attention can distribute weight across multiple words. For translation, one target word may depend on a phrase, and word order can change. Attention weights form a soft source–target alignment; they are useful to inspect but are not guaranteed to match human word alignments or prove a model's causal reasoning. Hard selection of one location would be a different mechanism from the soft weighted sum used here.<\/p>\n<p>Attention reduces reliance on one final source summary and creates shorter paths from output losses to source states. It does <strong>not<\/strong> replace every RNN, force monotonic alignment, require equal source/target lengths, or guarantee perfect memory.<\/p>\n<p><strong>Likely patterns:<\/strong> softmax arithmetic, normalization axis, uniform scores, context dimensions, alignment without labels, parameter sharing, and fixed versus dynamic context. <strong>Remember:<\/strong> score → normalize over source → weighted sum → decode.<\/p>\n"}, {"number": 4, "title": "Spatial attention, hierarchical attention & final recall", "scope": "Lecture 15: images and hierarchies", "html": "<h3 id=\"attention-over-image-locations\">Attention over image locations<\/h3>\n<p>An image has spatial positions rather than word positions. Use a CNN <strong>convolutional feature map<\/strong>, preserving a grid of region representations, as the attention inputs. A single flattened/global fully connected image summary does not provide an explicit list of spatial locations to attend over.<\/p>\n<p>A <strong>14×14×512<\/strong> feature map contains <strong>196 locations<\/strong>, each represented by <strong>512 features<\/strong>. Image-caption attention learns 196 weights for each generated word. Their weighted sum is a <strong>512-dimensional context<\/strong>, not a 196-dimensional context and not one weight per channel. The attention can focus on the person while generating “man,” then another region while generating an object word. Locations in a convolutional grid correspond to receptive fields, not necessarily one isolated pixel each.<\/p>\n<p>A <strong>7×7×256<\/strong> map similarly gives 49 locations and a 256-dimensional context. This is spatial attention over locations; channel attention would normalize or gate a different axis. Pooling the entire map into one vector before spatial attention removes the separate location list needed for this formulation.<\/p>\n<h3 id=\"a-document-or-dialogue-is-a-sequence-of-sequences\">A document or dialogue is a sequence of sequences<\/h3>\n<p>A document has sentences, and each sentence has words. A dialogue has utterances, and each utterance has words. A <strong>hierarchical encoder<\/strong> respects these two levels:<\/p>\n<ol type=\"1\">\n<li>A word-level RNN encodes each sentence or utterance.<\/li>\n<li>Its sentence/utterance vectors form a second sequence.<\/li>\n<li>A sentence/utterance-level RNN encodes that sequence.<\/li>\n<li>A classifier predicts a document class, or a decoder generates a summary/response.<\/li>\n<\/ol>\n<p>Without attention, a level may take its final state as its summary. With <strong>hierarchical attention<\/strong>, useful words are weighted within each sentence, then useful sentences are weighted within the document.<\/p>\n<p>For word j in sentence i:<\/p>\n<p><code>hᵂᵢⱼ = RNNword(hᵂᵢ,ⱼ₋₁,embedding(wᵢⱼ))<\/code><\/p>\n<p><code>uᵢⱼ = tanh(Ww hᵂᵢⱼ + bw)<\/code><\/p>\n<p><code>αᵢⱼ = softmax over words j of (uwᵀuᵢⱼ)<\/code><\/p>\n<p><code>vᵢ = Σⱼ αᵢⱼhᵂᵢⱼ<\/code><\/p>\n<p>At the sentence level:<\/p>\n<p><code>hˢᵢ = RNNsentence(hˢᵢ₋₁,vᵢ)<\/code><\/p>\n<p><code>uᵢ = tanh(Ws hˢᵢ + bs)<\/code><\/p>\n<p><code>βᵢ = softmax over sentences i of (usᵀuᵢ)<\/code><\/p>\n<p><code>d = Σᵢ βᵢhˢᵢ; P(class|document)=softmax(Vd+b)<\/code><\/p>\n<p>The word context vector uw and sentence context vector us are <strong>learned parameters<\/strong>, shared across documents; they express informative content for the task. In this document-classification formulation, a changing decoder state is not required as the query. They differ from the dynamically generated weighted context vectors vᵢ and d.<\/p>\n<p>Word attention weights sum to 1 <strong>separately within each sentence<\/strong>. Sentence attention weights sum to 1 across the document's sentences. They do not form one single flat softmax over all words and sentences together. If a local word weight is 0.6 and the sentence weight is 0.25, their product 0.15 is a useful illustrative two-level weighting. Since a sentence-level RNN transforms sentence representations, the final document vector is not generally just a flat sum of raw word vectors weighted by these products.<\/p>\n<h3 id=\"last-minute-comparisons\">Last-minute comparisons<\/h3>\n<table>\n<thead>\n<tr>\n<th>Confusable concepts<\/th>\n<th>Distinction<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Language model / conditional generator<\/td>\n<td>Prefix only / prefix plus source information<\/td>\n<\/tr>\n<tr>\n<td>Fixed context / attention context<\/td>\n<td>Same source summary / new weighted source summary per decoder step<\/td>\n<\/tr>\n<tr>\n<td>Score / attention weight<\/td>\n<td>Unnormalized real number / nonnegative normalized number<\/td>\n<\/tr>\n<tr>\n<td>Context vector / attention vector<\/td>\n<td>Weighted source features / distribution over source positions<\/td>\n<\/tr>\n<tr>\n<td>Image caption / image answer class<\/td>\n<td>Sequence of word predictions / one class prediction<\/td>\n<\/tr>\n<tr>\n<td>Spatial / hierarchical attention<\/td>\n<td>Regions of an image / words then sentences or utterances<\/td>\n<\/tr>\n<tr>\n<td>Attention weights / attention parameters<\/td>\n<td>Example-dependent computed values / trained shared scoring matrices and vectors<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Rapid recall:<\/strong> encode input; decode output; multiply conditional probabilities; add token losses; source softmax sums to 1 at each target step; context keeps feature width; soft attention trains through the task loss; image positions H×W, feature width C; hierarchy attends within sentences, then across sentences.<\/p>\n"}], "cases": [{"number": 1, "title": "Conditional generation and sequence loss", "html": "<p>Consider an encoder–decoder that conditions on source x and generates target tokens one at a time. <strong>GO/BOS<\/strong> starts generation and <strong>STOP/EOS<\/strong> ends it. Use natural logarithms and score the token probabilities explicitly given in each question.<\/p>\n"}, {"number": 2, "title": "Choose a model for the task", "html": "<p>Distinguish a single class prediction from a variable-length generated sequence. A CNN can encode spatial image content; an RNN can encode a sequence of word or frame representations. Assume ordinary end-to-end differentiable components unless stated otherwise.<\/p>\n"}, {"number": 3, "title": "Attention scores, weights and contexts", "html": "<p>Use <strong>eₜⱼ=vᵀtanh(Wsₜ₋₁+Uhⱼ+b)<\/strong>, <strong>αₜⱼ=exp(eₜⱼ)/Σₖexp(eₜₖ)<\/strong>, and <strong>cₜ=Σⱼαₜⱼhⱼ<\/strong>. For Questions 11–12, scores are <strong>[0,ln2,ln3]<\/strong>, and encoder states are <strong>h₁=(6,0),h₂=(0,3),h₃=(2,2)<\/strong>. All positions are valid, unmasked source positions.<\/p>\n"}, {"number": 4, "title": "Spatial and hierarchical attention", "html": "<p>Spatial attention weights locations in a convolutional feature map. Hierarchical document attention first weights words inside each sentence, then sentence-level hidden states inside the document. The two levels use their own normalization groups and learned scoring parameters.<\/p>\n"}], "questions": [{"n": 1, "stem": "Which factorization represents an autoregressive conditional sequence generator?", "options": {"A": "P(y|x)=ΣₜP(yₜ|x)", "B": "P(y|x)=∏ₜP(yₜ|y<ₜ,x)", "C": "P(y|x)=∏ₜP(x|yₜ) without a normalization term", "D": "P(y|x)=P(y₁|x), regardless of later tokens"}, "answer": "B", "explanation": {"right": "<p>The chain rule factors the probability of a whole output into conditional probabilities for each token given its prefix and source: <strong>P(y|x)=∏ₜP(yₜ|y&lt;ₜ,x)<\/strong>. The source and preceding outputs both provide context.<\/p>\n", "wrong": "<p><strong>A:<\/strong> sequence probabilities multiply, not add. <strong>C:<\/strong> reverses the conditioning and is not this chain-rule factorization. <strong>D:<\/strong> ignores the probabilities of all later tokens.<\/p>\n", "cue": "<p>Whole-sequence probability = product of next-token conditionals.<\/p>\n"}}, {"n": 2, "stem": "Which pairing of training and ordinary autoregressive generation is correct?", "options": {"A": "Teacher forcing always feeds previous predicted tokens; generation feeds the true target", "B": "Both require access to the true future target token", "C": "Training cannot use a decoder prefix", "D": "Teacher forcing feeds the previous true token; generation typically feeds the previous generated token"}, "answer": "D", "explanation": {"right": "<p>In teacher forcing, training inputs include the correct previous target token. At generation time it is unavailable, so the model normally feeds back its own generated token. The mismatch can allow earlier generation errors to affect later steps.<\/p>\n", "wrong": "<p><strong>A:<\/strong> reverses the two procedures. <strong>B:<\/strong> future target tokens are not required or available at inference. <strong>C:<\/strong> the decoder is explicitly conditioned on its prefix during both training and generation.<\/p>\n", "cue": "<p>Teacher provides the training prefix; the model supplies the inference prefix.<\/p>\n"}}, {"n": 3, "stem": "What are the usual roles of GO/BOS and STOP/EOS?", "options": {"A": "GO is the initial decoder input; predicting STOP indicates completion", "B": "GO resets every recurrent state at every output step; STOP starts the sequence", "C": "Both must be translated as ordinary source words", "D": "STOP requires output length to equal source length"}, "answer": "A", "explanation": {"right": "<p>GO supplies a starting token before any output has been generated. STOP is a learned end marker that lets the decoder terminate after a variable number of steps. A maximum-length limit is also commonly imposed.<\/p>\n", "wrong": "<p><strong>B:<\/strong> GO is not an every-step reset, and STOP does not begin generation. <strong>C:<\/strong> these are structural tokens, not ordinary words to translate literally. <strong>D:<\/strong> the decoder can end at a different length from the source.<\/p>\n", "cue": "<p>GO goes in first; STOP comes out last.<\/p>\n"}}, {"n": 4, "stem": "Two scored target tokens receive correct probabilities 0.8 and 0.5. What is their summed negative log-likelihood?", "options": {"A": "0.4", "B": "−ln(1.3)", "C": "−ln(0.4) ≈ 0.916", "D": "0.458 approximately"}, "answer": "C", "explanation": {"right": "<p>The scored sequence probability is 0.8×0.5=0.4. Its summed negative log-likelihood is <strong>−ln0.8−ln0.5=−ln0.4≈0.916<\/strong>.<\/p>\n", "wrong": "<p><strong>A:<\/strong> is the sequence probability, before the negative log. <strong>B:<\/strong> incorrectly adds probabilities, even exceeding one. <strong>D:<\/strong> is the mean token loss, 0.916/2, not the sum requested.<\/p>\n", "cue": "<p>Sum loss = negative log of the product; mean loss divides by token count.<\/p>\n"}}, {"n": 5, "stem": "What is a limitation of choosing the locally most likely token at every decoder step?", "options": {"A": "It cannot produce a STOP token", "B": "It need not yield the most likely complete output sequence", "C": "It requires source and target lengths to match", "D": "It eliminates the need for conditional probabilities"}, "answer": "B", "explanation": {"right": "<p>Greedy decoding optimizes each immediate choice. A slightly less likely early token can lead to a much more likely continuation, so its completed sequence can have a larger product probability. Beam search explores several prefixes but remains approximate at finite width.<\/p>\n", "wrong": "<p><strong>A:<\/strong> STOP can be one of the available predictions. <strong>C:<\/strong> greedy decoding places no equal-length constraint. <strong>D:<\/strong> it selects using the model’s conditional probabilities rather than eliminating them.<\/p>\n", "cue": "<p>Best next token does not guarantee best whole sentence.<\/p>\n"}}, {"n": 6, "stem": "Which is a suitable encoder–decoder arrangement for image captioning?", "options": {"A": "A word decoder with no access to the image", "B": "One fixed sentiment class for every image", "C": "An image CNN followed only by an image reconstruction loss", "D": "A CNN image encoder conditioning a recurrent word generator"}, "answer": "D", "explanation": {"right": "<p>A CNN extracts visual features; a recurrent decoder uses them and the generated prefix to predict caption words. Train against reference captions with target-token cross-entropy. Source features can initialize the decoder or be supplied repeatedly.<\/p>\n", "wrong": "<p><strong>A:<\/strong> cannot condition the caption on image content. <strong>B:<\/strong> changes the requested output from a caption to a class. <strong>C:<\/strong> describes reconstruction rather than supervised caption generation.<\/p>\n", "cue": "<p>Image in → CNN; words out → sequence decoder.<\/p>\n"}}, {"n": 7, "stem": "How does video captioning differ from video activity classification in the illustrated architectures?", "options": {"A": "Captioning generates a word sequence; activity classification predicts a single class", "B": "Captioning must ignore frame order", "C": "Activity classification must generate a sentence until STOP", "D": "Neither can use CNN features for frames"}, "answer": "A", "explanation": {"right": "<p>Both may use a CNN per frame followed by a temporal RNN. The output changes the head: captioning uses a language decoder, whereas activity recognition uses a class softmax from the sequence summary.<\/p>\n", "wrong": "<p><strong>B:<\/strong> frame order can be crucial to the action described. <strong>C:<\/strong> a single activity label does not require a word-by-word decoder. <strong>D:<\/strong> CNN frame encodings are appropriate inputs for a temporal model.<\/p>\n", "cue": "<p>Same video encoder can support different heads: class or caption.<\/p>\n"}}, {"n": 8, "stem": "For single-answer-class image question answering, which design fits the task?", "options": {"A": "Encode only the question and ignore the image", "B": "Encode only the image and ignore the question", "C": "Combine CNN image features with an RNN question representation, then classify the answer", "D": "Require a separate encoder for every answer class with no shared parameters"}, "answer": "C", "explanation": {"right": "<p>The answer depends on both the image and the question. A CNN image vector and a recurrent question summary can be concatenated and passed to a class softmax, trained with answer-class cross-entropy.<\/p>\n", "wrong": "<p><strong>A:<\/strong> lacks evidence about the displayed image. <strong>B:<\/strong> cannot distinguish questions about the same image. <strong>D:<\/strong> is unnecessary; a shared multimodal representation can feed a classifier over answer classes.<\/p>\n", "cue": "<p>Two information sources in; fuse both before answering.<\/p>\n"}}, {"n": 9, "stem": "What remains a limitation when the same final encoder vector c is concatenated to every decoder input?", "options": {"A": "The decoder cannot depend on the source at all", "B": "The source still passes through the same fixed-width summary at every step", "C": "It automatically creates a different source attention distribution at each step", "D": "It forces one output token per source token"}, "answer": "B", "explanation": {"right": "<p>Repeatedly supplying c keeps source conditioning available but does not restore source details that were compressed out of c. Dynamic attention instead retrieves weighted information from the list of encoder states.<\/p>\n", "wrong": "<p><strong>A:<\/strong> the decoder explicitly receives source information through c. <strong>C:<\/strong> a constant vector alone does not compute source-position scores or changing weights. <strong>D:<\/strong> this design permits different input and output lengths.<\/p>\n", "cue": "<p>Reusing the same summary is still fixed context.<\/p>\n"}}, {"n": 10, "stem": "How are soft-attention scoring parameters ordinarily trained when source–target alignment labels are unavailable?", "options": {"A": "They must remain random forever", "B": "They require a separate human alignment for every target word", "C": "They are determined only by input length", "D": "They receive gradients from the normal target prediction loss through differentiable attention"}, "answer": "D", "explanation": {"right": "<p>Scores, source softmax and the weighted context are differentiable. Target-token cross-entropy therefore propagates gradients through the context into the scoring network and encoder. Manual alignment supervision is not required for this standard setup.<\/p>\n", "wrong": "<p><strong>A:<\/strong> differentiable task loss can update them. <strong>B:<\/strong> alignment labels are optional extra supervision, not a requirement. <strong>C:<\/strong> input length sets the number of positions, not their learned relevance scores.<\/p>\n", "cue": "<p>Task loss trains attention through the weighted sum.<\/p>\n"}}, {"n": 11, "stem": "What attention weights result from scores [0,ln2,ln3]?", "options": {"A": "[1/6,1/3,1/2]", "B": "[0,1/2,1/2]", "C": "[1/3,1/3,1/3]", "D": "[1,2,3]"}, "answer": "A", "explanation": {"right": "<p>Exponentiation gives [1,2,3]. The denominator is 1+2+3=6, so softmax produces <strong>[1/6,2/6,3/6]=[1/6,1/3,1/2]<\/strong>.<\/p>\n", "wrong": "<p><strong>B:<\/strong> a finite score of zero yields exp(0)=1, not zero weight. <strong>C:<\/strong> uniform weights require equal scores. <strong>D:<\/strong> these are unnormalized exponentials and sum to six rather than one.<\/p>\n", "cue": "<p>Exponentiate first, then divide each entry by their sum.<\/p>\n"}}, {"n": 12, "stem": "Using the given scores and h₁=(6,0),h₂=(0,3),h₃=(2,2), what is the attention context?", "options": {"A": "(8,5)", "B": "(1/6,1/3,1/2)", "C": "(2,2)", "D": "(6,0,0,3,2,2)"}, "answer": "C", "explanation": {"right": "<p>c=(1/6)(6,0)+(1/3)(0,3)+(1/2)(2,2)=(1,0)+(0,1)+(1,1)=<strong>(2,2)<\/strong>. A weighted sum preserves the 2D feature width.<\/p>\n", "wrong": "<p><strong>A:<\/strong> is the unweighted sum. <strong>B:<\/strong> is the three-position attention distribution, not the feature context. <strong>D:<\/strong> concatenates the source states instead of averaging them.<\/p>\n", "cue": "<p>Weights live over positions; context lives in the feature space.<\/p>\n"}}, {"n": 13, "stem": "For one decoder step t, over which index must ordinary source attention normalize?", "options": {"A": "Over every decoder time step for each fixed source word", "B": "Over source positions j, with Σⱼαₜⱼ=1", "C": "Over feature coordinates inside each source vector", "D": "Only over the target vocabulary"}, "answer": "B", "explanation": {"right": "<p>The current output step chooses a distribution across available source locations. Holding t fixed, softmax divides each source score by the sum of exponentials over source positions j.<\/p>\n", "wrong": "<p><strong>A:<\/strong> changes the normalization axis and does not give a source distribution for the current output step. <strong>C:<\/strong> would normalize feature channels, a different operation. <strong>D:<\/strong> vocabulary softmax predicts output tokens; source attention is a separate distribution.<\/p>\n", "cue": "<p>Fix the output step; normalize across the input positions.<\/p>\n"}}, {"n": 14, "stem": "If the same constant 100 is added to all source attention scores at a fixed output step, what happens mathematically?", "options": {"A": "Every weight increases by 100", "B": "The weights become negative", "C": "Only the first source position retains nonzero weight", "D": "The normalized weights are unchanged"}, "answer": "D", "explanation": {"right": "<p>exp(eⱼ+100)=exp(100)exp(eⱼ); the common exp(100) factor cancels between numerator and denominator. Stable implementations exploit this by subtracting the largest score before exponentiating.<\/p>\n", "wrong": "<p><strong>A:<\/strong> softmax is not a coordinatewise shift of its outputs. <strong>B:<\/strong> exponentials and their normalized weights are nonnegative. <strong>C:<\/strong> adding the same constant changes no relative score differences.<\/p>\n", "cue": "<p>Softmax depends on score differences, not a shared offset.<\/p>\n"}}, {"n": 15, "stem": "All four valid source positions receive the same finite attention score. What is their context?", "options": {"A": "The arithmetic mean of the four source-state vectors", "B": "The first source vector only", "C": "A zero vector regardless of the source states", "D": "The sum of the source states without scaling"}, "answer": "A", "explanation": {"right": "<p>Equal scores give equal exponentials, so each source weight is 1/4. The context is <strong>(h₁+h₂+h₃+h₄)/4<\/strong>. Its value need not be zero.<\/p>\n", "wrong": "<p><strong>B:<\/strong> would require attention concentrated on one position. <strong>C:<\/strong> depends on the actual vectors and is not implied by equal weights. <strong>D:<\/strong> omits normalization by four.<\/p>\n", "cue": "<p>Equal scores → uniform attention → mean of states.<\/p>\n"}}, {"n": 16, "stem": "A CNN feature map is 14×14×512. For spatial attention over locations, how many weights are computed per decoder step, and what is the context width?", "options": {"A": "512 weights; context width 196", "B": "100352 weights; context width 1", "C": "196 weights; context width 512", "D": "14 weights; context width 14"}, "answer": "C", "explanation": {"right": "<p>The 14×14 spatial grid has <strong>196 locations<\/strong>. Each is a 512D vector. Attention normalizes 196 location weights and sums those feature vectors, giving a <strong>512D context<\/strong>.<\/p>\n", "wrong": "<p><strong>A:<\/strong> interchanges location count and feature width. <strong>B:<\/strong> counts every feature scalar as a location and discards vector structure. <strong>D:<\/strong> ignores one spatial dimension and the channel dimension.<\/p>\n", "cue": "<p>H×W locations; C features per location; context width C.<\/p>\n"}}, {"n": 17, "stem": "Which image representation directly provides the separate locations needed for spatial caption attention?", "options": {"A": "One final class label only", "B": "A convolutional feature grid before global spatial aggregation", "C": "A single scalar training loss", "D": "Only the number of pixels in the image"}, "answer": "B", "explanation": {"right": "<p>A convolutional feature grid retains a feature vector at each spatial position. The decoder can assign different weights to those locations for each output token.<\/p>\n", "wrong": "<p><strong>A:<\/strong> a class label does not retain region features. <strong>C:<\/strong> a loss is a training objective, not a collection of image locations. <strong>D:<\/strong> image size gives no learned local visual content.<\/p>\n", "cue": "<p>To attend to regions, keep region vectors.<\/p>\n"}}, {"n": 18, "stem": "Which ordering describes hierarchical document attention?", "options": {"A": "Normalize one distribution jointly over all words and sentence labels", "B": "First classify each word independently, then ignore the sentence order", "C": "Use only the final word of the entire document", "D": "Attend to words within sentences, encode sentence vectors, then attend to sentence-level states"}, "answer": "D", "explanation": {"right": "<p>A word-level encoder and attention build one vector per sentence. A sentence-level encoder processes those vectors, and sentence attention builds the document representation. Classification can then use a document softmax.<\/p>\n", "wrong": "<p><strong>A:<\/strong> the hierarchy uses separate normalization groups at its two levels. <strong>B:<\/strong> ignores the learned contextual encoders and document structure. <strong>C:<\/strong> is a final-state shortcut, not hierarchical attention.<\/p>\n", "cue": "<p>Words make sentences; sentence states make the document.<\/p>\n"}}, {"n": 19, "stem": "In a hierarchical attention classifier, what are the word and sentence context vectors u_w and u_s used in the scoring networks?", "options": {"A": "Learned shared parameters that score informative word/sentence content", "B": "The manually supplied correct attention distributions for each document", "C": "Always the previous decoder hidden state", "D": "The final weighted document representation for each example"}, "answer": "A", "explanation": {"right": "<p>u_w and u_s are learned vectors in the two scoring functions. They are trained with the classifier and shared across examples, helping identify informative words and sentences for the task.<\/p>\n", "wrong": "<p><strong>B:<\/strong> no manual attention labels are required. <strong>C:<\/strong> this classifier does not require an autoregressive decoder query; that is another attention setup. <strong>D:<\/strong> weighted document representations vary by example and are outputs of the hierarchy, not these fixed learned scoring parameters.<\/p>\n", "cue": "<p>Scoring context parameters are learned; weighted contexts are computed per example.<\/p>\n"}}, {"n": 20, "stem": "Full source attention compares N=5 encoder states at each of M=4 decoder steps. How many source–target score evaluations occur, and does this require 20 separate scoring networks?", "options": {"A": "9 evaluations; 9 separate scoring networks", "B": "5 evaluations; one network per decoder step", "C": "20 evaluations; shared scoring parameters are reused", "D": "4 evaluations; 20 separately learned parameter sets"}, "answer": "C", "explanation": {"right": "<p>There are <strong>N×M=5×4=20<\/strong> source–target pairs. The same scoring matrices and vector are reused for all of them, so example lengths change computation but not the number of distinct attention scoring parameters.<\/p>\n", "wrong": "<p><strong>A:<\/strong> adds the lengths rather than forming all pairs and incorrectly separates parameters. <strong>B:<\/strong> omits repeated scoring at later output steps. <strong>D:<\/strong> omits source positions and incorrectly makes parameters depend on sequence length.<\/p>\n", "cue": "<p>Attention computes many pair scores with one shared scoring function.<\/p>\n"}}]}], "reference": [{"number": 21, "title": "Formula sheet — Neurons, activations and losses", "scope": "Weeks 1–3, 8", "html": "<h1 id=\"match-the-formula-to-the-requested-quantity\">Match the formula to the requested quantity<\/h1>\n<table>\n<thead>\n<tr>\n<th>Quantity<\/th>\n<th>Formula / interpretation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Affine score<\/td>\n<td>z=wᵀx+b; not yet an activation or label<\/td>\n<\/tr>\n<tr>\n<td>Hard output<\/td>\n<td>1 ifz≥0, otherwise0; obey any different tie convention<\/td>\n<\/tr>\n<tr>\n<td>Threshold versus bias<\/td>\n<td>wᵀx≥θ ⇔ wᵀx+b≥0 withb=−θ<\/td>\n<\/tr>\n<tr>\n<td>Signed margin<\/td>\n<td>y(wᵀx+b), fory∈{−1,+1}<\/td>\n<\/tr>\n<tr>\n<td>Perceptron repair<\/td>\n<td>w←w+ηyx,b←b+ηy on a specified mistake/tie<\/td>\n<\/tr>\n<tr>\n<td>At least k active among n bits<\/td>\n<td>sum(j=k..n) C(n,j) accepted patterns, with unit weights<\/td>\n<\/tr>\n<tr>\n<td>Sigmoid<\/td>\n<td>σ(z)=1/(1+e^(−z)); derivativeσ(1−σ)<\/td>\n<\/tr>\n<tr>\n<td>Probability cutoff t<\/td>\n<td>logit cutofflog(t/(1−t))<\/td>\n<\/tr>\n<tr>\n<td>tanh<\/td>\n<td>derivative1−tanh²(z)<\/td>\n<\/tr>\n<tr>\n<td>ReLU<\/td>\n<td>max(0,z); derivative1 positive,0 negative<\/td>\n<\/tr>\n<tr>\n<td>Softmax<\/td>\n<td>pᵢ=e^(zᵢ−c)/Σe^(zⱼ−c), any sharedc, commonlymaxz<\/td>\n<\/tr>\n<tr>\n<td>Squared loss<\/td>\n<td>e², derivative with respect to prediction2e<\/td>\n<\/tr>\n<tr>\n<td>Half-squared loss<\/td>\n<td>½e², prediction derivativee<\/td>\n<\/tr>\n<tr>\n<td>MSE / RMSE<\/td>\n<td>(1/N)Σeᵢ² / square root of that quantity<\/td>\n<\/tr>\n<tr>\n<td>Binary cross-entropy<\/td>\n<td>−[ylogp+(1−y)log(1−p)]<\/td>\n<\/tr>\n<tr>\n<td>Softmax cross-entropy<\/td>\n<td>−Σyᵢlogpᵢ; one-hot case−logp_correct<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>e=ŷ−y.<\/strong> With sigmoid+BCE or softmax+cross-entropy, derivative with respect to the corresponding logits is <strong>p−y<\/strong> before any mean-reduction factor. Do not use this simplification for every other loss/activation pair. With raw squared loss and sigmoid, multiply by2(p−y)p(1−p).<\/p>\n<h2 id=\"fast-forwardbackward-template\">Fast forward/backward template<\/h2>\n<p>For a layer z=W a+b,h=φ(z): storea,z,h during forward. Given incoming∂L/∂h, compute <strong>δ=(∂L/∂h)⊙φ'(z)<\/strong>; weight gradient <strong>δaᵀ<\/strong>, bias gradient <strong>δ<\/strong>, previous activation gradient <strong>Wᵀδ<\/strong>. Sum shared paths and accumulate batch contributions with the chosen sum/mean convention. Parameter updates use the old forward pass's values.<\/p>\n<h2 id=\"numbers-to-recognize\">Numbers to recognize<\/h2>\n<p>OR:w(1,1),b=−0.5. AND:w(1,1),b=−1.5. Sigmoid0→0.5; sigmoid2≈0.881; sigmoid−4≈0.018. Four-bit at-least-three count5. Delivery SSE33,MSE8.25; second-model MSE1. Scalar routing w=4→loss9,gradient−18,update5.8 atη0.1. Half-squared calibration gradients:w₂−2,w₁−4.<\/p>\n<p><strong>Frequent traps:<\/strong> derivative variable matters;½ cancels2; a mean divides by sample count; pre-activation is not sigmoid output; nonnegative loss can have negative gradients; thresholding a single affine sigmoid still gives a linear boundary; XOR needs more than one ordinary separator in the original two-feature space.<\/p>\n"}, {"number": 22, "title": "Formula sheet — Optimization and regularization", "scope": "Weeks 3–4, 7", "html": "<h1 id=\"apply-one-consistent-update-convention\">Apply one consistent update convention<\/h1>\n<table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>State / update<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gradient descent<\/td>\n<td>θ←θ−ηg, whereg=∇J at oldθ<\/td>\n<\/tr>\n<tr>\n<td>Assignment momentum<\/td>\n<td>v←βv+ηg; θ←θ−v<\/td>\n<\/tr>\n<tr>\n<td>Alternate momentum convention<\/td>\n<td>v←βv+g; θ←θ−ηv; do not mix stored velocities<\/td>\n<\/tr>\n<tr>\n<td>AdaGrad<\/td>\n<td>r←r+g²; θ←θ−ηg/(√r+ε)<\/td>\n<\/tr>\n<tr>\n<td>RMSProp<\/td>\n<td>r←ρr+(1−ρ)g²; scaled step using√r<\/td>\n<\/tr>\n<tr>\n<td>Adam first moment<\/td>\n<td>m←β₁m+(1−β₁)g<\/td>\n<\/tr>\n<tr>\n<td>Adam second moment<\/td>\n<td>v←β₂v+(1−β₂)g²<\/td>\n<\/tr>\n<tr>\n<td>Adam bias correction<\/td>\n<td>m̂=m/(1−β₁ᵗ),v̂=v/(1−β₂ᵗ)<\/td>\n<\/tr>\n<tr>\n<td>Adam parameter update<\/td>\n<td>θ←θ−ηm̂/(√v̂+ε)<\/td>\n<\/tr>\n<tr>\n<td>L2 penaltyαΣw²<\/td>\n<td>Add2αw to data gradient<\/td>\n<\/tr>\n<tr>\n<td>L1 penaltyλΣabs(w)<\/td>\n<td>Addλsign(w) away fromzero; subgradient atzero<\/td>\n<\/tr>\n<tr>\n<td>Batch count/epoch<\/td>\n<td>ceiling(N/B) when keeping final partial batch<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Squares/divisions in adaptive updates are coordinatewise. ε stabilizes denominators;η is the step-size scale. The first moment is directional; second raw moment tracks squared magnitude. Momentum and batch size are separate axes: a mini-batch gradient can feed momentum, Adam or plain GD.<\/p>\n<h2 id=\"five-calculation-checks\">Five calculation checks<\/h2>\n<p><strong>1. Descent:<\/strong> L=(w−4)²,w=1,η=0.1→g−6→wnew=1.6. Error recurrenceeₜ₊₁=(1−2η)eₜ; convergence requires0&lt;η&lt;1 for this particular quadratic.<\/p>\n<p><strong>2. Momentum:<\/strong> β=0.8,vold=0.5,η=0.1,g3→v=0.7→w=5 becomes4.3. Do not multiply0.7 byη a second time under the assignment's definition.<\/p>\n<p><strong>3. AdaGrad:<\/strong> rold9,g4→r=25,√r=5. Withη0.5, step0.4. Squaring the old accumulator too is not part of the rule.<\/p>\n<p><strong>4. L2:<\/strong> w=3,gdata=4,α=2→gpenalty12,total16. Atη0.1,wnew=1.4. If the objective usedα/2 instead, the answer would differ.<\/p>\n<p><strong>5. Mini-batches:<\/strong> N=12,B=3→4 updates/epoch. For equal-size gradients2,4,6,8 at the sameθ, average5. Unequal batches require example-count weighting.<\/p>\n<h2 id=\"biasvariance-and-averaging\">Bias–variance and averaging<\/h2>\n<p><strong>Bias²=(E[f̂(x)]−f(x))²<\/strong>; <strong>variance=E[(f̂−E[f̂])²]<\/strong>. Expected squared prediction error adds irreducible noise under the standard assumptions. For41,49,45,53 versus true48: mean47,bias²1,empirical variance20,total mismatch21. Do not square the average residual and call it MSE.<\/p>\n<p>ForK equal-variance models with pairwise error correlationρ, <strong>Var(average)=σ²[ρ+(1−ρ)/K]<\/strong>. Independent errorsρ0 giveσ²/K; perfectly correlated errors giveσ². Averaging does not automatically remove systematic bias, and independently initialized networks can still make correlated errors.<\/p>\n"}, {"number": 23, "title": "Formula sheet — Matrices, PCA and SVD", "scope": "Weeks 5–6, 9", "html": "<h1 id=\"check-dimensions-before-calculating\">Check dimensions before calculating<\/h1>\n<table>\n<thead>\n<tr>\n<th>Object / identity<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A m×n timesx n×1<\/td>\n<td>Outputm×1<\/td>\n<\/tr>\n<tr>\n<td>Eigenpair<\/td>\n<td>Au=λu,u≠0, squareA<\/td>\n<\/tr>\n<tr>\n<td>Trace / determinant<\/td>\n<td>Sum / product of eigenvalues, including multiplicity<\/td>\n<\/tr>\n<tr>\n<td>Rank<\/td>\n<td>Number of independent directions;≤min(m,n)<\/td>\n<\/tr>\n<tr>\n<td>New basis coordinates<\/td>\n<td>Bc=x; c=B⁻¹x ifB invertible<\/td>\n<\/tr>\n<tr>\n<td>Orthonormal basis<\/td>\n<td>BᵀB=I; coordinatesc=Bᵀx<\/td>\n<\/tr>\n<tr>\n<td>Centered covariance<\/td>\n<td>XᵀX/N or/(N−1), as specified<\/td>\n<\/tr>\n<tr>\n<td>Projected variance<\/td>\n<td>uᵀΣu withunitu<\/td>\n<\/tr>\n<tr>\n<td>PCA retained fraction<\/td>\n<td>Sum retained covariance eigenvalues / sum all<\/td>\n<\/tr>\n<tr>\n<td>SVD<\/td>\n<td>M=UΣVᵀ; singular valuesσᵢ≥0<\/td>\n<\/tr>\n<tr>\n<td>Best rank-k truncation<\/td>\n<td>M_k=sum(i=1..k) sigma_i u_i v_i^T<\/td>\n<\/tr>\n<tr>\n<td>Truncation error<\/td>\n<td>Frobenius error²=sum(i&gt;k) sigma_i^2<\/td>\n<\/tr>\n<tr>\n<td>PCA through centered SVD<\/td>\n<td>Covariance eigenvaluesσᵢ²/N (or σᵢ²/(N−1)), directionsV<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"four-worked-patterns\">Four worked patterns<\/h2>\n<p><strong>Diagonal transformation:<\/strong> A=diag(3,2) maps(1,0)→(3,0),(0,1)→(0,2). Trace5,determinant6,rank2. A general diagonal vector(1,1) is not an eigenvector because(3,2) is not its scalar multiple.<\/p>\n<p><strong>Basis coefficients:<\/strong> b₁(1,1),b₂(1,−1),x(4,2). Solve c₁+c₂4,c₁−c₂2→c₁3,c₂1. Orthogonal columns of length√2 are not unit columns; do not directly useBᵀ asB⁻¹ until normalizing appropriately.<\/p>\n<p><strong>PCA:<\/strong> Σ=diag(4,1),top axisfirst. Keepk1→dimension1,variance fraction4/5=80%. For a different covariance with eigenvalues9,3,2,retain firsttwo→12/14≈85.7%. Choose the smallestk whose cumulative fraction meets the requested threshold.<\/p>\n<p><strong>SVD:<\/strong> M=diag(3,1). Rank-one approximationdiag(3,0); error1; squared-energy retention9/10=90%. The answer80% belongs to the separate PCA covariance example, not this matrix. For singular values5,3,1,retain two→squared error1 and energy(25+9)/(25+9+1)=34/35.<\/p>\n<h2 id=\"shape-of-a-word-factorization-model\">Shape of a word-factorization model<\/h2>\n<p>ForX6000×6000,k=200: U_k6000×200,Sigma_k200×200,V_k^T200×6000; product returns6000×6000. Word tableE=U_k Sigma_k has6000 rows oflength200. PCA sample scores for centered data likewise useU_k Sigma_k, whereas principal directions areV_k.<\/p>\n<p><strong>Cautions:<\/strong> covariance eigenvalues are variances, singular values are their square-root relatives after scaling; centering and standardizing differ; the zero vector is not an eigenvector; PCA preserves variance rather than labels; SVD basis signs/rotations in degenerate subspaces need not be unique. Linear-autoencoder principal subspace equivalence does not force identical latent coordinates.<\/p>\n"}, {"number": 24, "title": "Formula sheet — Autoencoders, dropout and normalization", "scope": "Weeks 6–8", "html": "<h1 id=\"name-the-input-target-code-and-state\">Name the input, target, code and state<\/h1>\n<p><strong>Autoencoder:<\/strong> z=f(x),x̂=g(z),objectiveLrec(target,x̂)+λΩ. <strong>Denoising:<\/strong> encoderinputx̃,clean targetx. <strong>Sparse:<\/strong> discourage excessive hidden activity. <strong>Contractive:<\/strong> discourage local encoder sensitivity throughλ||∂f/∂x||²F. A bottleneck controls width; sparsity controls activity; contractivity controls a local derivative.<\/p>\n<p><strong>Numerical cases:<\/strong> x(4,2),zaverage3,decoder(3,3)→squared-sum loss2. Clean(5,1),corrupted(5,0),prediction(4,1)→loss1 against clean target. Lrec=0.8,penalty0.3,λ2→weighted penalty0.6,total1.4. Dividing by2 is only valid if the loss asks for a mean or half-sum.<\/p>\n<h2 id=\"batch-normalization-checklist\">Batch normalization checklist<\/h2>\n<p><strong>μ=Σa/m; v=Σ(a−μ)²/m; â=(a−μ)/√(v+ε); output=γâ+β.<\/strong> Mean/variance are statistics;γ/β are trainable. For1,3,5,7: μ4,v=5,standard deviation√5. Withoutε,normalized values−3/√5,−1/√5,1/√5,3/√5. Their mean0 and average square1. Withγ2,β=1, output mean1 and variance4 whenε ignored.<\/p>\n<p>Training usually computes current batch statistics and updates running estimates; inference uses stored estimates. The assignment placesBN between affine transform andReLU. The traditional key mentions reducing shifting layer-input distributions; the concrete mechanism is normalization plus learned affine adjustment, with optimization effects beyond that simple explanation.<\/p>\n<h2 id=\"initialization\">Initialization<\/h2>\n<p>Glorot normalvariance2/(fan_in+fan_out); assignment's equal-fan form1/n. He normalvariance2/fan_in. Normal standard deviation is square root of variance. Uniform[−a,a] hasvariancea²/3. Withn200:0.005/0.010 variance for caseXavier/He,not0.005/0.010 standard deviation.<\/p>\n<h2 id=\"dropout-and-data-counting\">Dropout and data counting<\/h2>\n<p>Keep maskmᵢ~Bernoulli(p); inverted-dropouttraining outputmᵢaᵢ/p,expected outputaᵢ. Evaluation uses the full activation under this convention. Expected active unitsnp,variance(np(1−p)) for independent masks. Withn50,p=0.8:expected40,variance8; expected dropped10. The exact active count is random.<\/p>\n<p>900 images×70%→630 originals for training. Two <strong>additional<\/strong> variants each→630×3=1890 total. Validation270 remains separate. Split original/group identities before augmentation to prevent near-duplicate leakage. A transformed example is not an entirely independent observation, so arithmetic size alone does not guarantee a proportional benefit.<\/p>\n<h2 id=\"pretraining-versus-regularization-versus-optimization\">Pretraining versus regularization versus optimization<\/h2>\n<p>Greedy pretraining supplies layer-wise starting features, followed by joint fine-tuning. Regularization changes preferred solutions/effective fitting, such asL2/dropout/early stopping. Optimizers determine how updates follow gradients. Batch normalization changes intermediate computations and statistic use. These mechanisms can interact but do not mean the same thing or remove the need for a loss.<\/p>\n<p><strong>Rapid check:<\/strong> noisy in/clean target→denoising;few active→sparse;small Jacobian→contractive;batch mean/variance plusγβ→BN;running direction→momentum;random activation mask→dropout;validation minimum→early stopping.<\/p>\n"}, {"number": 25, "title": "Worked CNN calculation sheet", "scope": "Week 10 and unfamiliar architectures", "html": "<h1 id=\"trace-a-complete-small-image-model\">Trace a complete small image model<\/h1>\n<p>Input <strong>32×32×3<\/strong>→conv3×3,16 filters,stride1,padding1→max pool2×2,stride2→conv3×3,32 filters,stride1,no padding→GAP→5-class dense output. All convolutions are standard, dilation1, with biases.<\/p>\n<table>\n<thead>\n<tr>\n<th>Stage<\/th>\n<th>Output shape<\/th>\n<th>Trainable parameters<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Input<\/td>\n<td>32×32×3<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>Conv1<\/td>\n<td>32×32×16<\/td>\n<td>(3×3×3+1)×16=448<\/td>\n<\/tr>\n<tr>\n<td>Pool<\/td>\n<td>16×16×16<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>Conv2<\/td>\n<td>14×14×32<\/td>\n<td>(3×3×16+1)×32=4640<\/td>\n<\/tr>\n<tr>\n<td>GAP<\/td>\n<td>32<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>Dense5<\/td>\n<td>5<
