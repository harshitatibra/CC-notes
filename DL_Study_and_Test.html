g-features-and-normalize-activations\">Learn good starting features and normalize activations<\/h1>\n<h2 id=\"greedy-layer-wise-pretraining\">Greedy layer-wise pretraining<\/h2>\n<p>Train the first hidden layer with an unsupervised reconstruction objective. Freeze it and train the second using its outputs; continue. Add the task output and fine-tune the entire network using labeled examples. <strong>Pretraining<\/strong> supplies an initialization/representation; <strong>fine-tuning<\/strong> adapts it to the final task. Freezing during the greedy stage does not imply those layers must remain frozen forever.<\/p>\n<p>This historical strategy helps explain how useful features can be learned when direct early-layer gradients are weak. It is not mandatory for every deep model: suitable activations, initialization, normalization and architectures can allow direct supervised training. Reconstruction uses targets derived from inputs even without class labels.<\/p>\n<h2 id=\"batch-normalization-equations\">Batch-normalization equations<\/h2>\n<p>For one feature across m batch observationsaᵢ:<\/p>\n<p><strong>μ=(1/m)Σaᵢ; v=(1/m)Σ(aᵢ−μ)²; âᵢ=(aᵢ−μ)/√(v+ε); outputᵢ=γâᵢ+β.<\/strong><\/p>\n<p>μ,v are computed statistics; γ,β are learned parameters. ε stabilizes the denominator. Normalization is not the same as forcing outputs tozero: learned scale/shift can select an appropriate representation. Ignoringε, normalized batch mean is0 and average squared deviation1 ifv&gt;0; withε, variance isv/(v+ε), slightly below1.<\/p>\n<h2 id=\"numerical-batch\">Numerical batch<\/h2>\n<p>Values1,3,5,7 give mean4; deviations−3,−1,1,3; squared deviations9,1,1,9; variance20/4=<strong>5<\/strong>. Standard deviation√5≈2.236. Ignoringε,γ=1,β=0 gives normalized values <strong>−1.342,−0.447,0.447,1.342<\/strong>. Using an unbiased sample denominator3 would instead give6.667 and is not the requested training-normalization calculation.<\/p>\n<p>Assignment order is <strong>linear/affine→BN→ReLU<\/strong>. This is a common arrangement, not an absolute law for every architecture. For convolutional BN, statistics are often computed per channel over batch and spatial positions, with oneγ/β per channel. Dense BN usually treats each feature separately.<\/p>\n<h2 id=\"training-versus-inference\">Training versus inference<\/h2>\n<p>Training normally uses current mini-batch statistics and updates running estimates. Inference normally uses stored running mean/variance, giving behavior less dependent on who else is in a test batch. Tiny/atypical batches or distribution shifts can degrade estimates. γ/β remain learned at inference; they are not discarded with current batch statistics. Dropout, unlike ordinary BN's stored normalization, is normally turned off for evaluation.<\/p>\n<p><strong>Layer normalization<\/strong> computes statistics within an example over selected features rather than across the batch; <strong>batch normalization<\/strong> uses batch grouping. Input standardization uses dataset/preprocessing statistics and is distinct from inserting BN inside the network.<\/p>\n<p>The supplied key describes BN as reducing changing layer-input distributions, the traditional <strong>internal covariate shift<\/strong> explanation. Preserve that answer for its MCQ, while knowing the mechanism is explicit standardization plus learned scale/shift. Research also emphasizes optimization smoothing; do not treat distribution-shift reduction as the only settled explanation. References: <a href=\"https://arxiv.org/abs/1502.03167\">original BN paper<\/a>, <a href=\"https://arxiv.org/abs/1805.11604\">optimization analysis<\/a>.<\/p>\n<p><strong>Memory:<\/strong> statistics are computed; γ/β are learned; training and inference use different statistic sources; BN helps training but does not replace backpropagation or guarantee perfect classification.<\/p>\n"}], "cases": [{"number": 1, "title": "Insurance Claim Review Prediction", "html": "<p>An eight-hidden-layer network has sigmoid hidden activations that saturate, giving very small early-layer gradients. Replace hidden activations with <strong>ReLU(a)=max(0,a)<\/strong> while retaining a sigmoid binary output. For comparison, <strong>σ(−4)≈0.018<\/strong>, <strong>σ(2)≈0.88<\/strong>.<\/p>\n"}, {"number": 2, "title": "Solar Power Forecasting", "html": "<p>A seven-hidden-layer network uses <strong>ReLU<\/strong>. Initial weight variance 1 led to unstable activations and oscillating loss. Compare <strong>Xavier: Var(w)=1/n<\/strong> and <strong>He: Var(w)=2/n<\/strong>, with <strong>n=200 input connections<\/strong>.<\/p>\n"}, {"number": 3, "title": "Warehouse Sensor Fault Detection", "html": "<p>Train a ten-hidden-layer model using greedy layer-wise pretraining. Train the first layer using an unsupervised reconstruction task; freeze it while training the second on its outputs; continue layer by layer. Then add the output layer and fine-tune the whole network using labeled examples.<\/p>\n"}, {"number": 4, "title": "Laboratory Test Result Prediction", "html": "<p>Insert <strong>batch normalization after the affine/linear transformation and before ReLU<\/strong>. One neuron's mini-batch values are <strong>1,3,5,7<\/strong>. Use <strong>mean=(1/m)Σaᵢ<\/strong>, <strong>variance=(1/m)Σ(aᵢ−mean)²<\/strong>. Ignore learnable scale/shift for the numerical questions. Actual normalization uses <strong>(a−mean)/√(variance+ε)<\/strong>.<\/p>\n"}], "questions": [{"n": 1, "stem": "Why can sigmoid hidden layers slow down training in a deep network?", "options": {"A": "They can saturate and produce very small gradients.", "B": "They always output negative values under the given conditions.", "C": "They remove all nonlinear behavior.", "D": "They force every weight to become zero."}, "answer": "A", "explanation": {"right": "<p>Sigmoid derivatives areσ(z)(1−σ(z))≤¼ and approach0 in saturation. Multiplying many small derivatives across layers can make early-layer gradients very small, slowing learning.<\/p>\n", "wrong": "<p>B is false because sigmoid outputs are positive. C is false because sigmoid is nonlinear. D makes an unsupported claim that weights must all become zero.<\/p>\n", "cue": "<p>Saturation is a flat part of the activation curve; small local slopes multiply through backpropagation.<\/p>\n"}}, {"n": 2, "stem": "What is ReLU(−4)?", "options": {"A": "-4", "B": "-1", "C": "0", "D": "4"}, "answer": "C", "explanation": {"right": "<p>ReLU(−4)=max(0,−4)=0. Negative inputs are clipped, not reflected.<\/p>\n", "wrong": "<p>A−4 is the identity output. B=−1 resembles a sign/tanh-style value, not ReLU. D4 is the absolute value.<\/p>\n", "cue": "<p>ReLU keeps positive values and replaces negative values with zero.<\/p>\n"}}, {"n": 3, "stem": "What is ReLU(2)?", "options": {"A": "0", "B": "-2", "C": "1", "D": "2"}, "answer": "D", "explanation": {"right": "<p>ReLU(2)=max(0,2)=2. It is linear with slope1 on its positive branch.<\/p>\n", "wrong": "<p>A0 would incorrectly clip a positive input. B=−2 reverses sign. C1 confuses ReLU with a bounded or threshold activation.<\/p>\n", "cue": "<p>Positive ReLU output equals its input, not a probability or binary label.<\/p>\n"}}, {"n": 4, "stem": "Which property makes ReLU helpful for positive pre-activation values?", "options": {"A": "It bounds hidden outputs between 0 and 1, as sigmoid would.", "B": "It avoids saturation and keeps a useful gradient.", "C": "It converts classification into clustering.", "D": "It makes the loss function unnecessary."}, "answer": "B", "explanation": {"right": "<p>For positive pre-activations, ReLU's derivative is1 and the function does not flatten as the input increases. This avoids the positive-side saturation of sigmoid and supports gradient flow.<\/p>\n", "wrong": "<p>A wrongly says ReLU is bounded0 to1. C changes the task without basis. D removes a still-needed loss. Negative ReLU inputs have derivative0, so ReLU does not eliminate every gradient problem.<\/p>\n", "cue": "<p>ReLU helps on the positive branch; dead negative units and weight products can still cause training difficulties.<\/p>\n"}}, {"n": 5, "stem": "Why is the output layer still kept as sigmoid in this binary classifier?", "options": {"A": "It maps the final score to a probability-like value between 0 and 1.", "B": "It is required for every hidden layer for the described model.", "C": "It guarantees no validation error after training on every future test case.", "D": "It prevents all negative input features for the data shown here."}, "answer": "A", "explanation": {"right": "<p>A sigmoid output converts the final logit to(0,1), suitable for a binary-class probability model. Hidden activations and output activations have different jobs, so replacing hidden sigmoids does not require replacing the output sigmoid.<\/p>\n", "wrong": "<p>B falsely requires sigmoid everywhere. C claims guaranteed generalization. D confuses the output's range with restrictions on input feature signs.<\/p>\n", "cue": "<p>Choose output activation for the task; choose hidden activations for representation and trainability. Probability-like outputs are not automatically well calibrated.<\/p>\n"}}, {"n": 6, "stem": "What problem can poor initialization create in a deep network?", "options": {"A": "It automatically removes all noise from data.", "B": "It can cause activations or gradients to explode or vanish.", "C": "It guarantees underfitting only under the given conditions.", "D": "It changes regression targets into class labels."}, "answer": "B", "explanation": {"right": "<p>Repeated transformations amplify or shrink signal variance depending on weight scale and activation. Poor initialization can therefore produce exploding or vanishing activations/gradients before useful learning begins.<\/p>\n", "wrong": "<p>A removes noise without a denoising mechanism. C says only underfitting is possible, ignoring instability. D changes targets, which initialization does not do.<\/p>\n", "cue": "<p>Initialization controls starting signal scale and symmetry, not the dataset's labels.<\/p>\n"}}, {"n": 7, "stem": "What is the Xavier variance for n = 200?", "options": {"A": "0.020", "B": "0.200", "C": "0.100", "D": "0.005"}, "answer": "D", "explanation": {"right": "<p>Use the case's Xavier variance1/n. For n=200, variance=1/200=0.005. If asked for standard deviation, take√0.005≈0.0707 instead.<\/p>\n", "wrong": "<p>A0.020,B=0.200,C0.100 are not1/200. The general Glorot normal variance is often2/(fan_in+fan_out), reducing to1/n when both widths equaln.<\/p>\n", "cue": "<p>Variance and standard deviation differ by a square root. Use the explicitly provided initialization convention.<\/p>\n"}}, {"n": 8, "stem": "What is the He variance for n = 200?", "options": {"A": "0.010", "B": "0.005", "C": "0.020", "D": "0.100"}, "answer": "A", "explanation": {"right": "<p>He variance=2/n=2/200=0.010. Its corresponding standard deviation is0.1.<\/p>\n", "wrong": "<p>B=0.005 is the case's Xavier variance. C0.020 and D0.100 are not2/200; D is the standard deviation rather than variance.<\/p>\n", "cue": "<p>For ReLU fan-in initialization, remember variance2/n and standard deviation√(2/n).<\/p>\n"}}, {"n": 9, "stem": "Why is He initialization more suitable for these hidden layers?", "options": {"A": "The output layer uses no activation.", "B": "The network has only one layer.", "C": "The hidden layers use ReLU activations.", "D": "The target variable is binary in the stated case setting."}, "answer": "C", "explanation": {"right": "<p>He initialization accounts for rectifier behavior; for a roughly symmetric pre-activation distribution, ReLU discards much of the negative half, motivating the factor2 under the usual derivation assumptions.<\/p>\n", "wrong": "<p>A is not the reason and is not specified. B is false because there are seven hidden layers. D describes the target rather than the hidden activation's variance dynamics.<\/p>\n", "cue": "<p>Initialization choice follows activation and fan scaling, not merely whether the prediction task is binary. Reference: <a href=\"https://arxiv.org/abs/1502.01852\">He et al.<\/a>.<\/p>\n"}}, {"n": 10, "stem": "Which observation suggests the new initialization improved training stability?", "options": {"A": "Hidden activations are all forced to zero.", "B": "Loss decreases more smoothly across epochs.", "C": "No validation set is needed in the stated case setting.", "D": "All weights become identical."}, "answer": "B", "explanation": {"right": "<p>A loss that decreases more smoothly rather than oscillating is evidence of improved optimization stability in this comparison. It is useful evidence, not proof of good test accuracy or unique causation.<\/p>\n", "wrong": "<p>A all-zero activations would suggest a failure to transmit information. C wrongly removes validation. D identical hidden weights create a symmetry problem rather than demonstrating a useful random initialization.<\/p>\n", "cue": "<p>Training stability and generalization are separate checks; initialization can help the former without guaranteeing the latter.<\/p>\n"}}, {"n": 11, "stem": "What is the main goal of greedy layer-wise pretraining here?", "options": {"A": "To delete the hidden layers before training.", "B": "To avoid using input features during both unsupervised pretraining and fine-tuning.", "C": "To give each layer a useful initialization before supervised fine-tuning.", "D": "To guarantee zero test error in this specific scenario."}, "answer": "C", "explanation": {"right": "<p>Greedy pretraining learns one layer at a time to provide useful starting features/weights for later supervised fine-tuning. Earlier layers can learn from reconstruction even when direct deep supervised gradients are weak.<\/p>\n", "wrong": "<p>A deletes the representation. B excludes the input needed for reconstruction. D guarantees zero test error without basis. The method is a training strategy, not a universal requirement for all modern networks.<\/p>\n", "cue": "<p>Pretrain useful representations, then fine-tune the full task.<\/p>\n"}}, {"n": 12, "stem": "During pretraining of the second hidden layer, what happens to the already trained first layer?", "options": {"A": "It is randomly reinitialized in the stated case setting.", "B": "It is removed from the model.", "C": "It is trained with the output labels only.", "D": "It is kept fixed while the next layer is trained."}, "answer": "D", "explanation": {"right": "<p>In this greedy procedure, the already pretrained first layer is frozen while the second is trained on its outputs. That preserves the learned representation during the next local training stage.<\/p>\n", "wrong": "<p>A discards the learned initialization. B removes the input representation to the second layer. C changes the procedure to output-label training rather than the described unsupervised stage.<\/p>\n", "cue": "<p>Freeze earlier layers during greedy pretraining; unfreeze as specified for later end-to-end fine-tuning.<\/p>\n"}}, {"n": 13, "stem": "Why is the first pretraining objective described as unsupervised?", "options": {"A": "It uses the input data without using the abnormal-condition labels.", "B": "It uses no numerical features under the given conditions.", "C": "It uses only the final classifier output for the data shown here.", "D": "It requires the validation labels to be hidden in the stated case setting."}, "answer": "A", "explanation": {"right": "<p>The reconstruction objective uses input data as the source of targets without abnormal-condition class labels. It is unsupervised representation learning in the terminology of the case, also often described as self-supervised reconstruction.<\/p>\n", "wrong": "<p>B falsely removes numerical features. C uses final classification outputs instead of reconstruction. D confuses hidden validation labels with the nature of the learning objective.<\/p>\n", "cue": "<p>No external class labels does not mean no loss or no target signal.<\/p>\n"}}, {"n": 14, "stem": "What happens after all hidden layers have been pretrained?", "options": {"A": "The network is discarded under the given conditions.", "B": "The full model is fine-tuned with the supervised task objective.", "C": "The input features are replaced by random values.", "D": "The loss function is no longer required in the stated case setting."}, "answer": "B", "explanation": {"right": "<p>After pretraining hidden layers, add/use the output classifier and optimize the whole model on the labeled task. This supervised fine-tuning adapts the representation to abnormal-condition detection.<\/p>\n", "wrong": "<p>A throws away the learned representation. C replaces meaningful features with random inputs. D removes the objective needed for fine-tuning.<\/p>\n", "cue": "<p>Greedy stage learns layer by layer; fine-tuning learns the complete task jointly.<\/p>\n"}}, {"n": 15, "stem": "Which issue is layer-wise pretraining intended to reduce?", "options": {"A": "The need to store data files in this specific scenario.", "B": "The number of output classes under the case assumptions.", "C": "The difficulty of training early layers in a very deep network.", "D": "The existence of nonlinear activations under the given conditions."}, "answer": "C", "explanation": {"right": "<p>The intended problem is weak learning in early layers when deep gradients are small. Layer-wise local objectives can give those layers informative initial features before full backpropagation.<\/p>\n", "wrong": "<p>A concerns file storage, not learning. B changes the task's class count. D removes nonlinear activations, which pretraining does not require.<\/p>\n", "cue": "<p>Pretraining targets a difficult starting point/representation problem; it does not guarantee optimization or generalization success.<\/p>\n"}}, {"n": 16, "stem": "What problem does batch normalization primarily address?", "options": {"A": "It changes labels from binary to continuous.", "B": "It removes the need for backpropagation.", "C": "It guarantees a perfect classifier in the stated case setting.", "D": "It reduces shifting layer-input distributions during training."}, "answer": "D", "explanation": {"right": "<p>D is the supplied answer and matches the case's traditional internal-covariate-shift explanation. Batch normalization standardizes mini-batch pre-activations and learns scale/shift, often improving optimization stability. Treat reduced distribution shift as the intended textbook framing, not a complete settled account of why BN works.<\/p>\n", "wrong": "<p>A changes target type; B removes backpropagation; C guarantees perfection. None describes normalization. Research also links BN's benefits to smoother optimization rather than distributional stability alone.<\/p>\n", "cue": "<p>For this question select D; know the actual normalization formula. References: <a href=\"https://arxiv.org/abs/1502.03167\">original BN paper<\/a>, <a href=\"https://arxiv.org/abs/1805.11604\">optimization analysis<\/a>.<\/p>\n"}}, {"n": 17, "stem": "What is the mean of the mini-batch values 1, 3, 5, 7?", "options": {"A": "3", "B": "4", "C": "5", "D": "16"}, "answer": "B", "explanation": {"right": "<p>Mini-batch mean=(1+3+5+7)/4=16/4=4.<\/p>\n", "wrong": "<p>A3 and C5 are internal values but not the mean. D16 is the sum before dividing by batch size.<\/p>\n", "cue": "<p>BN computes statistics across the specified batch/channel grouping, not across labels or across all parameters.<\/p>\n"}}, {"n": 18, "stem": "What is the batch variance using the average squared deviation?", "options": {"A": "4", "B": "6", "C": "3", "D": "5"}, "answer": "D", "explanation": {"right": "<p>Deviations from mean4 are−3,−1,1,3. Squared deviations9,1,1,9 sum20; the specified average divides by4, giving5.<\/p>\n", "wrong": "<p>A4 and C3 are incorrect. B=6 is not20/4; the unbiased sample estimate would be20/3≈6.667, not6. Use the denominator explicitly requested.<\/p>\n", "cue": "<p>Batch normalization's training normalization uses the mean squared deviation, not automatically the n−1 sample variance.<\/p>\n"}}, {"n": 19, "stem": "Where is batch normalization placed in this case?", "options": {"A": "Only after the output probability for the described model.", "B": "Before every input feature is collected.", "C": "Between the linear transformation and ReLU activation.", "D": "After the final prediction is thresholded."}, "answer": "C", "explanation": {"right": "<p>The case explicitly uses affine transformation→BN→ReLU. BN operates on pre-activations before the nonlinearity, so C matches the stated architecture.<\/p>\n", "wrong": "<p>A is after output probability, B precedes collection of input data, and D is after a hard decision; none matches the stated hidden-layer placement. Other architectures may arrange normalization differently.<\/p>\n", "cue": "<p>Answer placement questions from the specified order; do not turn one common convention into an absolute architectural law.<\/p>\n"}}, {"n": 20, "stem": "Why are learnable scale and shift parameters useful in batch normalization?", "options": {"A": "They allow the network to choose an appropriate normalized representation.", "B": "They delete the mini-batch statistics in this specific scenario.", "C": "They prevent gradients from being computed under the case assumptions.", "D": "They force every activation to remain exactly zero for the described model."}, "answer": "A", "explanation": {"right": "<p>After standardization, BN outputsγ×normalized_value+β. Learnableγ andβ let the network select a useful scale and offset rather than being forced to retain only zero-mean/unit-variance outputs.<\/p>\n", "wrong": "<p>B falsely deletes the required statistics. C wrongly disables gradients. D forces zero responses, the opposite of flexible scaling/shifting.<\/p>\n", "cue": "<p>BN normalizes, then permits a learned affine adjustment. γ andβ are parameters; batch mean/variance are computed statistics.<\/p>\n"}}]}, {"number": 9, "title": "Word representations", "notes": [{"number": 17, "title": "Week 9 — One-hot, bag-of-words and co-occurrence", "scope": "Questions 1–10", "html": "<h1 id=\"identity-and-distributional-context-are-different-signals\">Identity and distributional context are different signals<\/h1>\n<p>With vocabulary sizeV12,000, each word one-hot has length12,000, exactly one1 and11,999 zeros. Different known words are orthogonal: dot product0 and Euclidean distance√2, irrespective of meaning. The50,000 ticket count and four output categories do not set a word one-hot's length.<\/p>\n<p>An <strong>embedding lookup<\/strong> selects a dense learned row from a V×d matrix. Algebraically, one-hot selection and a matrix lookup can be equivalent; a word need not be stored as a full dense one-hot in memory. Unknown words require a specified token/subword policy; they do not spontaneously increase the fixed vector length during prediction.<\/p>\n<h2 id=\"bag-of-words\">Bag-of-words<\/h2>\n<p>Add token one-hots to get a document count vector. Repeated occurrences increase counts. It records token usage but loses order: refund failed and failed refund have the same counts. A binary bag records presence instead of frequency. <strong>TF–IDF<\/strong> additionally weights term frequency by how broadly a word occurs across documents, reducing domination by ubiquitous terms under the chosen formula.<\/p>\n<p>TicketA recharge failed refund; TicketB recharge plan refund. Shared coordinates2; each vector has three1s. <strong>Dot product2; norm√3 each; cosine2/3≈0.667<\/strong>. Identical repeated scaling of a document preserves cosine direction; exact semantic synonyms without token overlap can still produce zero sparse-vector similarity.<\/p>\n<p><strong>Cosine(u,v)=(u·v)/(norm(u) norm(v))<\/strong>, range[−1,1] for real nonzero vectors; nonnegative count vectors have range[0,1]. It is undefined for a zero vector without an explicit handling convention. Cosine normalizes magnitude but does not itself learn a semantic representation.<\/p>\n<h2 id=\"context-windows\">Context windows<\/h2>\n<p>A co-occurrence matrix has one target word per row and context word per column. EntryCᵢⱼ counts observations of contextj near targeti. A radius1 window includes up to one token on each side, <strong>two<\/strong> neighbors for an interior word. Document boundaries matter; do not create a context pair across separate fragments unless the procedure explicitly joins them.<\/p>\n<p>In battery lasts long, lasts has battery and long as immediate neighbors, so two local contributions. In screen looks bright, screen and bright are separated by looks and are not adjacent. They are adjacent once in bright screen response. With symmetric neighbor counting C(screen,bright)=C(bright,screen)=1: that creates two directed matrix entries but only one observed adjacent pair.<\/p>\n<p>The selected matrix vocabulary[battery,screen,bright,long,fast] gives <strong>shape5×5<\/strong>, regardless of four fragments. Apply the window in the <strong>original token stream<\/strong> before selecting target/context entries. Deleting lasts first would wrongly make battery and long adjacent.<\/p>\n<p>For this tiny selected-vocabulary example, only screen↔︎bright contributes a selected/selected adjacent pair; other selected rows may be zero. This illustrates how vocabulary filtering and window definitions affect counts. A zero context vector cannot be normalized for cosine in the usual way.<\/p>\n<p><strong>Memory:<\/strong> one-hot=identity; bag-of-words=document token counts; co-occurrence=word-context counts; dense embedding=compact representation learned/factorized from a signal.<\/p>\n"}, {"number": 18, "title": "Week 9 — Dense vectors and evaluation", "scope": "Questions 11–20", "html": "<h1 id=\"compress-contextual-structure-then-evaluate-it\">Compress contextual structure, then evaluate it<\/h1>\n<p>A sparse6,000×6,000 context matrix has36 million possible cells but may store only observed nonzeros. Truncated SVD <strong>X≈U_k Sigma_k V_k^T<\/strong>, k=200, yields U_k6,000×200,Sigma_k200×200,V_k^T200×6,000. The case uses <strong>E=U_k Sigma_k<\/strong>: one200-dimensional row per word. Other conventions choose different singular-value scaling; use the given representation.<\/p>\n<p>SVD captures dominant correlated context patterns, giving latent axes rather than explicit semantic labels. Comparing200-dimensional dense vectors can be efficient and reveal broader similarity beyond exact overlap. An original sparse vector can also be computationally cheap, so dimensionality alone is not a universal runtime proof. Keeping fewer components loses some information, including potentially useful rare patterns.<\/p>\n<h2 id=\"count-based-versus-predictive-embeddings\">Count-based versus predictive embeddings<\/h2>\n<p><strong>Count/factorization methods:<\/strong> construct word-context statistics and factorize or transform them. <strong>CBOW:<\/strong> predicts a target word from context. <strong>Skip-gram:<\/strong> predicts context words from a target. These predictive methods learn embedding tables through an objective rather than merely assigning one-hot identities. Negative sampling is one way to approximate/replace an expensive full-vocabulary prediction objective with observed versus sampled pair discrimination.<\/p>\n<p>Distributional similarity means similar contexts, not necessarily identical meaning. Antonyms such as hot/cold can be close because they occur in similar sentence slots. A static word embedding gives one representation per vocabulary entry and can mix senses; a contextual representation can depend on a particular occurrence's surrounding text. These distinctions are supporting concepts, not additional supplied quiz weeks.<\/p>\n<h2 id=\"synonyms-and-analogies\">Synonyms and analogies<\/h2>\n<p>For scoresA0.18,B=0.74,C0.41,D0.62, highest cosine selects <strong>B<\/strong>. A relation analogy a<span class=\"emoji\" data-emoji=\"b\">🅱️<\/span>:c:d uses <strong>v_d≈v_b−v_a+v_c<\/strong>. Compute the offset from sourcea to destinationb, add it to new sourcec, then search for a suitable candidate, often excluding query words and using cosine normalization as specified.<\/p>\n<p>Vector offsets can capture some regularities but need not solve every analogy or encode a relation faithfully. Similarity, relatedness and interchangeability are different. Query expansion can increase retrieval recall by adding related words, but irrelevant neighbors can reduce precision.<\/p>\n<h2 id=\"evaluating-representations\">Evaluating representations<\/h2>\n<p><strong>Intrinsic:<\/strong> synonym selection, word similarity/relatedness correlation and analogy tasks. Correlation with human judgments measures association across scored pairs, not exact equality of scores or causality. Pearson correlation assesses linear association; rank correlation emphasizes ordering. A high score on one collection does not guarantee performance for another domain.<\/p>\n<p><strong>Extrinsic:<\/strong> evaluate the representation in a downstream classifier, search/ranking or clustering task using appropriate held-out data. This tests whether the features help the actual use case. Beware benchmark leakage and vocabulary preprocessing that sees held-out labels. More dimensions may retain detail but increase storage/overfitting/computation; choose with a valid evaluation process.<\/p>\n<p><strong>Shape memory:<\/strong> vocabularyV×embedding widthd is the embedding table, not the number of documents×classes. Word-vector dimension here200;Σ shape200×200; full reconstruction6,000×6,000. Dense vectors are not one-hot, and dimensionality reduction does not make all unrelated words identical.<\/p>\n"}], "cases": [{"number": 1, "title": "Customer Support Ticket Classification", "html": "<p>Vocabulary size <strong>12,000<\/strong>, learned from <strong>50,000 tickets<\/strong>. A word's one-hot vector has length 12,000 and exactly one 1. Ticket bag-of-words vectors add word one-hots. <strong>Ticket A: recharge failed refund. Ticket B: recharge plan refund.<\/strong> Both use the same vocabulary coordinate system.<\/p>\n"}, {"number": 2, "title": "Product Review Term Analysis", "html": "<p>Corpus fragments: <strong>battery lasts long; screen looks bright; battery charges fast; bright screen response<\/strong>. The selected vocabulary is <strong>[battery,screen,bright,long,fast]<\/strong>. Context window size <strong>1<\/strong> counts immediate left and right neighbors. C has one row per selected target word and one column per selected context word.<\/p>\n"}, {"number": 3, "title": "Legal Search Term Representation", "html": "<p>The word-context matrix <strong>X has shape 6000×6000<\/strong>. Use truncated SVD <strong>X≈U_k Sigma_k V_k^T<\/strong>, retaining <strong>k=200<\/strong> directions. The rows of <strong>U_k Sigma_k<\/strong> are used as dense word vectors.<\/p>\n"}, {"number": 4, "title": "Search Term Similarity Evaluation", "html": "<p>Synonym rule: choose the candidate with highest cosine similarity to the query. Candidate scores are <strong>A=0.18, B=0.74, C=0.41, D=0.62<\/strong>. Evaluate agreement with human relatedness scores through correlation. For analogy <strong>a<span class=\"emoji\" data-emoji=\"b\">🅱️<\/span>:c:?<\/strong>, search near <strong>v_b−v_a+v_c<\/strong>.<\/p>\n"}], "questions": [{"n": 1, "stem": "What is the length of each one-hot word vector?", "options": {"A": "12,000", "B": "50,000", "C": "3", "D": "4"}, "answer": "A", "explanation": {"right": "<p>A word one-hot has one coordinate per vocabulary entry, so its length is12,000. The number of training documents does not set this length.<\/p>\n", "wrong": "<p>B=50,000 is the ticket count. C3 is a short ticket's token count. D4 is the category count. None is the word vocabulary size.<\/p>\n", "cue": "<p>Word vector length follows vocabulary size for one-hot encoding; class one-hot length would instead follow number of classes.<\/p>\n"}}, {"n": 2, "stem": "How many non-zero entries does a single one-hot word vector contain?", "options": {"A": "12,000", "B": "0", "C": "1", "D": "3"}, "answer": "C", "explanation": {"right": "<p>A one-hot word vector has exactly one1 and12,000−1=11,999 zeros. Its position identifies the word.<\/p>\n", "wrong": "<p>A12,000 confuses length with nonzero count. B=0 would be an all-zero vector, not a known-word one-hot. D3 is a document's token count, not a single word's nonzeros.<\/p>\n", "cue": "<p>One-hot: one active coordinate. Bag-of-words can have several nonzero coordinates and counts greater than1.<\/p>\n"}}, {"n": 3, "stem": "How many shared words appear in Ticket A and Ticket B?", "options": {"A": "1", "B": "3", "C": "0", "D": "2"}, "answer": "D", "explanation": {"right": "<p>Both tickets contain recharge and refund. The other terms differ: failed versus plan. Shared distinct words=2.<\/p>\n", "wrong": "<p>A1 misses one shared term. B=3 assumes the third words match. C0 ignores the two exact overlaps.<\/p>\n", "cue": "<p>Use the same vocabulary coordinates for both documents; otherwise their dot product and overlap would be meaningless.<\/p>\n"}}, {"n": 4, "stem": "What is a major limitation of one-hot word vectors?", "options": {"A": "They are always dense for the data shown here.", "B": "They do not directly capture semantic similarity between words.", "C": "They require labels for every context window for the described model.", "D": "They have variable length for the same vocabulary."}, "answer": "B", "explanation": {"right": "<p>Different word one-hots have dot product0 and equal distances regardless of meaning. They encode identity but no built-in graded semantic similarity between distinct words.<\/p>\n", "wrong": "<p>A falsely calls them dense. C adds an unnecessary context-label requirement. D falsely changes dimensionality within one fixed vocabulary.<\/p>\n", "cue": "<p>Car and automobile are as orthogonal as car and banana in bare one-hot encoding.<\/p>\n"}}, {"n": 5, "stem": "Why can cosine similarity still be useful for bag-of-words ticket vectors?", "options": {"A": "It measures overlap in word usage while reducing sensitivity to length.", "B": "It learns neural hidden layers automatically from the sparse ticket vectors.", "C": "It converts sparse vectors into images in this specific scenario.", "D": "It guarantees semantic understanding under the given conditions."}, "answer": "A", "explanation": {"right": "<p>Cosine compares document count-vector directions after dividing by their norms, measuring shared word usage with reduced sensitivity to overall document magnitude. The tickets' dot product is2 and each norm√3, giving cosine2/3.<\/p>\n", "wrong": "<p>B does not train hidden layers. C does not make images. D guarantees semantic understanding that sparse overlap cannot provide; synonymous words may have no exact overlap.<\/p>\n", "cue": "<p>Cosine normalizes length, not meaning. A bag-of-words representation also loses word order.<\/p>\n"}}, {"n": 6, "stem": "What is the size of the co-occurrence matrix for this selected vocabulary?", "options": {"A": "4 × 5", "B": "5 × 5", "C": "5 × 4", "D": "25 × 25"}, "answer": "B", "explanation": {"right": "<p>Five selected target words and the same five context words give one cell for each ordered pair, so the matrix shape is5×5, containing25 cells.<\/p>\n", "wrong": "<p>A4×5 and C5×4 incorrectly use fragment count4 as a matrix axis. D25×25 confuses number of cells with side length.<\/p>\n", "cue": "<p>Matrix axes follow target/context vocabularies; corpus sentence count controls observations, not these dimensions.<\/p>\n"}}, {"n": 7, "stem": "What does a context window of 1 mean?", "options": {"A": "Only the target word is counted.", "B": "All words in the corpus are counted as context.", "C": "The vocabulary is reduced to one word.", "D": "Only immediate neighboring words are counted."}, "answer": "D", "explanation": {"right": "<p>Window1 uses one token immediately left and one immediately right when present, in the original token sequence. Boundary words have fewer neighbors.<\/p>\n", "wrong": "<p>A includes only the target and no context. B uses the whole corpus rather than a local window. C confuses window radius with vocabulary size.<\/p>\n", "cue": "<p>Window radius1 can give up to2 neighbors, not just1 total neighbor.<\/p>\n"}}, {"n": 8, "stem": "In the fragment “battery lasts long”, how many context contributions does “lasts” receive with window size 1?", "options": {"A": "2", "B": "1", "C": "0", "D": "3"}, "answer": "A", "explanation": {"right": "<p>In battery lasts long, the target lasts has battery on the left and long on the right. Both are valid selected context words, so it receives2 context contributions.<\/p>\n", "wrong": "<p>B=1 counts one side only. C0 misses both. D3 counts the target itself as context even though this window rule excludes it.<\/p>\n", "cue": "<p>For an internal token, count each neighboring position separately; repeated words can contribute repeated counts.<\/p>\n"}}, {"n": 9, "stem": "How many times are “screen” and “bright” adjacent in the toy corpus?", "options": {"A": "0", "B": "2", "C": "1", "D": "3"}, "answer": "C", "explanation": {"right": "<p>Screen and bright are adjacent only in bright screen response. In screen looks bright they have looks between them and are two positions apart, outside window1. Thus adjacency count is1.<\/p>\n", "wrong": "<p>A0 misses the final fragment. B=2 incorrectly counts co-presence in the earlier fragment as adjacency. D3 has no support. Symmetric counting can fill C(screen,bright)=1 and C(bright,screen)=1 without creating two separate corpus adjacencies.<\/p>\n", "cue": "<p>Do not remove intermediate unselected words before applying the original-token window.<\/p>\n"}}, {"n": 10, "stem": "What does a row of the co-occurrence matrix represent?", "options": {"A": "The number of labels in the classifier under the case assumptions.", "B": "The vectorial representation of a target word based on its context counts.", "C": "The one-hot position of a document category in the downstream productreview classifier.", "D": "The learning rate selected for truncated SVD."}, "answer": "B", "explanation": {"right": "<p>A row fixes the target word and lists its observed context counts across context-word columns. This is a distributional representation of that target.<\/p>\n", "wrong": "<p>A concerns class labels. C confuses document/category one-hots with context counts. D concerns an optimization setting, not matrix entries.<\/p>\n", "cue": "<p>Row=which target; column=which context; entry=how often that relationship was observed.<\/p>\n"}}, {"n": 11, "stem": "Why is truncated SVD applied here?", "options": {"A": "To increase the vocabulary size in the stated case setting.", "B": "To make every context vector one-hot.", "C": "To reduce dimensionality while preserving important structure.", "D": "To remove the need for context words in every downstream search task."}, "answer": "C", "explanation": {"right": "<p>Truncated SVD keeps dominant structure using k dimensions rather than the original6,000. It compresses correlated context patterns into dense latent directions useful for comparison.<\/p>\n", "wrong": "<p>A does not expand vocabulary. B makes a false one-hot claim. D removes the contextual evidence from which SVD learns structure. Compression discards some information, so it is not automatically superior on every downstream task.<\/p>\n", "cue": "<p>SVD summarizes structure; it does not invent semantic labels or make every word equally similar.<\/p>\n"}}, {"n": 12, "stem": "What is the dimension of each reduced word vector when k = 200?", "options": {"A": "6000", "B": "36,000,000", "C": "400", "D": "200"}, "answer": "D", "explanation": {"right": "<p>Each row of U_k Sigma_k has k=200 coordinates, so each reduced word vector has dimension200.<\/p>\n", "wrong": "<p>A6,000 is original context width. B=36,000,000 is the full matrix's cell count. C400 incorrectly adds two factor widths instead of reading the row representation.<\/p>\n", "cue": "<p>Embedding dimension is the number of columns of the chosen word-vector matrix.<\/p>\n"}}, {"n": 13, "stem": "What is the size of Uk in this case?", "options": {"A": "6000 × 200", "B": "200 × 200", "C": "200 × 6000", "D": "6000 × 6000"}, "answer": "A", "explanation": {"right": "<p>U_k has one row for each of6,000 target words and one column for each of200 retained singular directions, giving6,000×200.<\/p>\n", "wrong": "<p>B=200×200 isSigma_k. C200×6,000 matches V_k^T's shape. D6,000×6,000 is the original matrix.<\/p>\n", "cue": "<p>Check multiplication: (6000×200)(200×200)(200×6000) returns6000×6000.<\/p>\n"}}, {"n": 14, "stem": "Which advantage does the reduced representation provide?", "options": {"A": "It makes all unrelated words identical under the given conditions.", "B": "It can make similarity computation more efficient.", "C": "It prevents any word from appearing in context.", "D": "It removes all latent semantic structure."}, "answer": "B", "explanation": {"right": "<p>Comparing200-component dense representations can be cheaper and more convenient than comparing6,000-component dense context rows. It can also summarize broader shared context structure. Actual gains depend on sparsity and implementation.<\/p>\n", "wrong": "<p>A wrongly collapses unrelated words into identical vectors. C prevents the very observations used for training. D removes all latent structure rather than extracting it.<\/p>\n", "cue": "<p>Reduced dimension often helps computation; a highly sparse original can also be efficient, so avoid an unconditional speed claim.<\/p>\n"}}, {"n": 15, "stem": "What kind of information can SVD help uncover?", "options": {"A": "The number of documents in chronological order.", "B": "The exact spelling of every rare word.", "C": "The chronological order of every document.", "D": "Latent patterns in word-context usage."}, "answer": "D", "explanation": {"right": "<p>SVD exposes latent axes summarizing correlations in word-context usage. Words with similar contextual profiles can acquire similar representations even without identical spellings or direct co-occurrence.<\/p>\n", "wrong": "<p>A and C both concern document chronology, which this unordered matrix need not retain. B concerns spelling, not dominant distributional structure.<\/p>\n", "cue": "<p>Distributional representation learns from contexts, not necessarily morphology, truth, chronology or an explicit dictionary of synonyms.<\/p>\n"}}, {"n": 16, "stem": "Which candidate is selected by the synonym rule?", "options": {"A": "A", "B": "B", "C": "C", "D": "D"}, "answer": "B", "explanation": {"right": "<p>The rule chooses maximum cosine score. CandidateB has0.74, greater thanD0.62,C0.41,A0.18, so selectB.<\/p>\n", "wrong": "<p>A is lowest; C and D are belowB. No additional optimization or averaging is needed because the decision rule is stated.<\/p>\n", "cue": "<p>For a similarity measure, maximize. For a distance/error measure, usually minimize. Read which quantity is supplied.<\/p>\n"}}, {"n": 17, "stem": "What does a high correlation with human relatedness scores indicate?", "options": {"A": "The model’s similarity judgments agree well with human judgments.", "B": "The vectors remain one-hot after training.", "C": "The vocabulary has only one word under the given conditions.", "D": "The model ignores cosine similarity during all human-score evaluations."}, "answer": "A", "explanation": {"right": "<p>High positive correlation means model-relatedness scores tend to track higher human-relatedness judgments, supporting agreement on that evaluation set.<\/p>\n", "wrong": "<p>B does not follow from correlation. C contradicts multiword evaluation. D wrongly says cosine is ignored. Correlation need not mean identical numeric scores, perfect synonyms, or causation.<\/p>\n", "cue": "<p>Correlation measures association across pairs; it is not the same as accuracy for one multiple-choice synonym question.<\/p>\n"}}, {"n": 18, "stem": "In an analogy task a : b :: c :?, what vector operation is commonly used?", "options": {"A": "va + vb + vc only", "B": "va − vb − vc", "C": "vb − va + vc", "D": "va /vb"}, "answer": "C", "explanation": {"right": "<p>For a<span class=\"emoji\" data-emoji=\"b\">🅱️<\/span>:c:d, the desired relation is v_b−v_a≈v_d−v_c. Rearranging gives query vector v_b−v_a+v_c, then search for a nearby candidate.<\/p>\n", "wrong": "<p>A adds absolute positions without isolating the relation. B subtracts the wrong directions. D uses vector division, not the standard analogy operation.<\/p>\n", "cue": "<p>Destination−source gives a relation offset; add that offset to the new source.<\/p>\n"}}, {"n": 19, "stem": "Why are dense word vectors useful for query expansion?", "options": {"A": "They make every vector a one-hot vector under the given conditions.", "B": "They require no training corpus under the given conditions.", "C": "They make every pair of different words orthogonal.", "D": "They can place related words near each other in vector space."}, "answer": "D", "explanation": {"right": "<p>Dense embeddings can place contextually related words near one another, allowing a query to include related terms beyond exact token matches. This can improve recall when used carefully.<\/p>\n", "wrong": "<p>A returns to one-hot identity coding. B falsely requires no corpus/training information. C makes all distinct words orthogonal, destroying graded similarity. Semantic neighbors can include antonyms or domain associates rather than strict synonyms.<\/p>\n", "cue": "<p>Nearby in distributional space means related context, not guaranteed interchangeable meaning.<\/p>\n"}}, {"n": 20, "stem": "What metric is used in the synonym rule described in the case?", "options": {"A": "Training loss under the given conditions", "B": "Matrix rank only", "C": "Cosine similarity", "D": "Vocabulary size"}, "answer": "C", "explanation": {"right": "<p>The specified synonym rule selects the largest cosine similarity, so the metric is cosine.<\/p>\n", "wrong": "<p>A training loss is an optimization/evaluation quantity of another kind. B matrix rank describes dimensional structure. D vocabulary size is a count, not pairwise semantic similarity.<\/p>\n", "cue": "<p>Cosine=(u·v)/(norm(u) norm(v)); it compares direction and is undefined for an all-zero vector without a chosen handling convention.<\/p>\n"}}]}, {"number": 10, "title": "Convolutional networks", "notes": [{"number": 19, "title": "Week 10 — Convolution geometry and parameters", "scope": "Questions 1–5, 16–20", "html": "<h1 id=\"separate-height-width-input-depth-and-filter-count\">Separate height, width, input depth and filter count<\/h1>\n<p>A standard2D convolutional filter covers a local <strong>K_h×K_w<\/strong> spatial region and all <strong>C_in input channels<\/strong>. The same weights are reused at many positions, producing one spatial output map per filter. <strong>C_out filters→C_out output channels<\/strong>. CNN libraries commonly implement cross-correlation without flipping the kernel; dimension/parameter formulas are unchanged.<\/p>\n<p>Per spatial axis, <strong>Nout=floor((Nin+2P−D(K−1)−1)/S)+1<\/strong>, with strideS,paddingP,dilationD. ForD1, this becomesfloor((N+2P−K)/S)+1. Dilation enlarges the effective kernel to <strong>Keff=D(K−1)+1<\/strong> without adding coefficients per filter. Apply height/width formulas separately if rectangular.<\/p>\n<h2 id=\"two-supplied-cases\">Two supplied cases<\/h2>\n<p><strong>96×96<\/strong>,K3,S1,P1→96×96 output. With24 filters, shape <strong>96×96×24<\/strong>. Subsequent max poolingK2,S2,P0 gives <strong>48×48×24<\/strong>. Pooling reduces spatial positions by4, not channels by2.<\/p>\n<p><strong>64×64 RGB<\/strong>,K5,S1,P0→60×60. With32 filters, shape <strong>60×60×32<\/strong>. Each filter has5×5×3=<strong>75 weights<\/strong>; whole layer <strong>2,400 weights<\/strong>. Include one bias per output channel→<strong>2,432 parameters<\/strong>. Number of spatial output positions does not multiply trainable parameter count because weights are shared.<\/p>\n<h2 id=\"general-parameter-counts\">General parameter counts<\/h2>\n<p>Standard convolution parameters <strong>(K_hK_wC_in+1)C_out<\/strong> with biases. Dense layerdin→dout has <strong>(din+1)dout<\/strong>. Pooling and global-average pooling normally have no learned coefficients. A1×1 convolution has C_inC_out weights and mixes channels at each position; it can change depth without directly combining neighboring positions.<\/p>\n<p><strong>Flatten<\/strong> an8×8×128 tensor→<strong>8,192 coordinates<\/strong>. <strong>Global average pooling(GAP)<\/strong> averages64 values within each map→<strong>128 coordinates<\/strong>. A10-output dense classifier after flatten has(8192+1)×10=<strong>81,930 parameters<\/strong>; afterGAP,(128+1)×10=<strong>1,290<\/strong>. GAP itself adds no parameters; savings occur in the following dense layer, with spatial detail sacrificed.<\/p>\n<h2 id=\"local-patterns-and-receptive-fields\">Local patterns and receptive fields<\/h2>\n<p>Early filters often detect edges/corners/textures; deeper layers combine broader structures. Stacking two stride1 3×3 layers gives an effective5×5 receptive field; three give7×7, assuming dilation1. Pooling/strides grow the spacing between sampled features. Padding preserves chosen dimensions but also affects boundary behavior; it does not make border pixels identical to interior ones.<\/p>\n<p><strong>Max pooling<\/strong> keeps the strongest response; average pooling summarizes a mean. Both can downsample and provide some local-shift robustness, not exact invariance to every transformation. Convolution is approximately translation-equivariant under appropriate boundaries/stride conditions; global pooling can encourage translation-insensitive decisions but loses location information.<\/p>\n<p><strong>Numerical routine:<\/strong> calculate spatial size→set output depth from filters→count filter coefficients using input depth→add biases if requested→check later pooling/flattening separately. Do not multiply parameters by Hout×Wout.<\/p>\n"}, {"number": 20, "title": "Week 10 — CNN architectures and interpretation", "scope": "Questions 6–15", "html": "<h1 id=\"different-architectures-solve-different-design-problems\">Different architectures solve different design problems<\/h1>\n<table>\n<thead>\n<tr>\n<th>Family<\/th>\n<th>Main design idea<\/th>\n<th>Exam clue<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>LeNet-style<\/td>\n<td>Early small convolution/pooling classifier<\/td>\n<td>Basic local-feature hierarchy<\/td>\n<\/tr>\n<tr>\n<td>AlexNet-style<\/td>\n<td>Larger ReLU CNN with convolution/dense stages<\/td>\n<td>Historical deep image classification and dropout<\/td>\n<\/tr>\n<tr>\n<td>VGG-style<\/td>\n<td>Repeated small3×3 filters, increased depth<\/td>\n<td>Larger effective field via stacked small filters<\/td>\n<\/tr>\n<tr>\n<td>Inception-style<\/td>\n<td>Parallel multiscale branches, often1×1 reductions<\/td>\n<td>Mix1×1,3×3,5×5-scale features<\/td>\n<\/tr>\n<tr>\n<td>ResNet-style<\/td>\n<td>Additive identity/projection skips<\/td>\n<td>H(x)=F(x)+x<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>With equal input/intermediate/output widthC and no biases, two3×3 layers use <strong>18C²<\/strong> weights versus one5×5's <strong>25C²<\/strong>, while covering the same effective5×5 field and adding another nonlinearity. Exact savings change with channel sizes. An Inception branch may reduce channels with1×1 before an expensive spatial filter; branch outputs are commonly concatenated.<\/p>\n<p><strong>Residual block:<\/strong> addx to learnedF(x), so the branch learns a correction relative to an identity path. Gradient includes <strong>I+∂F/∂x<\/strong>, offering a direct route and easing deep optimization, though no universal nonvanishing-gradient guarantee follows. Shapes must match for addition; use a projection or appropriate stride/channel alignment if not. <strong>Concatenation<\/strong> joins channels and is not the same as addition.<\/p>\n<h2 id=\"inspect-what-the-model-uses\">Inspect what the model uses<\/h2>\n<p><strong>Filters:<\/strong> view learned local patterns, especially in early layers directly connected to pixels. <strong>Activation maps:<\/strong> inspect spatial responses to an actual image. <strong>Occlusion:<\/strong> mask a patch and observe finite score change. <strong>Gradient saliency:<\/strong> derivative of a chosen score with respect to input pixels, measuring local sensitivity. <strong>Activation maximization:<\/strong> optimize an input to increase a chosen activation, with appropriate constraints if used.<\/p>\n<p>If masking a lesion patch lowers disease probability, the model relies on information affected by that patch. This supports importance for the prediction, not proof of the true biological mechanism. The mask can introduce unnatural artifacts; the model can use background confounders. Large gradients indicate strong local sensitivity; small gradients can reflect saturation rather than irrelevance.<\/p>\n<p>A disease-selective neuron is evidence of class-associated responses, not guaranteed medically valid reasoning. Validate on suitable data and test confounders. The supplied examples concern model interpretation, not clinical decision rules.<\/p>\n<h2 id=\"transfer-learning-and-training-choices\">Transfer learning and training choices<\/h2>\n<p>A pretrained CNN backbone can supply general features; a new head adapts to target labels. <strong>Feature extraction<\/strong> freezes the backbone; <strong>fine-tuning<\/strong> updates some/all pretrained weights, often with a smaller learning rate. Keep preprocessing compatible and use a validation plan. Training on limited images benefits from appropriate augmentation/regularization, but task differences can limit transfer.<\/p>\n<p>For diagnosis of model errors, compare training/validation performance, inspect class confusion, verify labels and preprocessing, and examine whether sensitive regions match plausible evidence. High accuracy alone can conceal leakage or reliance on irrelevant artifacts. Attribution alone does not establish causal understanding.<\/p>\n<p><strong>Memory:<\/strong> VGG stacks, Inception branches, ResNet skips; occlusion changes the input, gradients measure an infinitesimal response, dropout regularizes training. Kernel size, architecture and visualization answer different questions.<\/p>\n"}], "cases": [{"number": 1, "title": "Industrial Surface Inspection", "html": "<p>Input spatial size is <strong>96×96<\/strong>. A convolution uses <strong>3×3 filters,stride 1,padding 1<\/strong>; Question 2 specifies <strong>24 filters<\/strong>. Later apply <strong>2×2 max pooling,stride 2<\/strong>.<\/p>\n"}, {"number": 2, "title": "Crop Image Disease Detection", "html": "<p>A CNN classifies healthy/diseased leaf images. <strong>Occlusion analysis<\/strong> masks patches and observes prediction changes. Inspect early/deep activation maps and gradients to assess which visual evidence the network uses. These are model-diagnostic clues; an attribution does not by itself establish a biological cause.<\/p>\n"}, {"number": 3, "title": "Road Surface Image Classification", "html": "<p>Compare <strong>VGG-style stacks of 3×3 convolutions<\/strong>, <strong>Inception-style parallel filter sizes<\/strong>, and <strong>ResNet-style skip connections<\/strong> for road images containing small cracks and large potholes/water regions. A residual block computes <strong>H(x)=F(x)+x<\/strong> when shapes match, or uses a suitable projection when they do not.<\/p>\n"}, {"number": 4, "title": "Satellite Land-Cover Classification", "html": "<p>Input images are <strong>64×64 RGB<\/strong>. A convolution uses <strong>32 filters of size 5×5,stride 1,no padding<\/strong>. A separate final tensor has shape <strong>8×8×128<\/strong> and is reduced by global average pooling before classification.<\/p>\n"}], "questions": [{"n": 1, "stem": "What is the output spatial size after the 3 × 3 convolution with stride 1 and padding 1?", "options": {"A": "96 × 96", "B": "94 × 94", "C": "98 × 98", "D": "48 × 48"}, "answer": "A", "explanation": {"right": "<p>For dilation1, output per axis=floor((N+2P−K)/S)+1. Here(96+2−3)/1+1=96, so output spatial shape96×96.<\/p>\n", "wrong": "<p>B=94×94 omits padding. C98×98 counts padding but fails to account for kernel extent. D48×48 matches later stride2 pooling, not stride1 convolution.<\/p>\n", "cue": "<p>With odd K3, stride1 and padding1, spatial size is preserved. This does not determine output channel count.<\/p>\n"}}, {"n": 2, "stem": "If the convolution layer uses 24 filters, how many output feature maps are produced?", "options": {"A": "3", "B": "1", "C": "24", "D": "96"}, "answer": "C", "explanation": {"right": "<p>Each of24 filters produces one output channel/feature map, so there are24. Spatial position count is a separate quantity.<\/p>\n", "wrong": "<p>A3 confuses filter side length(or possible RGB channels) with output depth. B=1 ignores multiple filters. D96 is the spatial width, not number of maps.<\/p>\n", "cue": "<p>Output channels=number of filters; each ordinary filter spans all input channels.<\/p>\n"}}, {"n": 3, "stem": "What is the output size after applying 2 × 2 max pooling with stride 2 to a 96 × 96 feature map?", "options": {"A": "96 × 96", "B": "24 × 24", "C": "94 × 94", "D": "48 × 48"}, "answer": "D", "explanation": {"right": "<p>For pooling K2,S2,P0: floor((96−2)/2)+1=48. Apply independently to height and width, yielding48×48, while ordinary pooling preserves channel count.<\/p>\n", "wrong": "<p>A96×96 ignores downsampling. B=24×24 halves twice. C94×94 resembles a stride1 reduction by a3-wide kernel, not this pooling rule.<\/p>\n", "cue": "<p>Pooling halves each spatial dimension here, so the number of spatial positions drops by a factor4.<\/p>\n"}}, {"n": 4, "stem": "Why is pooling useful for this inspection task?", "options": {"A": "It removes the need for convolution under the case assumptions.", "B": "It reduces spatial size and gives some robustness to small shifts.", "C": "It increases every image dimension in the stated case setting.", "D": "It converts grayscale images into RGB images in this specific scenario."}, "answer": "B", "explanation": {"right": "<p>Pooling summarizes local neighborhoods and downsamples feature maps, reducing computation and sometimes giving robustness to small shifts. Max pooling keeps the strongest local response.<\/p>\n", "wrong": "<p>A eliminates needed feature extraction without basis. C increases dimensions, the opposite of downsampling. D changes color channels, not what pooling does.<\/p>\n", "cue": "<p>Pooling trades detail for compactness/local robustness; it does not guarantee exact invariance to every translation.<\/p>\n"}}, {"n": 5, "stem": "What do early convolution filters usually learn in such image tasks?", "options": {"A": "Low-level patterns such as edges and corners", "B": "The final class probability only", "C": "The batch size for the described model", "D": "The optimizer momentum in this specific scenario"}, "answer": "A", "explanation": {"right": "<p>Early filters operate on local raw pixel patterns and commonly respond to edges, corners, orientations and simple textures. Deeper compositions can represent more task-specific structures.<\/p>\n", "wrong": "<p>B jumps directly to final probabilities. C batch size and D optimizer momentum are training settings, not image features learned by filters.<\/p>\n", "cue": "<p>Early=local/simple; deeper=larger/composite. This is a tendency, not a promise that every individual filter has a clear human label.<\/p>\n"}}, {"n": 6, "stem": "If masking one leaf patch sharply reduces disease probability, what does that suggest?", "options": {"A": "The patch is irrelevant to the prediction and all class evidence.", "B": "The patch contains information important for the prediction.", "C": "The model has no learned filters for the data shown here.", "D": "The image has no disease signal for the data shown here."}, "answer": "B", "explanation": {"right": "<p>A sharp confidence drop when the patch is masked suggests the model relied on information in that region for this prediction. It identifies model sensitivity, not proof that the region is the true biological cause.<\/p>\n", "wrong": "<p>A contradicts the observed drop. C claims no filters despite a trained CNN. D claims no disease signal, which the perturbation experiment does not establish. Masking can also introduce out-of-distribution artifacts.<\/p>\n", "cue": "<p>Occlusion asks what changes when evidence is hidden. Check backgrounds/confounders before treating attribution as explanation of the real world.<\/p>\n"}}, {"n": 7, "stem": "What is the name of the technique that masks image regions and observes prediction changes?", "options": {"A": "Batch normalization", "B": "Weight decay", "C": "Dropout", "D": "Occlusion analysis"}, "answer": "D", "explanation": {"right": "<p>Occlusion analysis systematically hides regions and measures resulting score changes to assess spatial sensitivity of the model.<\/p>\n", "wrong": "<p>A batch normalization standardizes activations. B weight decay penalizes/shrinks parameters. C dropout randomly masks units for training regularization; it is not the named targeted input-region diagnostic.<\/p>\n", "cue": "<p>Occlusion masks input patches for interpretation; dropout masks activations during training.<\/p>\n"}}, {"n": 8, "stem": "Why are first-layer filters usually easier to interpret?", "options": {"A": "They operate directly on local pixel patterns.", "B": "They contain no weights in this specific scenario.", "C": "They always output class labels.", "D": "They are identical across all filters."}, "answer": "A", "explanation": {"right": "<p>First-layer filters connect directly to local pixel neighborhoods, making their edge/color/texture patterns more readily inspectable than deeply composed representations.<\/p>\n", "wrong": "<p>B is false because convolution filters have weights. C falsely says they always emit class labels. D falsely makes all filters identical.<\/p>\n", "cue": "<p>A first-layer filter tensor has direct input-channel meaning; a deeper filter acts on feature channels whose meanings are already learned combinations.<\/p>\n"}}, {"n": 9, "stem": "A neuron that activates strongly for diseased leaves but weakly for healthy leaves has likely learned what?", "options": {"A": "The file name pattern in this specific scenario", "B": "A disease-related visual feature", "C": "The learning rate schedule", "D": "A fixed image size only"}, "answer": "B", "explanation": {"right": "<p>Under the case assumptions, strong disease-class selectivity suggests a learned disease-related visual feature. This is the intendedB answer; actual selectivity could also reflect correlated artifacts and should be tested.<\/p>\n", "wrong": "<p>A's specific filename explanation has no support in a pixel-image pipeline. C learning-rate schedule and D image size are not the stated class-relevant learned pattern.<\/p>\n", "cue": "<p>Class-selective activation is a clue about what the model detects, not a guarantee of causal or clinically meaningful reasoning.<\/p>\n"}}, {"n": 10, "stem": "In gradient-based visualization, what does a large gradient magnitude for a pixel indicate?", "options": {"A": "The pixel has no influence for the data shown here.", "B": "The pixel is outside the image.", "C": "The activation is sensitive to that pixel.", "D": "The filter has zero parameters."}, "answer": "C", "explanation": {"right": "<p>A large absolute derivative of the selected activation/score with respect to a pixel means a small pixel change can strongly affect that quantity locally. The sign indicates increasing versus decreasing influence.<\/p>\n", "wrong": "<p>A states the opposite. B places the pixel outside the represented input. D incorrectly removes filter parameters. Large local gradients do not automatically identify globally necessary evidence.<\/p>\n", "cue": "<p>Gradient saliency is local sensitivity; occlusion is finite perturbation sensitivity. Saturation can make gradients small despite relevant information.<\/p>\n"}}, {"n": 11, "stem": "Why does VGG prefer stacks of small 3 × 3 filters?", "options": {"A": "To remove nonlinearities in the stated case setting.", "B": "To avoid feature maps throughout the network.", "C": "To force all images to be grayscale before every convolutional layer.", "D": "To build deeper representations with controlled parameter growth."}, "answer": "D", "explanation": {"right": "<p>Stacks of3×3 layers build larger effective receptive fields while adding depth/nonlinearities with manageable parameter growth. With equal channel widthC and no biases, two3×3 layers use18C² weights versus25C² for one5×5.<\/p>\n", "wrong": "<p>A removes rather than adds nonlinear composition. B eliminates feature maps that convolutions produce. C imposes grayscale without relation to VGG's design.<\/p>\n", "cue": "<p>Two stride1 3×3 layers see an effective5×5 input region; three see7×7, assuming no dilation and contiguous stacking.<\/p>\n"}}, {"n": 12, "stem": "What is the main purpose of Inception-style parallel filters?", "options": {"A": "To delete pooling layers.", "B": "To use only one spatial scale.", "C": "To capture features at multiple spatial scales.", "D": "To remove convolution in this specific scenario."}, "answer": "C", "explanation": {"right": "<p>Parallel filter branches with different sizes capture fine and coarse patterns at the same module stage. Their outputs are typically concatenated across channels.<\/p>\n", "wrong": "<p>A deletion of pooling is not the defining goal. B contradicts multiple spatial scales. D removes convolutions that define the module.<\/p>\n", "cue": "<p>Inception=parallel multiscale features; VGG=stacked small filters; ResNet=additive skip paths.<\/p>\n"}}, {"n": 13, "stem": "Why do ResNet skip connections help very deep networks train?", "options": {"A": "They improve information and gradient flow.", "B": "They remove the input image.", "C": "They replace all filters with one scalar.", "D": "They make the output size independent of stride."}, "answer": "A", "explanation": {"right": "<p>A skip connection provides a direct information/gradient route around the residual branch. For H(x)=F(x)+x, derivative includes an identity contribution, which can ease optimization of very deep models.<\/p>\n", "wrong": "<p>B removes input instead of preserving it. C replaces spatial filters with one scalar without basis. D falsely makes stride irrelevant to output dimensions. Skip paths help but do not guarantee all gradients remain well behaved.<\/p>\n", "cue": "<p>Residual gradient includes I+∂F/∂x; the identity path is the mathematical clue.<\/p>\n"}}, {"n": 14, "stem": "A module computes H(x) = F (x) + x. What architecture idea does this represent?", "options": {"A": "Bag-of-words", "B": "Residual learning", "C": "One-hot encoding", "D": "Average pooling only"}, "answer": "B", "explanation": {"right": "<p>Adding input x to a learned residual F(x) is residual learning, the ResNet idea. The branch learns a correction relative to the skip path rather than being the only path to H.<\/p>\n", "wrong": "<p>A bag-of-words, C one-hot encoding and D average pooling do not describe this additive architecture. If shapes differ, a projection/alignment is needed before addition.<\/p>\n", "cue": "<p>Addition requires matching shapes; concatenation is a different operation that usually increases channel count.<\/p>\n"}}, {"n": 15, "stem": "Which architecture is most directly suited to mixing 1 × 1, 3 × 3, and 5 × 5 convolutions in parallel?", "options": {"A": "Inception in this specific scenario", "B": "A single-layer perceptron", "C": "Plain linear regression", "D": "A one-hot encoder for the described model"}, "answer": "A", "explanation": {"right": "<p>An Inception-style module uses parallel branches with filters such as1×1,3×3,5×5 to capture multiple scales;1×1 operations can also reduce channel count before costly spatial filters.<\/p>\n", "wrong": "<p>B a single perceptron lacks parallel spatial convolutions. C linear regression does not provide this convolutional module. D one-hot encoding only represents discrete identity.<\/p>\n", "cue": "<p>Parallel different receptive fields→Inception. A1×1 convolution mixes channels, even though it does not see neighboring spatial positions directly.<\/p>\n"}}, {"n": 16, "stem": "What is the output spatial size after the 5×5, stride 1, no-padding convolution on a 64 × 64 image?", "options": {"A": "64 × 64", "B": "32 × 32", "C": "60 × 60", "D": "68 × 68"}, "answer": "C", "explanation": {"right": "<p>With N=64,K5,S1,P0,dilation1: output=(64−5)+1=60 per axis. Output shape60×60, before adding output-channel count.<\/p>\n", "wrong": "<p>A64×64 would require padding2 for stride1. B=32×32 suggests downsampling roughly by2. D68×68 improperly enlarges an unpadded convolution.<\/p>\n", "cue": "<p>Valid/no padding shrinks by K−1 at stride1; same-size output requires appropriate padding.<\/p>\n"}}, {"n": 17, "stem": "How many output channels are produced by 32 filters?", "options": {"A": "5", "B": "32", "C": "64", "D": "128"}, "answer": "B", "explanation": {"right": "<p>There are32 filters, so32 output channels. Each filter produces one full spatial map rather than one scalar for the entire image.<\/p>\n", "wrong": "<p>A5 confuses spatial kernel width. C64 is input width. D128 belongs to the separate final feature tensor.<\/p>\n", "cue": "<p>Tensor output here is60×60×32: height/width from geometry, depth from filter count.<\/p>\n"}}, {"n": 18, "stem": "How many weight parameters are in one 5 × 5 RGB filter, ignoring bias?", "options": {"A": "25", "B": "50", "C": "125", "D": "75"}, "answer": "D", "explanation": {"right": "<p>An ordinary5×5 filter spans all3 RGB channels:5×5×3=75 weights. With one bias it would have76 parameters, but the question excludes bias.<\/p>\n", "wrong": "<p>A25 counts one channel only. B=50 counts two. C125 incorrectly treats input depth as5. For all32 filters, weights=75×32=2,400, plus32 biases if included.<\/p>\n", "cue": "<p>Kernel dimensions are height×width×input channels; multiply by number of output filters for the whole layer.<\/p>\n"}}, {"n": 19, "stem": "What is the output dimension after global average pooling of an 8 × 8 × 128 tensor?", "options": {"A": "64", "B": "1024", "C": "128", "D": "8192"}, "answer": "C", "explanation": {"right": "<p>Global average pooling averages each8×8 map to one scalar. With128 channels, output length128; it does not combine all channels into one scalar.<\/p>\n", "wrong": "<p>A64 is the number of spatial positions per map. B=1,024 is unrelated to the required reduction. D8,192 is the flattened size8×8×128.<\/p>\n", "cue": "<p>Global pooling removes spatial dimensions, retains one summary per channel, and has no learned weights in the standard form.<\/p>\n"}}, {"n": 20, "stem": "Why can global average pooling reduce parameters compared with flattening followed by a large fully connected layer?", "options": {"A": "It increases the spatial dimensions.", "B": "It removes all learned filters in this specific scenario.", "C": "It increases the number of dense connections.", "D": "It produces one summary value per feature map."}, "answer": "D", "explanation": {"right": "<p>One scalar per feature map replaces8×8 spatial values per map before the classifier, reducing a dense classifier's input from8,192 to128. GAP itself has no learned parameters.<\/p>\n", "wrong": "<p>A enlarges dimensions rather than pooling. B removes convolutional filters, which remain learned. C increases dense connections, the opposite of the benefit. Spatial detail is lost, so the trade-off may not suit tasks needing exact location.<\/p>\n", "cue": "<p>Flatten keeps every position; GAP summarizes each channel. Parameter savings arise in the following dense layer.<\/p>\n"}}]}, {"number": 11, "title": "RNNs, LSTMs & GRUs", "assessmentLabel": "Practice test", "source": "Lecture-based practice from Lectures 13–14; no official Week 11 assignment was supplied.", "notes": [{"number": 1, "title": "Sequences, recurrent states & parameter sharing", "scope": "Lecture 13", "html": "<h3 id=\"why-a-sequence-needs-memory\">Why a sequence needs memory<\/h3>\n<p>A sequence is an ordered list: words in a sentence, characters in a word, frames in a video, or measurements over time. Order changes meaning: “dog bites man” differs from “man bites dog.” A model should use earlier inputs, accept different lengths, and reuse the same computation at each step.<\/p>\n<table>\n<thead>\n<tr>\n<th>Task<\/th>\n<th>Input → output<\/th>\n<th>What the model must remember<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Character completion<\/td>\n<td>Characters → next character at each step<\/td>\n<td>Prefix already read<\/td>\n<\/tr>\n<tr>\n<td>Part-of-speech tagging<\/td>\n<td>One tag per input word<\/td>\n<td>Earlier words and grammatical context<\/td>\n<\/tr>\n<tr>\n<td>Review sentiment<\/td>\n<td>Many words → one label<\/td>\n<td>Sentiment clues across the review<\/td>\n<\/tr>\n<tr>\n<td>Video activity recognition<\/td>\n<td>Many frames → one activity<\/td>\n<td>Movement and frame order<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A <strong>vanilla RNN<\/strong> maintains a fixed-width state, a running summary of the prefix. It can process variable-length sequences, but a fixed-width summary is not a perfect recording of the entire past.<\/p>\n<p>For column vectors, use:<\/p>\n<p><code>aₜ = Uxₜ + Whₜ₋₁ + b<\/code><\/p>\n<p><code>hₜ = φ(aₜ)<\/code><\/p>\n<p><code>zₜ = Vhₜ + c; pₜ = softmax(zₜ)<\/code><\/p>\n<p>Here xₜ is the current input, hₜ₋₁ the previous state, φ an elementwise activation such as tanh, and pₜ a distribution over output classes. The slides call the vanilla RNN state <strong>sₜ<\/strong>; here <strong>hₜ<\/strong> means the same thing. The activation symbol σ is sometimes used generically; do not assume every occurrence means logistic sigmoid.<\/p>\n<table>\n<thead>\n<tr>\n<th>Quantity<\/th>\n<th>Shape, for input n, hidden d, output k<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>xₜ, hₜ, pₜ<\/td>\n<td>n×1, d×1, k×1<\/td>\n<\/tr>\n<tr>\n<td>U: input → hidden<\/td>\n<td>d×n<\/td>\n<\/tr>\n<tr>\n<td>W: hidden → hidden<\/td>\n<td>d×d<\/td>\n<\/tr>\n<tr>\n<td>V: hidden → output<\/td>\n<td>k×d<\/td>\n<\/tr>\n<tr>\n<td>b, c<\/td>\n<td>d×1, k×1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Shape trick:<\/strong> rows equal the destination width; columns equal the source width. Row-vector conventions transpose the matrices, without changing their parameter counts.<\/p>\n<p>The <strong>same U, W, V, b, c<\/strong> are reused at every time step. Unrolling creates multiple uses of these parameters, not independent parameter sets. With biases, the parameter count is <strong>dn+d²+kd+d+k<\/strong>, independent of sequence length T. Computation and stored activations generally increase with T. Reset or initialize the state appropriately between unrelated sequences; a starting state can be zero, fixed, or learned.<\/p>\n<p><strong>Example:<\/strong> n=3, d=4, k=2 gives 12+16+8+4+2 = <strong>42 parameters<\/strong>, whether the sequence has 5 or 50 steps. A scalar linear recurrence hₜ=2xₜ+0.5hₜ₋₁, h₀=0, x₁=1, x₂=2 gives h₁=2 and h₂=5. With tanh or sigmoid, apply that activation after the weighted sum.<\/p>\n<p>For next-token prediction, use a vocabulary softmax and cross-entropy. With true-token probability pₜ(yₜ), <strong>Lₜ=−ln pₜ(yₜ)<\/strong> and <strong>L=ΣₜLₜ<\/strong>. If the question asks for mean loss, divide by the number of scored steps. PAD tokens used only to fill a batch should be masked from the loss. A sentiment classifier may score only the last state; tagging may score every state.<\/p>\n<p><strong>Likely patterns:<\/strong> choose many-to-one versus many-to-many; identify shared weights; calculate a hidden state, matrix shape, parameter count, or sequence loss. <strong>Remember:<\/strong> same cell, new input, updated memory.<\/p>\n"}, {"number": 2, "title": "BPTT, vanishing gradients & clipping", "scope": "Lecture 13; Lecture 14 gradient analysis", "html": "<h3 id=\"backpropagation-through-time\">Backpropagation through time<\/h3>\n<p><strong>BPTT<\/strong> unrolls the recurrent computation and applies the chain rule backward through its time steps. Since a shared weight is used repeatedly, add the gradient contributions from all uses. Even if only the final step has a loss, earlier states can receive gradients through the recurrent connections.<\/p>\n<p>For a vanilla RNN with softmax cross-entropy, let yₜ be the one-hot target, eₜ=pₜ−yₜ, and δₜ=∂L/∂aₜ. Then:<\/p>\n<p><code>δₜ = (Vᵀeₜ + Wᵀδₜ₊₁) ⊙ φ′(aₜ)<\/code><\/p>\n<p><code>∇W L = Σₜ δₜhₜ₋₁ᵀ; ∇U L = Σₜ δₜxₜᵀ<\/code><\/p>\n<p><code>∇V L = Σₜ eₜhₜᵀ; ∇b L = Σₜδₜ; ∇c L = Σₜeₜ<\/code><\/p>\n<p>Use δₜ₊₁=0 beyond the last step; omit local output-loss terms at unscored steps. The future term is what ordinary independent classification lacks.<\/p>\n<p><strong>Direct versus total derivative:<\/strong> treating hₜ₋₁ as fixed gives only the local effect of W on hₜ. The total derivative must also include W's earlier effects on hₜ₋₁. In component form, <strong>∂⁺hₜ,p/∂Wq,r = φ′(aₜ,p)hₜ₋₁,r<\/strong> when p=q, and 0 otherwise. The superscript + means the earlier state is held fixed. A derivative of a d-vector with respect to a d×d matrix has d³ components; implementations accumulate ordinary matrix gradients instead of explicitly building that tensor.<\/p>\n<p><strong>Small example:<\/strong> h₁=w, h₂=wh₁=w². The total dh₂/dw is <strong>2w<\/strong>. Differentiating only the final multiplication while freezing h₁ gives w and misses the earlier use of w.<\/p>\n<h3 id=\"why-distant-information-is-hard-to-learn\">Why distant information is hard to learn<\/h3>\n<p>For fixed current inputs, the one-step Jacobian is <strong>Jₜ=diag(φ′(aₜ))W<\/strong>. A dependency across many steps contains a product of these Jacobians. If their magnitudes repeatedly shrink, the gradient becomes tiny; if they repeatedly amplify, it can become huge.<\/p>\n<p><code>‖∂hₜ/∂hₖ‖ ≤ (γ‖W‖)^(t−k)<\/code>, if <code>|φ′|≤γ<\/code> at every intervening step, using a compatible operator norm.<\/p>\n<p>Logistic sigmoid has maximum derivative <strong>1/4<\/strong>; tanh has maximum derivative <strong>1<\/strong>. Saturation makes either derivative close to zero. If γ‖W‖&lt;1, this bound decays with distance. If γ‖W‖&gt;1, explosion is <strong>possible<\/strong>, not guaranteed by that upper bound. Actual activations and directions matter.<\/p>\n<p><strong>Numerical intuition:<\/strong> ten scalar derivative factors of 0.5 give 0.5¹⁰≈0.00098; ten factors of 2 give 1024. A bounded hidden activation does not ensure a bounded training gradient because the recurrence also multiplies by weight matrices.<\/p>\n<h3 id=\"three-remedies-with-different-jobs\">Three remedies with different jobs<\/h3>\n<table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>What changes<\/th>\n<th>Limitation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Truncated BPTT<\/td>\n<td>Backpropagates through a limited window of τ steps<\/td>\n<td>Cuts gradient credit beyond that window<\/td>\n<\/tr>\n<tr>\n<td>LSTM/GRU gates<\/td>\n<td>Learn routes for retaining and updating memory<\/td>\n<td>Do not guarantee all gradients stay well behaved<\/td>\n<\/tr>\n<tr>\n<td>Gradient norm clipping<\/td>\n<td>Scales an excessively large gradient<\/td>\n<td>Does not restore an already vanished gradient<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Truncated BPTT can <strong>carry the state forward<\/strong> while detaching its earlier computation graph. Forward memory is not the same as backward credit. It reduces memory and computation for training; it does not make the network feedforward or guara
