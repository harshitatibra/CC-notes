impossible by requiring zero loss before an update. D reverses the workflow: updates are how training proceeds.<\/p>\n", "cue": "<p>Mini-batches balance noise, memory and hardware utilization; they do not guarantee the best outcome for every size.<\/p>\n"}}, {"n": 11, "stem": "What is the new velocity vt ?", "options": {"A": "0.5", "B": "0.6", "C": "0.7", "D": "0.8"}, "answer": "C", "explanation": {"right": "<p>Apply the stated convention: vnew=0.8×0.5+0.1×3=0.4+0.3=0.7. The current velocity combines history and current gradient.<\/p>\n", "wrong": "<p>A0.5 keeps the old velocity. B=0.6 and D0.8 miscombine the two contributions. Do not apply another factorη to a velocity already defined with ηg.<\/p>\n", "cue": "<p>Momentum formulas differ across texts; use the exact placement of η given in the question.<\/p>\n"}}, {"n": 12, "stem": "What is the updated parameter wt ?", "options": {"A": "4.3", "B": "5.7", "C": "4.7", "D": "5.3"}, "answer": "A", "explanation": {"right": "<p>The velocity from Question11 is0.7. The stated parameter rule gives wnew=5−0.7=4.3.<\/p>\n", "wrong": "<p>B=5.7 adds the velocity instead of subtracting. C4.7 subtracts only the current0.3 gradient term and ignores history. D5.3 both ignores history and adds the current step.<\/p>\n", "cue": "<p>Compute velocity first, then update the parameter with that velocity exactly once.<\/p>\n"}}, {"n": 13, "stem": "What does the momentum term βvt−1 represent?", "options": {"A": "It removes all history from the update and uses only the current gradient.", "B": "It sets the learning rate to zero for every future update.", "C": "It replaces the loss function.", "D": "It carries part of the previous update direction."}, "answer": "D", "explanation": {"right": "<p>βvold retains a decayed contribution of prior update direction. Repeated aligned gradients can build movement; alternating components can partially cancel, smoothing oscillations.<\/p>\n", "wrong": "<p>A describes removing memory, the opposite of momentum. B sets learning to zero without reason. C confuses optimizer state with the objective being minimized.<\/p>\n", "cue": "<p>Momentum remembers motion, not targets or predictions. β near1 retains history longer than smallβ.<\/p>\n"}}, {"n": 14, "stem": "If β = 0, what would vt be for the same gradient and learning rate?", "options": {"A": "0.3", "B": "0.1", "C": "0.2", "D": "0.4"}, "answer": "A", "explanation": {"right": "<p>With β=0, history contributes0. Then v=ηg=0.1×3=0.3, equivalent to an ordinary gradient step under this convention.<\/p>\n", "wrong": "<p>B=0.1 is justη. C0.2 and D0.4 are not0.1×3. D was the old-history contribution before settingβ to0.<\/p>\n", "cue": "<p>Zero momentum coefficient removes history; it does not set the current gradient step to zero.<\/p>\n"}}, {"n": 15, "stem": "Why can momentum help optimization?", "options": {"A": "It makes gradients unnecessary.", "B": "It always increases the loss.", "C": "It can smooth updates across steps.", "D": "It forces all parameters to be equal."}, "answer": "C", "explanation": {"right": "<p>Momentum combines gradients over steps, often reducing zigzagging in directions whose signs alternate and building speed where gradients align. This can make optimization more stable/efficient.<\/p>\n", "wrong": "<p>A falsely eliminates gradients. B makes an unjustified claim that loss always increases. D introduces weight equality that momentum does not impose.<\/p>\n", "cue": "<p>Momentum can help but does not guarantee monotonic loss reduction or global optimality.<\/p>\n"}}, {"n": 16, "stem": "What is rt ?", "options": {"A": "16", "B": "25", "C": "13", "D": "9"}, "answer": "B", "explanation": {"right": "<p>AdaGrad's accumulator adds the current squared gradient: rnew=9+4²=9+16=25. The square is applied before addition.<\/p>\n", "wrong": "<p>A16 omits the old accumulator. C13 adds g rather than g². D9 ignores the current observation.<\/p>\n", "cue": "<p>Accumulate squares to track magnitude independent of gradient sign; adding raw gradients would allow cancellation.<\/p>\n"}}, {"n": 17, "stem": "What is √rₜ?", "options": {"A": "3", "B": "4", "C": "5", "D": "6"}, "answer": "C", "explanation": {"right": "<p>From r=25, √r=5. This denominator is a square root of the accumulator, not the accumulator itself.<\/p>\n", "wrong": "<p>A3 is√9, the old denominator. B=4 is the current gradient. D6 is neither√25 nor a required operation.<\/p>\n", "cue": "<p>New accumulator first, square root second, scaled update third.<\/p>\n"}}, {"n": 18, "stem": "What is the update magnitude?", "options": {"A": "0.2", "B": "0.4", "C": "0.8", "D": "0.6"}, "answer": "B", "explanation": {"right": "<p>Magnitude=ηg/√r=0.5×4/5=2/5=0.4. The parameter would decrease by0.4 because g is positive.<\/p>\n", "wrong": "<p>A0.2,C0.8,D0.6 do not follow the stated numerator2 and denominator5. Using r rather than√r would instead give0.08, also incorrect.<\/p>\n", "cue": "<p>An adaptive denominator scales the gradient, not the parameter directly. Keep accumulator and its square root distinct.<\/p>\n"}}, {"n": 19, "stem": "What is the main idea behind AdaGrad-style scaling?", "options": {"A": "It ignores all previous gradient information while claiming to adapt steps.", "B": "It requires the same update for every parameter.", "C": "It removes the need for a loss function.", "D": "It adapts the step size using accumulated squared gradients."}, "answer": "D", "explanation": {"right": "<p>AdaGrad keeps a per-parameter sum of squared gradients and divides updates by its square root. Frequently large gradients grow the denominator, reducing that parameter's effective step size over time.<\/p>\n", "wrong": "<p>A wrongly discards history. B incorrectly requires equal updates despite parameter-specific scaling. C removes the loss, although gradients must come from an objective.<\/p>\n", "cue": "<p>AdaGrad adapts separately per coordinate; its accumulated denominator never decreases in the standard rule.<\/p>\n"}}, {"n": 20, "stem": "Which optimizer combines momentum-like averaging with adaptive scaling?", "options": {"A": "Adam", "B": "Plain batch gradient descent", "C": "Stochastic gradient descent without memory", "D": "A zero-learning-rate update"}, "answer": "A", "explanation": {"right": "<p>Adam tracks a moving average of gradients(first moment) and squared gradients(second moment), combining directional memory with adaptive scaling, usually with bias correction.<\/p>\n", "wrong": "<p>B is plain full-batch descent without these moments. C explicitly excludes memory. D is no learning rather than an adaptive method. Dataset sampling and optimizer choice remain separate: Adam can use mini-batches.<\/p>\n", "cue": "<p>Adam=adaptive moments. The first moment carries direction; the second tracks scale.<\/p>\n"}}]}, {"number": 5, "title": "PCA & SVD", "notes": [{"number": 9, "title": "Week 5 — Eigenvectors, bases and matrix structure", "scope": "Questions 1–10", "html": "<h1 id=\"think-of-a-matrix-as-a-transformation\">Think of a matrix as a transformation<\/h1>\n<p>For x∈Rⁿ and A∈Rᵐˣⁿ, Ax is an m-vector. <strong>Rows<\/strong> compute output-coordinate combinations; <strong>columns<\/strong> show where the input coordinate basis vectors go. Multiplication order matters: AB and BA may differ or one may not exist.<\/p>\n<p>An eigenvector u is nonzero and satisfies <strong>Au=λu<\/strong> for a square A. It stays on the same line after transformation. Positiveλ preserves orientation; negativeλ flips it; λ0 maps it tozero. The zero vector is excluded because it satisfies this equation for everyλ and identifies no direction.<\/p>\n<h2 id=\"diagonal-example\">Diagonal example<\/h2>\n<p>A=[[3,0],[0,2]]. For u₁=(1,0), Au₁=(3,0)=3u₁. For u₂=(0,1), Au₂=(0,2)=2u₂. Thus eigenvalues3 and2 with coordinate eigenvectors. A vector(1,1) maps to(3,2), which is not a scalar multiple of(1,1), so not every vector is an eigenvector.<\/p>\n<p><strong>Trace=3+2=5; determinant=3×2=6; rank2.<\/strong> For general square matrices, trace equals sum of eigenvalues and determinant their product, counting algebraic multiplicity. A nonzero determinant means invertible/full rank; zero determinant means at least one zero eigenvalue. For a general matrix find eigenvalues using <strong>det(A−λI)=0<\/strong>, not by reading row sums.<\/p>\n<h2 id=\"basis-and-change-of-coordinates\">Basis and change of coordinates<\/h2>\n<p>A basis is a linearly independent spanning set. In R², two nonparallel nonzero vectors suffice. Here b₁=(1,1),b₂=(1,−1) have dot product0 but length√2, so <strong>orthogonal<\/strong>, not yet <strong>orthonormal<\/strong>. Normalize by dividing each by√2 if unit directions are needed.<\/p>\n<p>To write x=(4,2)=c₁b₁+c₂b₂, form <strong>B=[b₁ b₂]=[[1,1],[1,−1]]<\/strong> and solve Bc=x. Coordinate equations c₁+c₂=4,c₁−c₂=2 give <strong>c=(3,1)<\/strong>. Check3b₁+b₂=(4,2). The vector is unchanged geometrically; its coordinate description changed.<\/p>\n<p>For an invertible basis matrix <strong>c=B⁻¹x<\/strong>. If columns are orthonormal, <strong>B⁻¹=Bᵀ<\/strong>, simplifying coordinates to dot products. Orthogonality alone without unit length is not enough to use the transpose directly as the inverse.<\/p>\n<h2 id=\"rank-and-shapes\">Rank and shapes<\/h2>\n<p>Rank is the number of independent columns/rows and the dimension of the transformation's image. <strong>rank(A)≤min(m,n)<\/strong>. A2×2 matrix cannot have rank3. Multiplying by a rank-k approximation can map data into a smaller-dimensional subspace. A low-dimensional data subspace does not require every coordinate outside it to be individually zero in the original basis.<\/p>\n<p><strong>Useful identities:<\/strong>(AB)ᵀ=BᵀAᵀ; ||x||²=xᵀx; orthonormalQ satisfiesQᵀQ=I. Symmetric real matrices have real eigenvalues and orthonormal eigenvectors. Covariance matrices are symmetric positive semidefinite, so their eigenvalues are nonnegative up to numerical error.<\/p>\n<p><strong>Memory:<\/strong> eigenvectors are invariant directions; a basis is a coordinate system; trace sums scales; determinant multiplies scales; rank counts independent directions.<\/p>\n"}, {"number": 10, "title": "Week 5 — PCA and SVD", "scope": "Questions 11–20", "html": "<h1 id=\"keep-the-strongest-linear-structure\">Keep the strongest linear structure<\/h1>\n<p><strong>PCA<\/strong> finds orthogonal directions of greatest variance in centered data. For centered X with N rows, one covariance convention is <strong>Σ=XᵀX/N<\/strong>; an unbiased sample convention usesN−1. Copy the denominator specified. Changing between these scales eigenvalues but not eigenvectors for the same centered data.<\/p>\n<p>For unit directionu, projected variance is <strong>uᵀΣu<\/strong>. Maximizing it with ||u||1 yields a top covariance eigenvector. Subsequent principal directions maximize remaining variance subject to orthogonality. Without the unit-length constraint, scalingu would increase the variance without identifying a meaningful best direction.<\/p>\n<h2 id=\"store-example\">Store example<\/h2>\n<p>Σ=diag(4,1). First componente₁ has eigenvalue4; seconde₂ has1. Total variance5. Retain one component→one coordinate/sample and <strong>4/5=80% explained variance<\/strong>. Discarded variance1 equals20%. Project centered x=(a,b) ontoe₁ to get codea; reconstruct(a,0), then add the original mean when returning to uncentered coordinates.<\/p>\n<p>Centering subtracts the feature mean; standardizing also divides by scale, often standard deviation. Features measured in very different units can dominate covariance-based PCA. PCA is unsupervised and preserves variance, not necessarily the feature most useful for a label. A low-variance direction can still separate classes.<\/p>\n<h2 id=\"svd\">SVD<\/h2>\n<p>Any real m×n matrix has <strong>M=UΣVᵀ<\/strong>. Singular valuesσᵢ≥0 are sorted descending; columns ofU andV are left/right singular vectors. Compact rank-r SVD uses U m×r,Σ r×r,Vᵀ r×n. A truncated rank-k approximation is <strong>M_k=sum(i=1..k) sigma_i u_i v_i^T<\/strong>, not a selection of arbitrary entries.<\/p>\n<p><strong>Example:<\/strong> M=diag(3,1),U=V=I. Rank2, singular values3,1. Rank-one approximation <strong>diag(3,0)<\/strong>. Frobenius error²=discardedσ₂²=1; Frobenius error1. Keeping onlydiag(0,1) discards the larger singular value and has error3 instead.<\/p>\n<p><strong>SVD energy fraction<\/strong> retained=Σretainedσᵢ²/Σallσᵢ². In this example one direction retains9/(9+1)=90% of squared Frobenius magnitude. This differs from the <strong>PCA covariance eigenvalue fraction4/5<\/strong> in the separate store example. Do not sum singular values when the question asks squared-energy retention.<\/p>\n<h2 id=\"pcasvd-connection\">PCA–SVD connection<\/h2>\n<p>For centered X=UΣVᵀ, <strong>XᵀX=VΣ²Vᵀ<\/strong>. PCA directions are right singular vectorsV; covariance eigenvalues areσᵢ²/N (or σᵢ²/(N−1)). Scores <strong>XV_k=U_k Sigma_k<\/strong>. Signs of singular/principal vectors can flip together without changing the reconstruction; repeated equal singular values permit rotations within the corresponding subspace.<\/p>\n<p><strong>Likely patterns:<\/strong> covariance diagonal→coordinate variances; largest eigenvalue→first PC; retained eigenvalues/total→variance fraction; nonzero singular values→rank; leading components→best low-rank approximation under spectral/Frobenius error. Eigenvalue and singular value are not interchangeable for arbitrary nonsymmetric matrices.<\/p>\n"}], "cases": [{"number": 1, "title": "Sensor Direction Scaling", "html": "<p>Matrix <strong>A=[[3,0],[0,2]]<\/strong>, vectors <strong>u₁=(1,0)ᵀ<\/strong>, <strong>u₂=(0,1)ᵀ<\/strong>. Eigenvector relation: <strong>Au=λu<\/strong>, u nonzero. The transformation scales the coordinate directions without mixing them.<\/p>\n"}, {"number": 2, "title": "Customer Feature Coordinate Review", "html": "<p>The basis vectors are <strong>b₁=(1,1)ᵀ<\/strong>, <strong>b₂=(1,−1)ᵀ<\/strong>. Given <strong>x=(4,2)ᵀ<\/strong>, find coefficients satisfying <strong>x=c₁b₁+c₂b₂<\/strong>.<\/p>\n"}, {"number": 3, "title": "Store Performance Feature Reduction", "html": "<p>The features are already centered. Their covariance matrix is <strong>Σ=[[4,0],[0,1]]<\/strong>. PCA selects directions of maximum variance. For this diagonal matrix the coordinate axes are principal directions.<\/p>\n"}, {"number": 4, "title": "Product–User Interaction Compression", "html": "<p>The matrix is <strong>M=[[3,0],[0,1]]<\/strong>. An SVD is <strong>M=UΣVᵀ<\/strong>, with <strong>U=I,V=I<\/strong> and singular values <strong>3,1<\/strong>. In the options, <code>[[a,b],[c,d]]<\/code> lists the first row (a,b), then the second row (c,d).<\/p>\n"}], "questions": [{"n": 1, "stem": "What is Au1 ?", "options": {"A": "(3, 0)⊤", "B": "(0, 3)⊤", "C": "(2, 0)⊤", "D": "(1, 3)⊤"}, "answer": "A", "explanation": {"right": "<p>Multiply A by u₁=(1,0)ᵀ: first coordinate3×1+0×0=3, second0×1+2×0=0. Thus Au₁=(3,0)ᵀ=3u₁.<\/p>\n", "wrong": "<p>B swaps the nonzero coordinate. C applies the second axis's eigenvalue2 to u₁. D incorrectly creates a second-coordinate contribution in a diagonal transformation.<\/p>\n", "cue": "<p>A diagonal matrix scales each coordinate by its corresponding diagonal entry.<\/p>\n"}}, {"n": 2, "stem": "What eigenvalue corresponds to u2 ?", "options": {"A": "1", "B": "3", "C": "2", "D": "0"}, "answer": "C", "explanation": {"right": "<p>Au₂=A(0,1)ᵀ=(0,2)ᵀ=2u₂. The eigenvalue for the second coordinate direction is2.<\/p>\n", "wrong": "<p>A1 would mean no scaling. B=3 belongs to u₁. D0 would mean annihilating u₂, which does not occur.<\/p>\n", "cue": "<p>Eigenvalue is the scale factor in Au=λu, not the vector coordinate or total trace.<\/p>\n"}}, {"n": 3, "stem": "Which statement is true about u1 ?", "options": {"A": "It is not changed by A for any input scale.", "B": "It is rotated by 90 degrees after multiplication by A.", "C": "It becomes the zero vector.", "D": "It is scaled by a factor of 3."}, "answer": "D", "explanation": {"right": "<p>Au₁=3u₁, so its orientation stays along the first coordinate and its magnitude triples. The scale factor is3.<\/p>\n", "wrong": "<p>A says it is unchanged, which would needλ1. B claims a90° rotation absent in a positive diagonal map. C would requireλ0.<\/p>\n", "cue": "<p>An eigenvector's line stays invariant; a negative eigenvalue reverses orientation along that same line. Hereλ is positive.<\/p>\n"}}, {"n": 4, "stem": "What is the trace of A?", "options": {"A": "6", "B": "5", "C": "1", "D": "3"}, "answer": "B", "explanation": {"right": "<p>Trace is the sum of diagonal entries: tr(A)=3+2=5. It also equals the sum of eigenvalues, counting multiplicities.<\/p>\n", "wrong": "<p>A6 is the determinant3×2. C1 is the difference3−2. D3 includes only the first diagonal entry.<\/p>\n", "cue": "<p>Trace sums; determinant multiplies eigenvalues. Do not interchange these two invariants.<\/p>\n"}}, {"n": 5, "stem": "How are the eigenvalues related to the diagonal entries in this matrix?", "options": {"A": "They are equal to the diagonal entries for this diagonal matrix.", "B": "They must both be zero for every diagonal matrix in this setting.", "C": "They are found by adding all entries in each row.", "D": "They depend only on the off-diagonal entries here."}, "answer": "A", "explanation": {"right": "<p>For a diagonal matrix, standard coordinate vectors are eigenvectors and diagonal entries are the eigenvalues. Here they are3 and2.<\/p>\n", "wrong": "<p>B incorrectly forces both to0. C's row-sum shortcut is not a general eigenvalue rule; in this special matrix row sums happen to match entries, but that coincidence is not the defining relationship. D ignores the nonzero diagonal while the off-diagonals are0.<\/p>\n", "cue": "<p>Diagonal or triangular matrix→eigenvalues on its diagonal. For a general matrix, solve det(A−λI)=0.<\/p>\n"}}, {"n": 6, "stem": "Which equation is obtained from the first coordinate?", "options": {"A": "c1 − c2 = 4", "B": "c1 + c2 = 4", "C": "2c1 = 4", "D": "c2 = 4"}, "answer": "B", "explanation": {"right": "<p>Expand c₁(1,1)+c₂(1,−1)=(c₁+c₂,c₁−c₂). The first coordinate must match x₁4, giving c₁+c₂=4.<\/p>\n", "wrong": "<p>A uses the second-coordinate sign pattern with the first coordinate's target. C drops c₂. D drops c₁.<\/p>\n", "cue": "<p>Expand a vector equation coordinate by coordinate before solving coefficients.<\/p>\n"}}, {"n": 7, "stem": "Which equation is obtained from the second coordinate?", "options": {"A": "c1 + c2 = 2", "B": "c1 = 2", "C": "c1 − c2 = 2", "D": "2c2 = 2"}, "answer": "C", "explanation": {"right": "<p>The second coordinate of c₁b₁+c₂b₂ is c₁−c₂. It must equal x₂2, hence c₁−c₂=2.<\/p>\n", "wrong": "<p>A uses the first-coordinate sum instead. B drops c₂. D drops c₁ and changes the coefficient structure.<\/p>\n", "cue": "<p>A negative component in a basis vector changes one coordinate equation's sign, not the entire vector's sign.<\/p>\n"}}, {"n": 8, "stem": "What is c1 ?", "options": {"A": "3", "B": "1", "C": "4", "D": "2"}, "answer": "A", "explanation": {"right": "<p>Add equations c₁+c₂=4 and c₁−c₂=2:2c₁=6, so c₁=3. Then c₂=1.<\/p>\n", "wrong": "<p>B=1 is c₂. C4 is the first raw coordinate rather than its new basis coefficient. D2 is the second raw coordinate.<\/p>\n", "cue": "<p>Changing basis changes coordinates describing the same geometric vector; new coefficients need not equal old coordinates.<\/p>\n"}}, {"n": 9, "stem": "What is c2 ?", "options": {"A": "0", "B": "1", "C": "3", "D": "2"}, "answer": "B", "explanation": {"right": "<p>Substitute c₁3 into c₁+c₂=4: c₂=1. Check reconstruction3(1,1)+1(1,−1)=(4,2).<\/p>\n", "wrong": "<p>A0 would reconstruct(3,3). C3 would give(6,0). D2 would give(5,1). Only1 satisfies both coordinate equations.<\/p>\n", "cue": "<p>Always reconstruct the original vector to verify a change-of-basis calculation.<\/p>\n"}}, {"n": 10, "stem": "Why do b1 and b2 form a basis for R2 ?", "options": {"A": "They point in the same direction.", "B": "They both have zero length.", "C": "They always produce only positive coordinates.", "D": "They are linearly independent and span R2 ."}, "answer": "D", "explanation": {"right": "<p>The two vectors are linearly independent and span the two-dimensional space. Their basis matrix[[1,1],[1,−1]] has determinant−2≠0, so every vector has a unique representation.<\/p>\n", "wrong": "<p>A would make them dependent. B zero vectors cannot belong to a basis. C is false because real coefficients can generate negative coordinates too.<\/p>\n", "cue": "<p>In Rⁿ, n independent vectors form a basis. Independent directions prevent ambiguous coordinates.<\/p>\n"}}, {"n": 11, "stem": "What is the variance along the first coordinate direction?", "options": {"A": "1", "B": "2", "C": "4", "D": "0"}, "answer": "C", "explanation": {"right": "<p>For covariance matrixΣ, diagonal entryΣ₁₁ is the variance of feature1. Here it is4. Off-diagonal0 indicates zero covariance, not zero variance.<\/p>\n", "wrong": "<p>A1 is feature2's variance. B=2 is feature1's standard deviation,√4. D0 is an off-diagonal covariance.<\/p>\n", "cue": "<p>Covariance diagonal=variances; square roots=standard deviations; off-diagonal=pairwise covariance.<\/p>\n"}}, {"n": 12, "stem": "Which direction is the first principal component?", "options": {"A": "The second coordinate direction", "B": "The direction (1, 1)⊤", "C": "The zero vector direction", "D": "The first coordinate direction"}, "answer": "D", "explanation": {"right": "<p>PCA's first direction maximizes variance for unit-length projections. With diagonalΣ=diag(4,1), e₁=(1,0) has eigenvalue4, larger than e₂'s1, so choose the first axis.<\/p>\n", "wrong": "<p>A chooses the lower-variance direction. B,(1,1), is not the leading eigenvector and must also be normalized before comparing projected variance. C's zero vector is not a direction/eigenvector.<\/p>\n", "cue": "<p>PCA orders eigenvectors by decreasing covariance eigenvalue, not coordinate name. The sign of a principal direction is arbitrary.<\/p>\n"}}, {"n": 13, "stem": "What fraction of total variance is explained by the first principal component?", "options": {"A": "4/5", "B": "1/5", "C": "1/4", "D": "5/4"}, "answer": "A", "explanation": {"right": "<p>Total variance=4+1=5; leading component retains4. Explained-variance fraction=4/5=0.8=80%.<\/p>\n", "wrong": "<p>B=1/5 is the discarded second component's fraction. C1/4 compares wrong quantities. D5/4 exceeds1 and cannot be a retained fraction.<\/p>\n", "cue": "<p>Explained variance=retained eigenvalues/all eigenvalues, using variance rather than standard deviation.<\/p>\n"}}, {"n": 14, "stem": "If the data is projected onto the first principal component only, how many dimensions remain?", "options": {"A": "0", "B": "1", "C": "2", "D": "4"}, "answer": "B", "explanation": {"right": "<p>Keeping only the first principal component gives one scalar coefficient per example, so the reduced representation has one dimension.<\/p>\n", "wrong": "<p>A0 would keep no information. C2 is the original dimension. D4 confuses eigenvalue4 with dimension.<\/p>\n", "cue": "<p>Number of retained components=k; each sample is represented by k coordinates, independent of eigenvalue magnitudes.<\/p>\n"}}, {"n": 15, "stem": "What is the purpose of centering data before PCA?", "options": {"A": "To make every covariance value negative after centering.", "B": "To remove all variance from the dataset before PCA.", "C": "To force all eigenvalues to be equal.", "D": "To express variation relative to the mean."}, "answer": "D", "explanation": {"right": "<p>Centering subtracts each feature's mean so covariance/PCA describe variation around the data's center. Otherwise uncentered second moments can emphasize distance from the origin rather than variation around the mean.<\/p>\n", "wrong": "<p>A does not generally make covariances negative. B would eliminate the very variation PCA studies. C does not force eigenvalues equal. Centering and scaling to unit variance are separate operations.<\/p>\n", "cue": "<p>Centering moves the cloud of points; standardization also rescales axes. PCA is sensitive to feature scale.<\/p>\n"}}, {"n": 16, "stem": "What is the largest singular value?", "options": {"A": "1", "B": "2", "C": "3", "D": "0"}, "answer": "C", "explanation": {"right": "<p>The singular values are explicitly3 and1, so the largest is3. For this positive diagonal matrix they also match its positive diagonal entries.<\/p>\n", "wrong": "<p>A1 is the smaller singular value. B=2 is not listed. D0 would describe a removed direction in a rank-reduced approximation, not this full matrix.<\/p>\n", "cue": "<p>Singular values are nonnegative and conventionally sorted largest first.<\/p>\n"}}, {"n": 17, "stem": "What does V ⊤ represent in the SVD expression?", "options": {"A": "The transpose of the right singular-vector matrix.", "B": "The loss value of the recommendation model after a full training step.", "C": "The number of users in every batch.", "D": "The covariance matrix after centering."}, "answer": "A", "explanation": {"right": "<p>In M=UΣVᵀ, columns of V are right singular vectors, and Vᵀ is their matrix transpose. They describe input-domain directions, while U describes output-domain directions.<\/p>\n", "wrong": "<p>B is a loss scalar rather than a matrix factor. C is a count unrelated to the factorization. D is not what Vᵀ denotes; covariance and singular-vector factors are distinct objects.<\/p>\n", "cue": "<p>U left, V right, Σ scales. Check dimensions to remember the order.<\/p>\n"}}, {"n": 18, "stem": "What rank-one approximation keeps only the largest singular value?", "options": {"A": "[[0, 0], [0, 1]]", "B": "[[3, 0], [0, 0]]", "C": "[[3, 1], [1, 3]]", "D": "[[0, 3], [1, 0]]"}, "answer": "B", "explanation": {"right": "<p>Truncation keepsσ₁3 and discardsσ₂1. With U=V=I, the result is[[3,0],[0,0]], a rank-one matrix. Its error differs from M only by the dropped bottom-right1.<\/p>\n", "wrong": "<p>A keeps only the smaller singular component, giving worse error. C has extra entries and is rank2 because determinant8≠0. D also has rank2, determinant−3. The brackets are transcribed as row lists to preserve selectable text.<\/p>\n", "cue": "<p>Best rank-k SVD approximation keeps the k largest singular components, not arbitrary k entries.<\/p>\n"}}, {"n": 19, "stem": "What is the rank of M ?", "options": {"A": "0", "B": "1", "C": "2", "D": "3"}, "answer": "C", "explanation": {"right": "<p>M has two nonzero singular values3 and1, so rank=2. Equivalently determinant3≠0 and its two columns are independent.<\/p>\n", "wrong": "<p>A0 would require the zero matrix. B=1 would require only one independent column/nonzero singular value. D3 exceeds the maximum rank of a2×2 matrix.<\/p>\n", "cue": "<p>Rank≤min(number of rows, number of columns); count nonzero singular values.<\/p>\n"}}, {"n": 20, "stem": "Why is SVD useful for dimensionality reduction?", "options": {"A": "It requires every matrix entry to be exactly zero before the factorization.", "B": "It removes the need for any matrix factorization.", "C": "It changes all singular values to negative values.", "D": "It can keep dominant singular directions and discard smaller ones."}, "answer": "D", "explanation": {"right": "<p>Truncated SVD represents a matrix using dominant singular directions and discards smaller ones, giving a controlled low-rank approximation. For Frobenius or spectral norm, retaining the leading components is optimal among matrices of the specified rank.<\/p>\n", "wrong": "<p>A only allows an uninformative zero matrix. B denies the factorization method. C is false because singular values are nonnegative, not deliberately made negative.<\/p>\n", "cue": "<p>Low rank captures dominant structure; it need not preserve every detail, label-relevant feature or rare event.<\/p>\n"}}]}, {"number": 6, "title": "Autoencoders", "notes": [{"number": 11, "title": "Week 6 — Autoencoder fundamentals", "scope": "Questions 1–10", "html": "<h1 id=\"learn-a-code-by-reconstructing-data\">Learn a code by reconstructing data<\/h1>\n<p>An <strong>encoder<\/strong> maps input x to latent code z=fθ(x). A <strong>decoder<\/strong> maps z to reconstruction x̂=gφ(z). The objective measures reconstruction quality and may include regularizers. The code is an internal representation, not automatically a class label or probability. Training is often unsupervised/self-supervised because the input supplies its reconstruction target.<\/p>\n<h2 id=\"machine-example\">Machine example<\/h2>\n<p>x=(4,2); z=0.5x₁+0.5x₂=3; decoder x̂=(z,z)=(3,3). Reconstruction loss is <strong>(4−3)²+(2−3)²=2<\/strong>. Mean over the two coordinates would be1, and a half-sum would also be1, but neither is the stated sum. Reconstruction is approximate because a one-scalar code cannot uniquely preserve every possible two-dimensional input using this decoder.<\/p>\n<table>\n<thead>\n<tr>\n<th>Architecture role<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Input width<\/td>\n<td>Number of observed coordinates<\/td>\n<\/tr>\n<tr>\n<td>Latent width<\/td>\n<td>Number of code coordinates<\/td>\n<\/tr>\n<tr>\n<td>Output width<\/td>\n<td>Number of reconstructed coordinates, usually same as input<\/td>\n<\/tr>\n<tr>\n<td>Reconstruction loss<\/td>\n<td>Mismatch in the original target space<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The report model <strong>5→2→5<\/strong> has input dimension5, latent2 and reconstruction5. It is <strong>undercomplete<\/strong> because2&lt;5. An <strong>overcomplete<\/strong> code has more dimensions than input; regularization can still make it informative. A bottleneck encourages compression, but even an undercomplete powerful model can memorize a finite dataset without learning useful general structure.<\/p>\n<h2 id=\"choosing-reconstruction-loss\">Choosing reconstruction loss<\/h2>\n<p>For real-valued continuous inputs, squared error is common. For binary/Bernoulli-type outputs, sigmoid outputs with binary cross-entropy may suit the model. Reconstruction loss should match data type, normalization and desired error behavior. A sigmoid reconstruction cannot reproduce an arbitrary unscaled negative real target.<\/p>\n<p>An autoencoder minimizes reconstruction error; an ordinary supervised classifier minimizes label error. A decoder is essential during reconstruction training but can be discarded if only encoder features are needed downstream. Good reconstruction does not automatically imply discriminative, causal or semantically meaningful latent factors.<\/p>\n<h2 id=\"relationship-with-pca\">Relationship with PCA<\/h2>\n<p>A suitably specified linear undercomplete autoencoder trained to a global squared-error reconstruction optimum can recover a principal subspace. This does <strong>not<\/strong> require its latent coordinates/weights to equal PCA's particular orthonormal basis. Several encoder/decoder transformations can describe the same subspace and reconstruction. Nonlinear activations permit nonlinear representation/reconstruction structures beyond ordinary linear PCA. Reference: <a href=\"https://www.deeplearningbook.org/contents/autoencoders.html\">Deep Learning: autoencoders<\/a>.<\/p>\n<p><strong>Uses:<\/strong> compression, learned features, denoising and anomaly scoring. A high reconstruction error can indicate a distribution mismatch, but is not a guaranteed anomaly label; a flexible decoder may reconstruct unusual examples well. Evaluate with data appropriate to the intended application.<\/p>\n<p><strong>Memory:<\/strong> fewer code coordinates means undercomplete; few active units means sparse. The first concerns capacity/width, the second activity. A model may have one, both or neither. Encoder producesz; decoder producesx̂; loss comparesx̂ with the selected target.<\/p>\n"}, {"number": 12, "title": "Week 6 — Denoising, sparse and contractive codes", "scope": "Questions 11–20", "html": "<h1 id=\"different-objectives-encourage-different-representations\">Different objectives encourage different representations<\/h1>\n<h2 id=\"denoising\">Denoising<\/h2>\n<p>A denoising autoencoder sees corrupted input <strong>x̃<\/strong>, but the loss compares its reconstruction against <strong>clean x<\/strong>. This trains stable recovery from a known corruption process rather than rewarding an identity mapping of the noisy observation. Corruption can include masking, additive noise or another task-appropriate distortion.<\/p>\n<p>Case: cleanx=(5,1),noisyx̃=(5,0),predictionx̂=(4,1). Correct loss=(5−4)²+(1−1)²=<strong>1<\/strong>. Comparing againstnoisy(5,0) would instead give2 and train the wrong objective. Output(4,1) is neither the encoder input nor the clean target; keep all three variables distinct.<\/p>\n<p>The corruption should preserve a recoverable relationship to clean data. Removing every informative coordinate or using a mismatch to deployment noise can make recovery difficult. A clean target can be derived from the same raw example, so external class labels are not required.<\/p>\n<h2 id=\"sparse-coding-through-autoencoders\">Sparse coding through autoencoders<\/h2>\n<p>Use <strong>Ltotal=Lrec+λΩsparse<\/strong>. In the assignment Lrec=0.8,Ω0.3,λ2: contribution0.6,total <strong>1.4<\/strong>. A regularizer value and its weighted contribution are different. Changing a penalty's normalization changes the meaning ofλ.<\/p>\n<p>Sparsity can penalize absolute activations or target a low average activation. A common sigmoid-code penalty uses <strong>Σⱼ KL(ρ || ρ̂ⱼ)<\/strong>, whereρ is desired mean activity andρ̂ⱼ is observed mean activity. It encourages few strongly active units rather than requiring every unit to be permanently zero. Activations can be sparse even in an overcomplete layer.<\/p>\n<h2 id=\"contractive-regularization\">Contractive regularization<\/h2>\n<p>A contractive objective adds <strong>λ||Jf(x)||²F<\/strong>, where <strong>Jf=∂z/∂x<\/strong> is the encoder's input Jacobian. Reducing its magnitude discourages large representation changes from small input perturbations. It does not directly mean fewer active units, fewer layers or a smaller code dimension.<\/p>\n<p>For a sigmoid encoder zⱼ=σ(wⱼᵀx+bⱼ), Jacobian rowj=zⱼ(1−zⱼ)wⱼᵀ, so squared Frobenius contribution sums <strong>[zⱼ(1−zⱼ)]²||wⱼ||²<\/strong>. This shows the penalty depends on both weights and activation sensitivity. Excessive contraction can collapse useful distinctions, so reconstruction/task performance must still be balanced.<\/p>\n<table>\n<thead>\n<tr>\n<th>Variant<\/th>\n<th>What changes?<\/th>\n<th>Main preference<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Undercomplete<\/td>\n<td>Latent width smaller than input<\/td>\n<td>Compact representation<\/td>\n<\/tr>\n<tr>\n<td>Denoising<\/td>\n<td>Corrupted input, clean reconstruction target<\/td>\n<td>Recover stable structure<\/td>\n<\/tr>\n<tr>\n<td>Sparse<\/td>\n<td>Penalty on activation activity<\/td>\n<td>Few active responses<\/td>\n<\/tr>\n<tr>\n<td>Contractive<\/td>\n<td>Penalty on encoder input Jacobian<\/td>\n<td>Local representation stability<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>These choices can be combined. Denoising changes the training input/target relationship; contractive regularization explicitly penalizes local sensitivity; sparse regularization penalizes activity. They share a robustness/representation-learning motivation but are not identical objectives.<\/p>\n<p><strong>Likely patterns:<\/strong> distinguish clean target from noisy input and prediction; calculate penalty×coefficient before adding; reject claims that regularization removes the decoder or all data; know that nonlinear autoencoders need not reproduce PCA; explain why low reconstruction error alone is an incomplete measure of representation quality.<\/p>\n"}], "cases": [{"number": 1, "title": "Machine Reading Compression", "html": "<p>Input <strong>x=(4,2)ᵀ<\/strong>. Encoder <strong>z=0.5x₁+0.5x₂<\/strong>; decoder <strong>x̂=(z,z)ᵀ<\/strong>. Reconstruction loss <strong>L=(x₁−x̂₁)²+(x₂−x̂₂)²<\/strong>, a sum without averaging or factor 1/2.<\/p>\n"}, {"number": 2, "title": "Report Feature Compression", "html": "<p>A report-compression model uses an autoencoder with <strong>5 input features<\/strong>, a latent layer with <strong>2 units<\/strong>, and a decoder reconstructing the original <strong>5 features<\/strong>.<\/p>\n"}, {"number": 3, "title": "Meter Reading Recovery", "html": "<p>Clean target <strong>x=(5,1)ᵀ<\/strong>, corrupted encoder input <strong>x̃=(5,0)ᵀ<\/strong>, reconstruction <strong>x̂=(4,1)ᵀ<\/strong>. Train from noisy input toward the clean target, using <strong>L=(x₁−x̂₁)²+(x₂−x̂₂)²<\/strong>.<\/p>\n"}, {"number": 4, "title": "Compact Representation Control", "html": "<p>The reconstruction loss is <strong>Lrec=0.8<\/strong>. A sparsity penalty has value <strong>0.3<\/strong>, with coefficient <strong>λ=2<\/strong>, so <strong>Lsparse=Lrec+λ(0.3)<\/strong>. A separate experiment uses a contractive penalty on encoder sensitivity to small input changes.<\/p>\n"}], "questions": [{"n": 1, "stem": "What is the latent value z?", "options": {"A": "3", "B": "2", "C": "4", "D": "1"}, "answer": "A", "explanation": {"right": "<p>Encoder output z=0.5×4+0.5×2=2+1=3. The two-feature input becomes one scalar latent representation.<\/p>\n", "wrong": "<p>B=2 and C4 are original coordinates rather than their average. D1 includes only the second contribution. The encoder—not the decoder—creates z.<\/p>\n", "cue": "<p>Encoder compresses to z; decoder reconstructs from z. Follow the direction input→latent→reconstruction.<\/p>\n"}}, {"n": 2, "stem": "What is the reconstructed vector x̂?", "options": {"A": "(2, 2)⊤", "B": "(3, 3)⊤", "C": "(4, 4)⊤", "D": "(3, 2)⊤"}, "answer": "B", "explanation": {"right": "<p>The decoder explicitly sets both outputs equal to z. With z=3, x̂=(3,3)ᵀ.<\/p>\n", "wrong": "<p>A(2,2) uses the smaller input coordinate. C(4,4) uses the larger. D(3,2) changes only one coordinate even though both decoder formulas equal z.<\/p>\n", "cue": "<p>Use the decoder formula, not an assumption that reconstruction exactly reproduces the input.<\/p>\n"}}, {"n": 3, "stem": "What is the reconstruction loss?", "options": {"A": "4", "B": "1", "C": "2", "D": "0"}, "answer": "C", "explanation": {"right": "<p>Loss=(4−3)²+(2−3)²=1+1=2. It is a sum over two coordinates without averaging.<\/p>\n", "wrong": "<p>A4 overcounts the error. B=1 would be mean squared error across coordinates, not the specified sum. D0 incorrectly assumes perfect reconstruction.<\/p>\n", "cue": "<p>Read whether reconstruction loss is a sum, mean or half-sum; the same prediction can produce different reported numbers.<\/p>\n"}}, {"n": 4, "stem": "Which part of the autoencoder creates the latent representation?", "options": {"A": "The decoder output layer", "B": "The reconstruction loss", "C": "The target label table", "D": "The encoder layer"}, "answer": "D", "explanation": {"right": "<p>The encoder maps input x to latent code z, which is the representation being learned. The decoder then maps z back to x̂.<\/p>\n", "wrong": "<p>A performs reconstruction. B scores the mismatch and is not a mapping into latent coordinates. C supplies external labels, not the encoder in this autoencoder task.<\/p>\n", "cue": "<p>Encode=represent; decode=reconstruct; loss=compare.<\/p>\n"}}, {"n": 5, "stem": "What is the training objective of this autoencoder?", "options": {"A": "To minimize reconstruction error.", "B": "To assign external class labels before any reconstruction is attempted.", "C": "To ignore the input features.", "D": "To make every latent value zero."}, "answer": "A", "explanation": {"right": "<p>Training minimizes mismatch between the input target and its reconstruction, shaping encoder/decoder parameters to preserve useful structure through the code.<\/p>\n", "wrong": "<p>B turns it into a supervised labeling task not specified here. C removes the information to be reconstructed. D forces a degenerate code without ensuring low reconstruction error.<\/p>\n", "cue": "<p>Autoencoder target is the input(or clean version), not necessarily a separate class label.<\/p>\n"}}, {"n": 6, "stem": "What is the input dimension?", "options": {"A": "2", "B": "5", "C": "7", "D": "10"}, "answer": "B", "explanation": {"right": "<p>Each report is described by five input features, so input dimension=5. The hidden code size and output size are separate dimensions.<\/p>\n", "wrong": "<p>A2 is the latent dimension. C7 adds input and latent sizes, which is not one vector's dimension. D10 counts input and output coordinates together.<\/p>\n", "cue": "<p>An architecture5→2→5 names three layer widths, not one combined feature dimension.<\/p>\n"}}, {"n": 7, "stem": "What is the latent dimension?", "options": {"A": "1", "B": "5", "C": "2", "D": "7"}, "answer": "C", "explanation": {"right": "<p>The compressed representation contains two hidden units, so each report receives a two-dimensional code.<\/p>\n", "wrong": "<p>A1 is not specified. B=5 is the original/reconstructed width. D7 sums unrelated layer widths.<\/p>\n", "cue": "<p>Latent dimension is the bottleneck width, not the total number of neurons in the whole network.<\/p>\n"}}, {"n": 8, "stem": "Why is the model undercomplete?", "options": {"A": "The decoder has no reconstruction target.", "B": "The output layer ignores all reconstructed features during training.", "C": "The input has fewer features than the latent layer.", "D": "The latent dimension is smaller than the input dimension."}, "answer": "D", "explanation": {"right": "<p>An undercomplete autoencoder has fewer latent coordinates than input coordinates:2&lt;5 here. That bottleneck limits direct copying and encourages a compact representation.<\/p>\n", "wrong": "<p>A is false because input reconstruction provides a target. B falsely ignores the reconstructed features. C reverses the dimension relationship.<\/p>\n", "cue": "<p>Undercomplete=code smaller than input; overcomplete=code larger. Compression does not guarantee every learned feature is useful.<\/p>\n"}}, {"n": 9, "stem": "Which output dimension is required to reconstruct the original input?", "options": {"A": "5", "B": "1", "C": "2", "D": "3"}, "answer": "A", "explanation": {"right": "<p>To reconstruct the original five-component vector, the decoder must output five coordinates corresponding to the original features.<\/p>\n", "wrong": "<p>B=1,C2,D3 cannot directly produce a full five-component reconstruction under the stated architecture. C confuses code size with output size.<\/p>\n", "cue": "<p>Compression occurs in the middle; reconstruction returns to the original input space.<\/p>\n"}}, {"n": 10, "stem": "How is this related to PCA in the linear case?", "options": {"A": "It must always produce a one-hot class label.", "B": "It can learn a low-dimensional representation similar to PCA.", "C": "It removes the need for reconstruction in every training example.", "D": "It makes every component have zero variance."}, "answer": "B", "explanation": {"right": "<p>A linear undercomplete autoencoder trained to minimize squared reconstruction error can learn the same principal subspace as PCA under appropriate conditions. The latent coordinates need not be exactly PCA's orthonormal component coordinates.<\/p>\n", "wrong": "<p>A introduces one-hot labels. C removes the training objective. D removes variance rather than retaining principal structure. Nonlinear autoencoders can learn representations beyond linear PCA.<\/p>\n", "cue": "<p>Same principal subspace does not mean identical encoder weights. Reference: <a href=\"https://www.deeplearningbook.org/contents/autoencoders.html\">Deep Learning: autoencoders<\/a>.<\/p>\n"}}, {"n": 11, "stem": "Which vector is given to the encoder during training?", "options": {"A": "x = (5, 1)⊤", "B": "x̂ = (4, 1)⊤", "C": "(0, 0)⊤", "D": "x̃ = (5, 0)⊤"}, "answer": "D", "explanation": {"right": "<p>In a denoising autoencoder, the encoder receives the corrupted reading x̃=(5,0). Training asks it to recover stable structure despite missing/noisy input.<\/p>\n", "wrong": "<p>A is the clean target, not this encoder input. B is the produced reconstruction. C is neither the given corrupted vector nor target.<\/p>\n", "cue": "<p>Denoising: noisy in, clean target. Distinguish input, target and actual output.<\/p>\n"}}, {"n": 12, "stem": "Which vector is the clean reconstruction target?", "options": {"A": "(4, 1)⊤", "B": "(5, 0)⊤", "C": "(5, 1)⊤", "D": "(0, 1)⊤"}, "answer": "C", "explanation": {"right": "<p>The loss compares the model's output against clean x=(5,1), even though the encoder received(5,0). The clean target prevents the network being rewarded simply for reproducing the corruption.<\/p>\n", "wrong": "<p>A(4,1) is the prediction. B(5,0) is the corrupted input. D(0,1) is not the given clean vector.<\/p>\n", "cue": "<p>An autoencoder can be trained without external class labels while still having a clearly defined reconstruction target.<\/p>\n"}}, {"n": 13, "stem": "What is the reconstruction loss?", "options": {"A": "0", "B": "2", "C": "4", "D": "1"}, "answer": "D", "explanation": {"right": "<p>Compare clean target(5,1) with prediction(4,1): loss=(5−4)²+(1−1)²=1+0=1.<\/p>\n", "wrong": "<p>A0 assumes perfect recovery. B=2 and C4 overstate the discrepancy. Comparing against the corrupted input would instead produce2, which explains why B is tempting but wrong.<\/p>\n", "cue": "<p>Loss target is clean x, not corrupted x̃.<\/p>\n"}}, {"n": 14, "stem": "What is the purpose of using corrupted inputs?", "options": {"A": "To train the model to recover clean structure.", "B": "To remove the decoder from the network before training begins.", "C": "To force every output to equal zero.", "D": "To avoid computing any reconstruction loss."}, "answer": "A", "explanation": {"right": "<p>Corrupting the input while keeping a clean target trains recovery of stable patterns and discourages a trivial identity copy of the observed corruption.<\/p>\n", "wrong": "<p>B removes the decoder needed for reconstruction. C encourages constant zeros rather than data recovery. D removes the comparison signal needed to learn.<\/p>\n", "cue": "<p>Denoising changes what the encoder sees, not the clean target the loss should match.<\/p>\n"}}, {"n": 15, "stem": "Which statement best describes this training setup?", "options": {"A": "The model ignores all input values.", "B": "The model maps noisy input toward a clean target.", "C": "The target is the corrupted vector only.", "D": "The encoder output is used as the final label for every noisy example."}, "answer": "B", "explanation": {"right": "<p>The model learns a mapping from noisy input toward a clean reconstruction. Here(5,0) goes through the network and is judged against(5,1), not against a class label.<\/p>\n", "wrong": "<p>A ignores the informative input. C uses the wrong target. D confuses the internal latent code with an external final label.<\/p>\n", "cue": "<p>Representation learning can use self-generated targets; supervised class labels are not required for this denoising objective.<\/p>\n"}}, {"n": 16, "stem": "What is the sparsity penalty contribution?", "options": {"A": "0.3", "B": "0.8", "C": "0.6", "D": "1.1"}, "answer": "C", "explanation": {"right": "<p>Weighted sparsity contribution=λ×penalty=2×0.3=0.6. The question asks for this term only, not the full objective.<\/p>\n", "wrong": "<p>A0.3 omitsλ. B=0.8 is reconstruction loss. D1.1 adds0.8+0.3 but still ignoresλ.<\/p>\n", "cue": "<p>Penalty value, penalty coefficient and weighted contribution are three separate quantities.<\/p>\n"}}, {"n": 17, "stem": "What is Lsparse ?", "options": {"A": "1.4", "B": "1.1", "C": "0.8", "D": "0.6"}, "answer": "A", "explanation": {"right": "<p>Full sparse objective=0.8+2×0.3=0.8+0.6=1.4.<\/p>\n", "wrong": "<p>B=1.1 omits coefficient2. C0.8 omits regularization. D0.6 reports only its contribution.<\/p>\n", "cue": "<p>Total objective=data/reconstruction loss+weighted regularizer.<\/p>\n"}}, {"n": 18, "stem": "What does sparse regularization encourage?", "options": {"A": "Every hidden unit must always be active during the full reconstruction process.", "B": "The decoder is removed from the model.", "C": "Only a small number of hidden units should be active.", "D": "The input dimension must equal zero."}, "answer": "C", "explanation": {"right": "<p>Sparse regularization favors representations in which relatively few hidden units are strongly active for an input, or low average activation depending on the chosen penalty.<\/p>\n", "wrong": "<p>A is the opposite of sparsity. B deletes a needed reconstruction component. D removes the input altogether. Sparse activations do not necessarily require zeroing the same units for every example.<\/p>\n", "cue": "<p>Sparse code=few active responses; undercomplete code=few available coordinates. They are different properties.<\/p>\n"}}, {"n": 19, "stem": "What is the goal of a contractive penalty?", "options": {"A": "To force reconstruction loss to be ignored throughout all training.", "B": "To make all weights increase without bound after every input change.", "C": "To replace the encoder with class labels.", "D": "To make the representation less sensitive to small input changes."}, "answer": "D", "explanation": {"right": "<p>A contractive penalty discourages a large encoder Jacobian, making z=f(x) change less under small input perturbations. It directly regularizes local sensitivity rather than simply limiting the number of units.<\/p>\n", "wrong": "<p>A removes reconstruction supervision. B increases sensitivity/weight magnitude without bound. C replaces the representation with labels, unrelated to contractivity.<\/p>\n", "cue": "<p>Contractive=small local change in representation for a small input change. Typical penalty isλ times squared Frobenius norm of ∂f/∂x.<\/p>\n"}}, {"n": 20, "stem": "Why are such penalties added to the reconstruction loss?", "options": {"A": "To remove all training data from the objective.", "B": "To control the learned representation beyond plain reconstruction.", "C": "To stop the model from producing reconstructions.", "D": "To make every feature identical to every other feature before encoding."}, "answer": "B", "explanation": {"right": "<p>Plain reconstruction may allow undesirable solutions such as excessively active or unstable codes. Additional penalties shape the representation toward sparsity, robustness or another desired property while retaining reconstruction as part of the objective.<\/p>\n", "wrong": "<p>A removes data instead of regularizing a learned representation. C contradicts reconstruction. D imposes feature identity not implied by either penalty.<\/p>\n", "cue": "<p>Different regularizers impose different preferences; stronger is not always better because reconstruction/task performance can worsen.<\/p>\n"}}]}, {"number": 7, "title": "Generalization", "notes": [{"number": 13, "title": "Week 7 — Bias, variance and regularization", "scope": "Questions 1–10", "html": "<h1 id=\"fit-the-training-data-and-generalize-beyond-it\">Fit the training data and generalize beyond it<\/h1>\n<p>For squared-error regression at a fixed inputx, under the standard zero-mean-noise assumptions, <strong>expected test error=bias²+variance+irreducible noise variance<\/strong>. Bias measures how far the average fitted prediction is from the true conditional mean; variance measures changes in fitted predictions across different training datasets. Noise is variability remaining even with the best conditional-mean predictor.<\/p>\n<p><strong>High bias/underfitting:<\/strong> overly restrictive model, poor features or insufficient optimization can miss structure. <strong>High variance/overfitting:<\/strong> predictions depend excessively on sample quirks. A stable model can be consistently wrong. A model that fits training labels almost perfectly can still perform poorly on unseen inputs.<\/p>\n<h2 id=\"water-demand-calculation\">Water-demand calculation<\/h2>\n<p>Predictions41,49,45,53 have mean47. True conditional demand48 gives bias−1,squared bias <strong>1<\/strong>. Deviations from prediction mean:−6,2,−2,6. Their mean square=(36+4+4+36)/4=<strong>20<\/strong>, the empirical population-style variance across these four models. Mean squared error against48=(49+1+9+25)/4=<strong>21<\/strong>, equal1+20 here. An additional future-outcome noise term cannot be recovered from these predictions alone.<\/p>\n<table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>Possible response<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Training and validation both poor<\/td>\n<td>Better features/model, optimize properly, reduce excessive regularization<\/td>\n<\/tr>\n<tr>\n<td>Training good, validation poor<\/td>\n<td>More suitable data, regularization, augmentation, early stopping, leakage/distribution checks<\/td>\n<\/tr>\n<tr>\n<td>Predictions unstable across fits<\/td>\n<td>Reduce effective flexibility or average diverse models<\/td>\n<\/tr>\n<tr>\n<td>Strong systematic error<\/td>\n<td>Improve model assumptions/features rather than only averaging<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>These are diagnostic tendencies, not automatic proofs: a train/validation distribution mismatch can also create a gap. Inspect data quality and the evaluation design before adjusting network size blindly.<\/p>\n<h2 id=\"l2-objective-and-gradient\">L2 objective and gradient<\/h2>\n<p><strong>Jtotal=Jdata+αΣwᵢ²<\/strong>, so <strong>∂Jtotal/∂wᵢ=∂Jdata/∂wᵢ+2αwᵢ<\/strong>. Loan example:w=3,data gradient4,α=2→regularizer gradient12,total16. Withη0.1, <strong>wnew=1.4<\/strong>. Using only data loss would give2.6.<\/p>\n<p>Plain GD can be written <strong>wnew=(1−2ηα)w−ηgdata<\/strong> for this convention, showing weight shrinkage when the factor is appropriate. If the penalty were(λ/2)||w||², its gradient would instead beλw. Biases may be excluded by convention; follow the stated objective.<\/p>\n<p><strong>L1:<\/strong> penaltyλΣabs(wᵢ), with sign-based subgradients away from zero, often encourages exact zeros under suitable optimization. <strong>L2:<\/strong> discourages large weights and often distributes influence across correlated features; it does not generally make every weight exactly zero. Excessive regularization can raise bias and worsen validation performance.<\/p>\n<p>L2-in-loss equals a corresponding shrinkage update for ordinary GD under matched conventions, but not generally decoupled weight decay for Adam. Select regularization strength using validation; keep the final test set separate.<\/p>\n<p><strong>Memory:<\/strong> bias is error of the average model; variance is variation among fitted models. A penalty changes the optimization preference, not the supplied labels or the number of classes.<\/p>\n"}, {"number": 14, "title": "Week 7 — Early stopping, augmentation and ensembles", "scope": "Questions 11–20", "html": "<h1 id=\"generalization-depends-on-the-whole-evaluation-pipeline\">Generalization depends on the whole evaluation pipeline<\/h1>\n<p><strong>Training set:<\/strong> computes parameter-fitting gradients. <strong>Validation set:<\/strong> chooses hyperparameters, architecture and checkpoints. <strong>Test set:<\/strong> evaluates the selected final procedure. Repeatedly selecting based on test performance makes it part of model selection, weakening its value as an untouched final estimate. Data preprocessing statistics should ordinarily be fitted on training data and then applied to held-out data.<\/p>\n<h2 id=\"early-stopping\">Early stopping<\/h2>\n<p>The supplied validation losses at epochs5,10,15,20,25 are0.70,0.52,<strong>0.43<\/strong>,0.46,0.51. Choose epoch15, even though training loss keeps falling. Save the best checkpoint and use a defined <strong>patience<\/strong> to tolerate noise rather than necessarily stopping on one worse measurement. Early stopping is regularization by limiting continued fitting, not a guarantee of global optimality.<\/p>\n<h2 id=\"augmentation-without-leakage\">Augmentation without leakage<\/h2>\n<p>900 originals,70/30 split→<strong>630 training,270 validation<\/strong>. Two additional variants per training original plus the originals→<strong>630×3=1,890 training examples<\/strong> in this constructed setting. If augmentation is generated online, there may be no single fixed stored-set size; follow the question's counting assumptions.<\/p>\n<p>Split original subjects/items first, then augment training data. If variants of one original appear in both train and validation, performance can be inflated. For repeated images from a patient/product/person, splitting by that group may be needed. For forecasting, respect time order. Transformations must preserve labels: a mild shift may preserve a surface-defect label; a large crop removing the defect may not.<\/p>\n<h2 id=\"dropout\">Dropout<\/h2>\n<p>Each hidden unit is independently retained with probabilityp during ordinary dropout training. With n=50,p=0.8, <strong>expected active count=np=40<\/strong>, dropped count10. Actual counts vary; binomial variance=np(1−p)=8 under independence. Dropout discourages reliance on a fixed set of co-adapting responses.<\/p>\n<p><strong>Inverted dropout:<\/strong> train output=m a/p, where m∈{0,1} is the keep mask. Its expectation equalsa; inference uses the full activation without another p factor. In the alternative ordinary convention, training is unscaled and inference scales appropriately. Do not scale both ways. Dropout is normally disabled during deterministic evaluation, unlike targeted occlusion used to investigate a prediction.<\/p>\n<h2 id=\"ensembles\">Ensembles<\/h2>\n<p>Averaging independently trained models can reduce prediction variance if errors differ. For K equal-variance models with pairwise correlationρ, <strong>variance of mean=σ²[ρ+(1−ρ)/K]<\/strong>. With independent errorsρ0, it isσ²/K; with identical errorsρ1, averaging gives no reduction. Separate training seeds do not guarantee independent errors because the models may share data and architecture.<\/p>\n<p>For classification, specify whether averaging probabilities or voting on labels; these need not yield identical outcomes. An ensemble can retain systematic bias and incurs extra compute. More models are useful only if added diversity/improvement justifies cost.<\/p>\n<p><strong>Question patterns:<\/strong> lower train/higher validation loss→overfitting warning; minimum validation checkpoint→early stopping; realistic variants→augmentation; random activation masking→dropout; combining diverse fits→ensemble. None guarantees perfect future predictions, removes all bias or eliminates the need for labels/evaluation.<\/p>\n"}], "cases": [{"number": 1, "title": "Water Demand Forecasting", "html": "<p>A simple model has stable but systematically inaccurate predictions across training sets. A flexible network varies substantially across training subsets. For one input the network predictions are <strong>41,49,45,53<\/strong>, true conditional demand <strong>48<\/strong>. Use <strong>expected squared error = bias² + variance + irreducible noise variance<\/strong>, under the usual regression assumptions.<\/p>\n"}, {"number": 2, "title": "Small-Business Loan Risk Scoring", "html": "<p>Objective <strong>Jtotal=Jdata+αΣwᵢ²<\/strong>. For one parameter: <strong>w=3<\/strong>, data-loss gradient <strong>4<\/strong>, <strong>α=2<\/strong>, <strong>η=0.1<\/strong>. Thus <strong>∂Jtotal/∂w=4+2αw<\/strong>. The coefficient convention is α, not α/2.<\/p>\n"}, {"number": 3, "title": "Energy Consumption Prediction", "html": "<table>\n<thead>\n<tr>\n<th>Epoch<\/th>\n<th>Training loss<\/th>\n<th>Validation loss<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>0.62<\/td>\n<td>0.70<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>0.44<\/td>\n<td>0.52<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>0.31<\/td>\n<td>0.43<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>0.22<\/td>\n<td>0.46<\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>0.16<\/td>\n<td>0.51<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Early stopping selects a checkpoint using validation behavior. The test set is reserved for final evaluation, not repeated checkpoint selection.<\/p>\n"}, {"number": 4, "title": "Product-Surface Image Inspection", "html": "<p>There are <strong>900 labeled images<\/strong>, split <strong>70% training / 30% validation<\/strong>. Each original training image generates <strong>two additional augmented images<\/strong>, and the original is retained. A layer has <strong>50 hidden units<\/strong>, each kept with probability <strong>p=0.8<\/strong> during dropout training. The full network is used with suitable scaling at test time. An ensemble averages <strong>three independently trained CNNs<\/strong>.<\/p>\n"}], "questions": [{"n": 1, "stem": "Which description best matches the simple linear model?", "options": {"A": "High bias and low variance", "B": "Low bias and high variance", "C": "Low bias and low variance", "D": "High variance and zero bias"}, "answer": "A", "explanation": {"right": "<p>The simple model's average prediction is far from the truth, indicating high bias, while its predictions barely change across training sets, indicating low variance. These describe systematic error versus training-set sensitivity.<\/p>\n", "wrong": "<p>B reverses both properties. C incorrectly calls bias low. D incorrectly calls variance high and bias zero. A model can be consistently wrong without being unstable.<\/p>\n", "cue": "<p>Bias=wrong on average; variance=changes across training sets. Stability alone does not imply accuracy.<\/p>\n"}}, {"n": 2, "stem": "What is the average neural-network prediction for the given input?", "options": {"A": "46", "B": "48", "C": "47", "D": "50"}, "answer": "C", "explanation": {"right": "<p>Average prediction=(41+49+45+53)/4=188/4=47. This estimates the model's mean prediction over the four training subsets for this fixed input.<\/p>\n", "wrong": "<p>A46 and B=48 are incorrect means;48 is the true demand, not the model's mean. D50 is also not188/4.<\/p>\n", "cue": "<p>Average predictions first when computing bias; do not average absolute errors instead.<\/p>\n"}}, {"n": 3, "stem": "What is the squared bias of the neural-network predictions for this input?", "options": {"A": "4", "B": "9", "C": "0", "D": "1"}, "answer": "D", "explanation": {"right": "<p>Bias=mean prediction−true conditional target=47−48=−1. Squared bias=(−1)²=1.<\/p>\n", "wrong": "<p>A4 and B=9 overstate the mean offset. C0 would require a mean prediction exactly48. Individual predictions being far from48 affects variance/error, not just squared bias.<\/p>\n", "cue": "<p>Squared bias is square of mean error, not mean squared error across the predictions.<\/p>\n"}}, {"n": 4, "stem": "What does the large variation among the neural-network predictions indicate?", "options": {"A": "The model has no irreducible error.", "B": "The model has high variance under the case assumptions.", "C": "The output labels are unavailable for the described model.", "D": "The model is too simple for the data."}, "answer": "B", "explanation": {"right": "<p>The network's prediction changes markedly depending on the sampled training set, the defining idea of high variance. It may fit each training set well yet generalize unstably.<\/p>\n", "wrong": "<p>A cannot be inferred because noise variance is separate. C contradicts the supplied target/demand. D describes an overly simple/high-bias model, whereas this network is flexible and unstable.<\/p>\n", "cue": "<p>Variance is across fitted models at the same input, not merely variation of input features.<\/p>\n"}}, {"n": 5, "stem": "Which action is most directly aimed at reducing the neural network’s variance?", "options": {"A": "Add a suitable regularization method.", "B": "Remove the validation set entirely.", "C": "Increase model depth without constraints.", "D": "Train until training loss becomes zero."}, "answer": "A", "explanation": {"right": "<p>Suitable regularization can restrict effective flexibility and reduce dependence on particular training samples, addressing high variance. It may introduce some additional bias while reducing total test error.<\/p>\n", "wrong": "<p>B removes the tool used to detect poor generalization. C increases capacity without controlling it. D encourages fitting training data indefinitely and may worsen overfitting.<\/p>\n", "cue": "<p>For high variance, consider regularization, more data, augmentation or averaging; for high bias, consider more appropriate features/capacity.<\/p>\n"}}, {"n": 6, "stem": "What is the main purpose of adding L2 regularization here?", "options": {"A": "To remove the need for training data for the described model", "B": "To discourage large weights for the described model", "C": "To guarantee perfect validation accuracy", "D": "To convert logistic regression into clustering"}, "answer": "B", "explanation": {"right": "<p>L2 addsαΣw², making large weight magnitudes costly. This discourages overly sensitive fits and can reduce variance; it does not force every coefficient to vanish.<\/p>\n", "wrong": "<p>A removes training data without learning. C makes an impossible performance guarantee. D changes the task from supervised prediction to clustering, which L2 does not do.<\/p>\n", "cue": "<p>L2 discourages large weights; L1 more directly encourages exact zeros in many optimization settings.<\/p>\n"}}, {"n": 7, "stem": "What is the regularization contribution 2αw to the gradient?", "options": {"A": "10", "B": "6", "C": "8", "D": "12"}, "answer": "D", "explanation": {"right": "<p>Withα2 and w=3, regularization derivative=2αw=2×2×3=12. The specified objective has no½ on this term.<\/p>\n", "wrong": "<p>A10,B=6,C8 are not the product. B=6 would arise fromαw, a different½-normalized penalty convention.<\/p>\n", "cue": "<p>Forαw², derivative2αw. For(α/2)w², derivativeαw. Always check normalization.<\/p>\n"}}, {"n": 8, "stem": "What is the full regularized gradient for this parameter?", "options": {"A": "16", "B": "12", "C": "10", "D": "14"}, "answer": "A", "explanation": {"right": "<p>Add data and penalty gradients: gtotal=4+12=16. Gradient contributions add because the objective is a sum.<\/p>\n", "wrong": "<p>B=12 includes only regularization. C10 and D14 miscompute or combine the terms. Multiplying gradients would not differentiate the sum correctly.<\/p>\n", "cue": "<p>Derivative of data loss+regularizer=gradient of data loss+gradient of regularizer.<\/p>\n"}}, {"n": 9, "stem": "What is the updated value of w after one gradient-descent step?", "options": {"A": "2.0", "B": "2.6", "C": "1.4", "D": "3.6"}, "answer": "C", "explanation": {"right": "<p>Use the full gradient16: wnew=3−0.1×16=3−1.6=1.4. Using the data gradient alone would give2.6.<\/p>\n", "wrong": "<p>A2.0 is not this update. B=2.6 omits regularization. D3.6 increases the parameter despite a positive total gradient.<\/p>\n", "cue": "<p>Calculate the gradient of the entire optimized objective before applying the descent rule.<\/p>\n"}}, {"n": 10, "stem": "Which outcome is expected after applying an appropriate L2 penalty?", "options": {"A": "Training accuracy must become zero for the data shown here.", "B": "Validation performance may improve due to reduced overfitting.", "C": "All feature weights must become exactly zero.", "D": "The model stops using gradient descent under the given conditions."}, "answer": "B", "explanation": {"right": "<p>An appropriate L2 strength may improve validation performance by reducing overfitting, though it may make training fit slightly worse. The effect is empirical and requires validation.<\/p>\n", "wrong": "<p>A does not follow because training accuracy need not be zero. C falsely requires every weight exactly zero. D falsely says gradient descent stops being used.<\/p>\n", "cue": "<p>Regularization is a trade-off, not a guarantee. Too much can cause underfitting.<\/p>\n"}}, {"n": 11, "stem": "At which epoch is the validation loss minimum?", "options": {"A": "Epoch 10", "B": "Epoch 20", "C": "Epoch 15", "D": "Epoch 25"}, "answer": "C", "explanation": {"right": "<p>Validation losses are0.70,0.52,0.43,0.46,0.51. The smallest is0.43 at epoch15, so that is the best listed checkpoint by validation loss.<\/p>\n", "wrong": "<p>A epoch10 gives0.52; B epoch20 gives0.46; D epoch25 gives0.51. Training loss alone continues improving and would choose a different point.<\/p>\n", "cue": "<p>Early stopping should retain the best validation checkpoint, not simply the last completed epoch.<\/p>\n"}}, {"n": 12, "stem": "What pattern after epoch 15 suggests overfitting?", "options": {"A": "Both losses increase together.", "B": "Training loss increases while validation loss decreases.", "C": "Training loss becomes exactly zero.", "D": "Training loss decreases while validation loss increases."}, "answer": "D", "explanation": {"right": "<p>After epoch15 training loss falls0.31→0.22→0.16 while validation rises0.43→0.46→0.51. This divergence indicates increasing specialization to training data and worsening observed generalization.<\/p>\n", "wrong": "<p>A falsely says both rise. B reverses both trends. C claims zero training loss absent from the table.<\/p>\n", "cue": "<p>Training down+validation up is an overfitting warning, especially when sustained rather than one noisy fluctuation.<\/p>\n"}}, {"n": 13, "stem": "Why should early stopping monitor validation loss rather than only training loss?", "options": {"A": "Validation loss reflects performance on unseen data.", "B": "Training loss is not computed during neural-network training.", "C": "Validation loss is always exactly equal to test loss.", "D": "Training loss cannot decrease across epochs."}, "answer": "A", "explanation": {"right": "<p>Validation examples are held out from parameter-fitting updates, so their loss estimates performance beyond the training examples and can guide checkpoint/model selection.<\/p>\n", "wrong": "<p>B is false because training loss is central to optimization. C wrongly equates validation and test losses exactly. D falsely says training loss cannot decline. A validation set used repeatedly is no longer an untouched final test.<\/p>\n", "cue": "<p>Train fits weights; validation selects choices; test estimates final performance after choices are fixed.<\/p>\n"}}, {"n": 14, "stem": "Which statement about early stopping is correct?", "options": {"A": "It guarantees the globally optimal weights.", "B": "It acts as a regularization method by limiting over-training.", "C": "It prevents all forms of noise in input data.", "D": "It removes the need for a validation set under the case assumptions."}, "answer": "B", "explanation": {"right": "<p>Stopping before continued training worsens held-out performance limits effective fitting and acts as regularization. Practical policies often use patience and restore the best checkpoint.<\/p>\n", "wrong": "<p>A falsely guarantees global optimum. C falsely removes input noise. D removes the validation signal needed by the described method.<\/p>\n", "cue": "<p>Early stopping limits training time/capacity in practice; it is not an optimizer that certifies the globally best weights.<\/p>\n"}}, {"n": 15, "stem": "If the team keeps the model from epoch 25 instead of epoch 15, what is the main risk?", "options": {"A": "The training set becomes larger automatically.", "B": "The model cannot produce numerical predictions.", "C": "The validation loss is ignored by definition under the case assumptions.", "D": "The model may generalize worse despite lower training loss."}, "answer": "D", "explanation": {"right": "<p>Epoch25 has lower training loss0.16 but higher validation loss0.51 than epoch15's0.43. Keeping it risks poorer generalization despite the improved training fit.<\/p>\n", "wrong": "<p>A does not create more training data. B wrongly prevents predictions. C does not follow: validation can still be monitored, even if the team chooses a poor checkpoint.<\/p>\n", "cue": "<p>Lower training loss is evidence of better training fit, not automatically better deployment performance.<\/p>\n"}}, {"n": 16, "stem": "How many original images are in the training split before augmentation?", "options": {"A": "270", "B": "900", "C": "630", "D": "450"}, "answer": "C", "explanation": {"right": "<p>Training originals=70%×900=0.7×900=630. The remaining270 are validation images.<\/p>\n", "wrong": "<p>A270 is the validation count. B=900 ignores the split. D450 assumes a50/50 split. The source's damaged percentage sentence is interpreted as70/30, as its solution confirms.<\/p>\n", "cue": "<p>Split originals before augmentation to prevent near-duplicate variants leaking between train and validation.<\/p>\n"}}, {"n": 17, "stem": "What is the effective training-set size after adding two augmented images per original training image?", "options": {"A": "1890", "B": "1260", "C": "630", "D": "1530"}, "answer": "A", "explanation": {"right": "<p>Each of630 training originals is retained and gains two new variants, so total examples=630×(1+2)=1,890. The count refers to this constructed dataset; online augmentation may instead generate fresh variants each epoch.<\/p>\n", "wrong": "<p>B=1,260 counts only added variants. C630 ignores augmentation. D1,530 is not a consistent calculation using the stated split and two additions.<\/p>\n", "cue": "<p>Two additional copies means three examples including the original; two total means something different.<\/p>\n"}}, {"n": 18, "stem": "What is the main reason augmentation can improve validation accuracy?", "options": {"A": "It changes all class labels randomly in the stated case setting.", "B": "It removes the need to learn features.", "C": "It guarantees that training loss is zero.", "D": "It exposes the model to realistic input variations."}, "answer": "D", "explanation": {"right": "<p>Realistic transformations expose the model to variations it should tolerate, such as mild shifts/brightness changes, encouraging more robust features and reducing overfitting.<\/p>\n", "wrong": "<p>A randomly changes labels and destroys supervision. B removes the need for feature learning. C makes an unjustified zero-loss guarantee. Transformations should preserve the task's label; not every flip/rotation is valid.<\/p>\n", "cue": "<p>Augment the nuisance variation, preserve the meaning. More transformed data does not equal the same number of independent new observations.<\/p>\n"}}, {"n": 19, "stem": "During dropout training with keep probability p = 0.8, approximately how many units remain active in a layer of 50 hidden units?", "options": {"A": "25", "B": "10", "C": "40", "D": "50"}, "answer": "C", "explanation": {"right": "<p>Each unit is kept with probability0.8. Expected active units=50×0.8=40. The actual random count can vary from batch to batch.<\/p>\n", "wrong": "<p>A25 assumes keep probability0.5. B=10 is the expected dropped count,50×0.2. D50 ignores dropout.<\/p>\n", "cue": "<p>Keep probability p is not drop probability1−p. Expected active count is np, not a guaranteed exact count.<\/p>\n"}}, {"n": 20, "stem": "Why can averaging three independently trained CNNs improve reliability?", "options": {"A": "It increases the learning rate of each CNN.", "B": "It can reduce variance by combining diverse predictions.", "C": "It removes all bias from every CNN for the data shown here.", "D": "It makes the dataset labels unnecessary."}, "answer": "B", "explanation": {"right": "<p>Averaging models can reduce variance when their errors are not perfectly correlated. Different learned solutions may offset one another's fluctuations, improving reliability on average.<\/p>\n", "wrong": "<p>A does not change individual learning rates. C claims all bias disappears, which averaging does not ensure. D removes necessary supervision. Independence of training attempts helps diversity but does not guarantee independent prediction errors.<\/p>\n", "cue": "<p>Ensemble benefit depends on diverse errors; averaging identical models changes nothing.<\/p>\n"}}]}, {"number": 8, "title": "Training deep networks", "notes": [{"number": 15, "title": "Week 8 — Activations and initialization", "scope": "Questions 1–10", "html": "<h1 id=\"keep-signals-and-gradients-at-useful-scales\">Keep signals and gradients at useful scales<\/h1>\n<table>\n<thead>\n<tr>\n<th>Activation<\/th>\n<th>Formula/range<\/th>\n<th>Derivative and key issue<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Sigmoid<\/td>\n<td>σ(z), range(0,1)<\/td>\n<td>σ(1−σ)≤¼; saturates at both extremes<\/td>\n<\/tr>\n<tr>\n<td>tanh<\/td>\n<td>range(−1,1), zero-centered<\/td>\n<td>1−tanh²; also saturates<\/td>\n<\/tr>\n<tr>\n<td>ReLU<\/td>\n<td>max(0,z), range[0,∞)<\/td>\n<td>1 forz&gt;0,0 forz&lt;0; negative units can die<\/td>\n<\/tr>\n<tr>\n<td>Leaky ReLU<\/td>\n<td>z positive, az negative(a&gt;0 small)<\/td>\n<td>Nonzero negative slope reduces dead-unit problem<\/td>\n<\/tr>\n<tr>\n<td>Linear<\/td>\n<td>z<\/td>\n<td>Derivative1; stacking alone stays affine<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>In a deep network, chain-rule products can vanish or explode because of both activation derivatives and weight matrices. Replacing hidden sigmoid with ReLU helps positive-branch gradients but does not guarantee all gradients remain stable. ReLU(−4)=0,ReLU(2)=2. A binary output can remain sigmoid even when hidden units use ReLU.<\/p>\n<h2 id=\"why-initialization-matters\">Why initialization matters<\/h2>\n<p>If weights are too large, activations/gradients may grow or sigmoid units saturate; too small, signals/gradients may shrink. Identical initial weights in one hidden layer can make neurons receive identical gradients and remain redundant. Random initialization breaks symmetry; initializing biases to the same value is often acceptable because different weight vectors already break the relevant symmetry.<\/p>\n<p><strong>Fan-in:<\/strong> incoming connections per output neuron. <strong>Fan-out:<\/strong> outgoing connections per input coordinate under the chosen layer interpretation. For a dense layerdin→dout, they aredin anddout. A standard convolution's fan-in iskernel_h×kernel_w×Cin. Use the question's initialization convention; not every method uses both fans in the same way.<\/p>\n<h2 id=\"xavierglorot-and-he\">Xavier/Glorot and He<\/h2>\n<p>General Glorot normal variance <strong>2/(fan_in+fan_out)<\/strong>. When both equaln, this becomes <strong>1/n<\/strong>, the assignment's Xavier formula. He fan-in normal variance <strong>2/fan_in<\/strong>, motivated by rectifier signal propagation under approximate symmetry/independence assumptions. For fan-in200: Xavier case variance <strong>0.005<\/strong>,He variance <strong>0.010<\/strong>; standard deviations≈0.0707 and0.1.<\/p>\n<p>For a uniform distribution on[−a,a], variance=a²/3. Thus Glorot uniform bound <strong>a=√(6/(fan_in+fan_out))<\/strong> and He fan-in uniform bound <strong>a=√(6/fan_in)<\/strong> under these common definitions. A uniform bound is neither variance nor standard deviation. Do not confuse factor2 in the variance with doubling its standard deviation.<\/p>\n<p><strong>Worked shape:<\/strong> 3×3 convolution on RGB has fan-in27; He variance2/27≈0.0741 and standard deviation≈0.2722. Number of output filters is not substituted as fan-in. Architecture/activation-specific gains and fan-out alternatives exist; the supplied formula takes priority in numerical questions.<\/p>\n<p>Training with smoothly decreasing loss is evidence of improved optimization, not proof of calibrated probabilities or good generalization. Learning rate, normalization, data scaling and clipping can also affect stability. References for the initialization conventions: <a href=\"https://proceedings.mlr.press/v=9/glorot10a\">Glorot–Bengio<\/a>, <a href=\"https://arxiv.org/abs/1502.01852\">He et al.<\/a>.<\/p>\n"}, {"number": 16, "title": "Week 8 — Pretraining and batch normalization", "scope": "Questions 11–20", "html": "<h1 id=\"learn-good-startin
