\/td>\n<td>(32+1)×5=165<\/td>\n<\/tr>\n<tr>\n<td>Total<\/td>\n<td>Five logits/probabilities after chosen output activation<\/td>\n<td>5253<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>If bias is explicitly disabled, subtract16+32+5=53, giving5200 weights. Pooling andGAP do not introduce learned parameters. The spatial output positions do not create fresh convolutional weights.<\/p>\n<h2 id=\"geometry-and-operations\">Geometry and operations<\/h2>\n<p>General output per axis <strong>floor((N+2P−D(K−1)−1)/S)+1<\/strong>. Effective kernelD(K−1)+1. Standard convolutionweightsK_hK_wCinCout; biascountCout. Denseweightsdin×dout; biascountdout.<\/p>\n<p>Approximate convolution multiply-accumulate count <strong>HoutWoutCoutK_hK_wCin<\/strong>, excluding bias/activation/normalization costs. Conv1 above uses32×32×16×27=<strong>442,368 MACs<\/strong>; Conv2 uses14×14×32×144=<strong>903,168 MACs<\/strong>. Parameter count and computation count differ because each weight is reused at many positions. A MAC may be counted as two floating-point operations in one convention; check the question's definition.<\/p>\n<h2 id=\"receptive-field-tracking\">Receptive-field tracking<\/h2>\n<p>Start receptive fieldr1 and input spacingj1. For a layer with effective kernelKeff andstrideS: <strong>rnew=rold+(Keff−1)jold<\/strong>, <strong>jnew=joldS<\/strong>. Conv1:r=3,j1. Pool:r=4,j2. Conv2:r=8,j2. Each final spatial unit sees an8×8 region of the original input under these assumptions. This calculation is separate from tensor output dimensions.<\/p>\n<h2 id=\"same-size-is-conditional\">Same size is conditional<\/h2>\n<p>Atstride1,dilation1,oddK3 requirespadding1 to preserveN;K5 requirespadding2. Stride2 usually downsamples even if an API calls its padding mode same. Do not applyNout=N blindly to every same-labeled layer. Rectangular/asymmetric padding requires the appropriate per-axis total padding.<\/p>\n<h2 id=\"flatten-versus-global-average\">Flatten versus global average<\/h2>\n<p>For8×8×128,flatten8192,GAP128. A10-output dense layer has81930 versus1290 parameters with biases. This saves80640 classifier parameters. GAP removes explicit spatial coordinates; dense/attention/localization tasks may need more position information than this summary retains.<\/p>\n<p><strong>Architecture cues:<\/strong> repeated small filters→VGG;parallel scales→Inception;additive skip→ResNet. Addition requires matching shapes;concatenation adds channels. A1×1 convolution can change channel depth despite keeping a1×1 spatial kernel. Filter count determines output depth;RGB determines input depth, not output depth.<\/p>\n"}, {"number": 26, "title": "Worked word-vector and evaluation sheet", "scope": "Week 9 and supporting concepts", "html": "<h1 id=\"count-contexts-before-compressing-them\">Count contexts before compressing them<\/h1>\n<p><strong>One-hot word:<\/strong> lengthV,one nonzero. <strong>Document bag:<\/strong> sum word one-hots/counts. <strong>Co-occurrence row:<\/strong> target's context-count profile. <strong>Embedding table:<\/strong> V×d,one d-dimensional vector per word. <strong>SVD word table in the case:<\/strong> U_k Sigma_k,shape6000×200. These representations are related but not interchangeable.<\/p>\n<h2 id=\"ticket-similarity\">Ticket similarity<\/h2>\n<p>A={recharge,failed,refund},B={recharge,plan,refund}. With unit counts:dotproduct2,norm√3 each,<strong>cosine2/3<\/strong>. Shared distinct terms2,union4 gives <strong>Jaccard2/4=0.5<\/strong>, a different metric. With count vectorsu(1,2,2),v(2,1,2),dot8,norms3→cosine8/9. Cosine is undefined when a norm iszero; an application must define handling.<\/p>\n<h2 id=\"tiny-selected-co-occurrence-matrix\">Tiny selected co-occurrence matrix<\/h2>\n<p>Keep original fragments: battery lasts long;screen looks bright;battery charges fast;bright screen response. Use immediate neighbors,selected vocabulary[battery,screen,bright,long,fast]. The selected/selected count matrix with symmetric left/right contexts is:<\/p>\n<table>\n<thead>\n<tr>\n<th>Target / context<\/th>\n<th>battery<\/th>\n<th>screen<\/th>\n<th>bright<\/th>\n<th>long<\/th>\n<th>fast<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>battery<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>screen<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>1<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>bright<\/td>\n<td>0<\/td>\n<td>1<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>long<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>fast<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>There are no newly adjacent pairs across lasts,looks,charges just because these words are not selected columns. Lasts itself has two original-token neighbors for the local counting question, even though it is not a selected target row in this5×5 matrix. Increasing the context radius or changing preprocessing would produce different counts.<\/p>\n<h2 id=\"svd-and-analogies\">SVD and analogies<\/h2>\n<p>For X≈U_k Sigma_k V_k^T,retainingk directions reduces each case word to k=200 coordinates. Reduced vectors can expose shared usage patterns; they do not guarantee perfect synonyms or grammar. A static vector can mix multiple meanings of one word.<\/p>\n<p>Analogy a<span class=\"emoji\" data-emoji=\"b\">🅱️<\/span>:c:d seeks <strong>v_d≈v_b−v_a+v_c<\/strong>. Exampleva(1,1),vb(2,3),vc(4,0)→query(5,2). Select a nearest candidate under the specified metric, not the query vector itself as a word label. For provided cosine scores0.18,0.74,0.41,0.62,choose candidateB.<\/p>\n<h2 id=\"keep-evaluation-quantities-separate\">Keep evaluation quantities separate<\/h2>\n<p><strong>Loss<\/strong> guides optimization; <strong>accuracy<\/strong> counts correct decisions; <strong>cosine<\/strong> compares vectors; <strong>correlation<\/strong> compares score patterns across pairs; <strong>rank<\/strong> describes matrix structure. A high human-score correlation is not a claim of exact score equality. A lower training loss is not an estimate from untouched test data.<\/p>\n<p>For binary classification, precision=TP/(TP+FP),recall=TP/(TP+FN),F1=2PR/(P+R),when denominators are meaningful. Accuracy can hide poor minority-class performance on imbalanced data. Choose thresholds/metrics using the cost of mistakes and validation, not by repeatedly tuning on the test set.<\/p>\n"}, {"number": 28, "title": "Mixed-question practice and final recall", "scope": "Entire supplied assignment set", "html": "<h1 id=\"derive-the-result-from-the-clue\">Derive the result from the clue<\/h1>\n<ol type=\"1\">\n<li><strong>At least4 active among5 unit-weight bits:<\/strong> threshold4;acceptedC(5,4)+C(5,5)=6. Exactly4 would have5 patterns and must reject11111.<\/li>\n<li><strong>Sigmoid output≥0.8:<\/strong> logit≥log(4)≈1.386. Using0.8 as the logit threshold is wrong.<\/li>\n<li><strong>L=½(wx−y)²,x=2,y=5,w=1:<\/strong> prediction2,residual−3,gradientw=−6. Atη0.1,wnew=1.6. Remove½ and the gradient doubles.<\/li>\n<li><strong>L=(w−4)²,η=0.75:<\/strong> error factor1−1.5=−0.5. Iterates cross the minimizer but converge, because absolute error halves.<\/li>\n<li><strong>N=101,B=20,keep remainder:<\/strong> 6 mini-batches/epoch,not5. Adam does not change this counting rule.<\/li>\n<li><strong>Covariance eigenvalues6,3,1:<\/strong> retain top2→dimension2,explained90%. If these were singular values and squared-energy retention was requested, use(36+9)/(36+9+1)=45/46 instead.<\/li>\n<li><strong>Denoising input(2,0),clean target(2,1),output(1,1):<\/strong> squared-sum loss1. Comparing to corrupted input incorrectly gives2.<\/li>\n<li><strong>L2α0.5,w=4,data gradient−1:<\/strong> penaltygradient4,total3. Atη0.1,neww3.7. Regularization can outweigh the data gradient and reverse its net direction.<\/li>\n<li><strong>Four models share perfectly correlated errors:<\/strong> averaging does not reduce that error variance. More models alone is insufficient.<\/li>\n<li><strong>Batch2,4,6:<\/strong> mean4,training-stylevariance(4+0+4)/3=8/3. Do not automatically useN−1.<\/li>\n<li><strong>Input28×28×1,conv5×5,8 filters,stride1,no padding:<\/strong> shape24×24×8;parameters(25+1)×8=208. More spatial output positions change compute,not208 trainable coefficients.<\/li>\n<li><strong>Residual branch changes32 channels to64:<\/strong> addition with the unmodified32-channel skip is invalid. Align shapes with a specified projection/design;concatenation would be a different operation.<\/li>\n<\/ol>\n<h2 id=\"recall-without-looking\">Recall without looking<\/h2>\n<p>State the perceptron signed-margin update;write OR/AND and explain XOR failure;distinguish score and activation;differentiate squared and half-squared loss;trace one backpropagation path and a split path;write momentum/AdaGrad/Adam conventions;find basis coefficients;derive PCA variance retention;read SVD shapes;separate noisy input/clean target/output;calculate L2 and dropout counts;explain validation-based stopping;compute BN statistics;distinguish one-hot/count/dense vectors;calculate CNN output shapes and parameters;compare VGG/Inception/ResNet.<\/p>\n<h2 id=\"read-the-exact-wording\">Read the exact wording<\/h2>\n<p><strong>NOT / false / least:<\/strong> choose the requested polarity. <strong>Exactly / at least / two additional:<\/strong> translate the counting rule before calculating. <strong>Input to sigmoid / sigmoid output:<\/strong> pre-activation versus activation. <strong>Variance / standard deviation:<\/strong> square root matters. <strong>Sum / mean / half:<\/strong> gradient prefactors matter. <strong>One filter / whole layer:<\/strong> output-filter multiplier matters. <strong>Attribution / cause:<\/strong> sensitivity alone is not proof.<\/p>\n<p><strong>Fast revision order:<\/strong> answer explanations for numerical questions→formula sheets→perceptron/backprop/optimizer calculations→PCA/SVD and autoencoder distinctions→generalization/BN/init→NLP/CNN shapes and architecture cues. Attempt each calculation from memory before checking. For a wrong answer, identify the missing operation or assumption rather than memorizing its option letter alone.<\/p>\n"}]}</script><script>(()=>{
 'use strict';
 const data=JSON.parse(document.getElementById('course-data').textContent);
 const totalWeeks=data.weeks.length;
 const KEY='dl-study-test-v1';
 const $=s=>document.querySelector(s);
 const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const freshWeek=()=>({answers:{},revealed:false,reviewed:false,notesRead:false});
 function normalize(raw){
  const out={version:1,week:1,view:'notes',weeks:{}};
  if(raw&&Number.isInteger(raw.week)&&raw.week>=1&&raw.week<=totalWeeks)out.week=raw.week;
  if(raw&&['notes','assignment','reference'].includes(raw.view))out.view=raw.view;
  for(const definition of data.weeks){
   const w=definition.number;
   const source=raw?.weeks?.[w];const item=freshWeek();
   item.revealed=source?.revealed===true;item.notesRead=source?.notesRead===true;
   item.reviewed=source?.reviewed===true||item.revealed;
   for(const {n,options} of definition.questions)if(Object.hasOwn(options,source?.answers?.[n]))item.answers[n]=source.answers[n];
   out.weeks[w]=item;
  }
  return out;
 }
 let state;
 try{state=normalize(JSON.parse(localStorage.getItem(KEY)));}catch{state=normalize(null);}
 let filter='all';
 const current=()=>state.weeks[state.week];
 const course=()=>data.weeks[state.week-1];
 const assessment=(w=course())=>w.assessmentLabel||'Assignment';
 function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));$('#save-status').textContent='Progress saved in this browser';$('#save-status').classList.remove('save-error');}
  catch{$('#save-status').textContent='Browser saving is unavailable — keep this tab open';$('#save-status').classList.add('save-error');}
 }
 function scores(w=state.week){
  const attempt=state.weeks[w];const questions=data.weeks[w-1].questions;
  const answered=questions.filter(q=>attempt.answers[q.n]).length;
  const correct=questions.filter(q=>attempt.answers[q.n]===q.answer).length;
  return {answered,correct,incorrect:answered-correct,unanswered:questions.length-answered,total:questions.length,percent:Math.round(correct/questions.length*100)};
 }
 function sidebar(){
  $('#weeks').innerHTML=data.weeks.map(w=>{
   const s=scores(w.number),a=state.weeks[w.number];
   const status=a.revealed?`${s.correct}/${s.total} correct · reviewed`:
      s.answered?`${s.answered}/${s.total} answered${a.reviewed?' · reviewed':''}`:a.notesRead?'Notes read · ready to attempt':'Start with the notes';
   return `<button class="week-btn" data-week="${w.number}" aria-current="${state.week===w.number}"><span class="week-number">${String(w.number).padStart(2,'0')}</span><span><span class="week-title">${escape(w.title)}</span><span class="week-status">${escape(status)}</span></span></button>`;
  }).join('');
  const reviewed=Object.values(state.weeks).filter(w=>w.reviewed).length;
  $('#course-progress').textContent=`${reviewed} of ${totalWeeks} weeks reviewed`;
 }
 function head(){
  const w=course(),reference=state.view==='reference';
  const active=state.view==='notes'?1:current().revealed?3:2;
  return `<div class="main-head"><div><span class="eyebrow">${reference?'Keep within reach':`Week ${String(w.number).padStart(2,'0')} / ${totalWeeks}`}</span><h1>${reference?'Formula sheets & final recall':escape(w.title)}</h1><p class="subtle">${reference?'Reusable methods for calculations and unfamiliar questions.':`Read the notes. Attempt all ${w.questions.length} questions. Then review your reasoning.`}</p>${!reference&&w.source?`<p class="subtle assessment-source">${escape(w.source)}</p>`:''}</div>${reference?`<button class="quiet small" data-action="notes">Week ${w.number} notes</button>`:''}</div>
   ${reference?'':`<div class="stage" aria-label="Study stages"><span class="${active===1?'active':''}"><b>01</b> Read</span><span class="${active===2?'active':''}"><b>02</b> Attempt</span><span class="${active===3?'active':''}"><b>03</b> Review</span></div><div class="tabs" aria-label="Week views"><button data-action="notes" aria-pressed="${state.view==='notes'}">Study notes</button><button data-action="assignment" aria-pressed="${state.view==='assignment'}">${escape(assessment(w))} · ${w.questions.length} questions</button></div>`}`;
 }
 function notes(){
  const w=course(),a=current();
  return `<div class="reading-intro"><strong>Read first, then test yourself.</strong>Study these ${w.notes.length} sections, then switch to the ${assessment(w).toLowerCase()}. Your grade and explanations stay hidden until you reveal them.</div>
   ${w.notes.map(n=>`<article class="study-note"><div class="note-meta">${escape(n.title)} · ${escape(n.scope)}</div><div class="prose">${n.html}</div></article>`).join('')}
   <div class="study-actions"><button class="quiet" data-action="notes-read" aria-pressed="${a.notesRead}">${a.notesRead?'Notes marked as read':'Mark notes as read'}</button><button class="primary" data-action="assignment">${scores().answered?'Continue':'Start'} Week ${w.number} ${assessment(w).toLowerCase()}</button></div>`;
 }
 function reference(){
  return `<nav class="reference-nav" aria-label="Reference topics">${data.reference.map(p=>`<a href="#reference-${p.number}">${escape(p.title.replace(/^Formula sheet — /,''))}</a>`).join('')}</nav>${data.reference.map(p=>`<article class="reference-note" id="reference-${p.number}"><div class="note-meta">${escape(p.title)} · ${escape(p.scope)}</div><div class="prose">${p.html}</div></article>`).join('')}`;
 }
 function status(q){const chosen=current().answers[q.n];return !chosen?'blank':chosen===q.answer?'correct':'wrong';}
 function question(q){
  const chosen=current().answers[q.n],review=current().revealed,kind=status(q);
  const badge=review?`<span class="status-pill ${kind}">${kind==='blank'?'Unanswered':kind==='wrong'?'Incorrect':'Correct'}</span>`:'';
  return `<article class="question" id="question-${q.n}" data-question="${q.n}"><div class="question-top"><span class="question-index">Question ${String(q.n).padStart(2,'0')}</span>${badge}</div><p class="question-stem">${escape(q.stem)}</p>
   <fieldset><legend class="sr-only">Question ${q.n}: ${escape(q.stem)}</legend>${Object.entries(q.options).map(([letter,text])=>{
    let cls='option'+(chosen===letter?' selected':'');let annotation='';
    if(review&&q.answer===letter){cls+=' option-correct';annotation=chosen===letter?'Your answer · correct':'Correct answer';}
    else if(review&&chosen===letter){cls+=' option-wrong';annotation='Your answer · incorrect';}
    return `<label class="${cls}"><input type="radio" name="week-${state.week}-q-${q.n}" value="${letter}" data-q="${q.n}" ${chosen===letter?'checked':''} ${review?'disabled':''}><span class="option-content"><b class="option-letter">${letter}.</b>${escape(text)}${annotation?`<span class="option-annotation">${annotation}</span>`:''}</span></label>`;
   }).join('')}</fieldset>
   ${review?`<div class="explanations"><h3>Why ${q.answer} is correct</h3>${q.explanation.right}<h3>Why the other options are wrong</h3>${q.explanation.wrong}<div class="memory-cue"><h3>Remember / solving cue</h3>${q.explanation.cue}</div></div>`:`<div class="question-tools"><button class="link-button" data-clear="${q.n}" ${chosen?'':'hidden'}>Clear response</button></div>`}</article>`;
 }
 function match(q){
  const kind=status(q);
  return filter==='all'||filter==='missed'&&kind!=='correct'||filter==='correct'&&kind==='correct'||filter==='unanswered'&&kind==='blank';
 }
 function result(){
  const s=scores();
  return `<section class="result-summary" aria-label="${escape(assessment())} results"><div class="result-top"><div><div class="result-score">${s.correct}<span> / ${s.total}</span></div><div class="result-caption">${s.percent}% · Week ${state.week} ${assessment().toLowerCase()}</div></div><div class="result-metrics"><div><b>${s.correct}</b><span>Correct</span></div><div><b>${s.incorrect}</b><span>Incorrect</span></div><div><b>${s.unanswered}</b><span>Unanswered</span></div></div></div><p>One point per correct answer; unanswered questions earn zero. Read the explanation even when you chose correctly, then try the week again from memory.</p></section>`;
 }
 function map(){
  return course().questions.map(q=>{
   const a=current(),has=!!a.answers[q.n];
   const cls=a.revealed?`map-${status(q)}`:has?'answered':'';
   const label=a.revealed?status(q)==='blank'?'unanswered':status(q)==='correct'?'correct':'incorrect':has?'answered':'unanswered';
   return `<button class="${cls}" data-jump="${q.n}" aria-label="Go to question ${q.n}, ${label}">${q.n}</button>`;
  }).join('');
 }
 function assignment(){
  const w=course(),a=current(),s=scores();
  const filters=a.revealed?[['all','All questions'],['missed','Missed & unanswered'],['correct','Correct'],['unanswered','Unanswered']]:[['all','All questions'],['unanswered','Unanswered']];
  const groupHtml=w.cases.map(c=>{
   const qs=w.questions.filter(q=>Math.ceil(q.n/5)===c.number&&match(q));
   if(!qs.length)return '';
   return `<section class="case-section"><div class="case-header"><span class="case-kicker">Case study ${c.number} · Questions ${(c.number-1)*5+1}–${c.number*5}</span><h2>${escape(c.title)}</h2><div class="case-data">${c.html}</div></div>${qs.map(question).join('')}</section>`;
  }).join('');
  return `<div class="test-toolbar"><div class="test-progress"><strong id="answered-count">${s.answered} of ${s.total} answered</strong><small>${a.revealed?'Review mode · answers are locked':'Attempt mode · correct answers and grades hidden'}</small><div class="bar"><span id="answer-bar" style="width:${s.answered/s.total*100}%"></span></div></div><div class="toolbar-actions"><button class="${a.revealed?'quiet':'primary'}" data-action="toggle-results">${a.revealed?'Hide grades & explanations':'Show grades & explanations'}</button>${a.revealed?'<button class="quiet" data-action="retake">Clear answers & retake</button>':''}</div></div>
   ${a.revealed?result():`<p class="test-intro">Choose one option per question. You can change or clear answers before revealing your grade. Any unanswered questions will count as zero.</p>`}
   <nav class="question-map" aria-label="Jump to a question">${map()}</nav>
   <div class="filters" aria-label="Question filters"><span>Show</span>${filters.map(([value,label])=>`<button data-filter="${value}" aria-pressed="${filter===value}">${label}</button>`).join('')}</div>
   ${groupHtml||'<p class="empty">No questions match this filter.</p>'}
   <div class="test-bottom"><p>${a.revealed?'Use the missed-question filter to focus your review.':'No instant marking. Reveal results when you are ready.'}</p><button class="primary" data-action="${a.revealed&&state.week<totalWeeks?'next-week':'toggle-results'}">${a.revealed?state.week<totalWeeks?`Study Week ${state.week+1}`:'Hide grades & explanations':'Show grades & explanations'}</button></div>`;
 }
 function render(scroll=false){
  sidebar();$('#app').innerHTML=head()+(state.view==='reference'?reference():state.view==='notes'?notes():assignment());
  document.title=`${state.view==='reference'?'Formula sheets':`Week ${state.week} · ${course().title}`} — DL Study & Test`;
  if(scroll)window.scrollTo({top:0,behavior:'instant'});
 }
 function updateAnswers(n){
  current().reviewed=false;
  save();sidebar();
  if(filter==='unanswered'){render();return;}
  const s=scores();$('#answered-count').textContent=`${s.answered} of ${s.total} answered`;
  $('#answer-bar').style.width=`${s.answered/s.total*100}%`;
  $('.question-map').innerHTML=map();
  const card=$(`[data-question="${n}"]`);
  if(card){
   card.querySelectorAll('.option').forEach(label=>label.classList.toggle('selected',label.querySelector('input').checked));
   card.querySelector('[data-clear]').hidden=!current().answers[n];
  }
 }
 $('#app').addEventListener('change',event=>{
  const input=event.target.closest('input[data-q]');if(!input||current().revealed)return;
  current().answers[Number(input.dataset.q)]=input.value;updateAnswers(Number(input.dataset.q));
 });
 document.addEventListener('click',event=>{
  const b=event.target.closest('button');if(!b)return;
  if(b.dataset.week){state.week=Number(b.dataset.week);state.view='notes';filter='all';save();render(true);return;}
  if(b.dataset.clear){
   if(current().revealed)return;const n=Number(b.dataset.clear);delete current().answers[n];
   $(`[data-question="${n}"]`).querySelectorAll('input').forEach(input=>input.checked=false);updateAnswers(n);return;
  }
  if(b.dataset.jump){
   const n=Number(b.dataset.jump);if(!$(`[data-question="${n}"]`)){filter='all';render();}
   const target=$(`[data-question="${n}"]`);target.scrollIntoView({behavior:'smooth',block:'start'});
   const focusable=target.querySelector('input:not(:disabled)');if(focusable)focusable.focus({preventScroll:true});return;
  }
  if(b.dataset.filter){filter=b.dataset.filter;const top=window.scrollY;render();window.scrollTo(0,top);return;}
  if(b.id==='reference-shortcut'){state.view='reference';save();render(true);return;}
  switch(b.dataset.action){
   case'notes':state.view='notes';filter='all';save();render(true);break;
   case'assignment':state.view='assignment';filter='all';save();render(true);break;
   case'notes-read':{
    current().notesRead=!current().notesRead;save();sidebar();
    b.setAttribute('aria-pressed',String(current().notesRead));b.textContent=current().notesRead?'Notes marked as read':'Mark notes as read';break;
   }
   case'toggle-results':current().revealed=!current().revealed;if(current().revealed)current().reviewed=true;filter='all';save();render(true);break;
   case'retake':current().answers={};current().revealed=false;current().reviewed=false;filter='all';save();render(true);break;
   case'next-week':if(state.week<totalWeeks){state.week++;state.view='notes';filter='all';save();render(true);}break;
  }
 });
 render();
 // Browser tests wait on this flag; no test responses are stored in the document.
 window.__READY__=true;
})();
</script></body></html>
