<script type="application/json" id="course-data">{"weeks": [{"number": 1, "title": "Perceptrons & logic", "notes": [{"number": 1, "title": "Week 1 — Threshold units and logic", "scope": "Questions 1–15", "html": "<h1 id=\"a-neuron-starts-with-a-weighted-sum\">A neuron starts with a weighted sum<\/h1>\n<p>A numerical feature is one input coordinate. A <strong>weight<\/strong> changes that feature's influence; a <strong>bias<\/strong> shifts the overall score. A hard threshold neuron computes <strong>z=wᵀx+b<\/strong>, then <strong>ŷ=1 if z≥0<\/strong>, otherwise0. Equivalently, compare wᵀx with thresholdθ, where <strong>b=−θ<\/strong>. The equality convention matters at the boundary.<\/p>\n<p>A <strong>McCulloch–Pitts-style unit<\/strong> uses a specified threshold rule on binary inputs; training is not required. A <strong>perceptron<\/strong> is a linear threshold model with a learning rule for its parameters. Do not confuse a fixed computation with an algorithm that learns that computation.<\/p>\n<h2 id=\"at-least-exactly-and-all\">At least, exactly and all<\/h2>\n<p>For n binary inputs with unit positive weights, <strong>sum(x)=number of active conditions<\/strong>. At least k→sum≥k. All n→sum≥n. Any one→sum≥1. Exactly k requires both a lower and upper count restriction; a single positive-weight threshold usually cannot reject counts above k.<\/p>\n<p>Four-input fan example: θ3 accepts sums3 and4. Positive patterns=<strong>C(4,3)+C(4,4)=4+1=5<\/strong> of16. With θ2, accepted count=6+4+1=11. Lowering the threshold expands the positive region if weights/comparison remain fixed.<\/p>\n<table>\n<thead>\n<tr>\n<th>Function<\/th>\n<th>00<\/th>\n<th>01<\/th>\n<th>10<\/th>\n<th>11<\/th>\n<th>Unit weights and bias for output1 if score≥0<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>AND<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>1<\/td>\n<td>w=(1,1), b=−1.5<\/td>\n<\/tr>\n<tr>\n<td>OR<\/td>\n<td>0<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>w=(1,1), b=−0.5<\/td>\n<\/tr>\n<tr>\n<td>NAND<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>0<\/td>\n<td>w=(−1,−1), b=1.5<\/td>\n<\/tr>\n<tr>\n<td>NOR<\/td>\n<td>1<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>w=(−1,−1), b=0.5<\/td>\n<\/tr>\n<tr>\n<td>XOR<\/td>\n<td>0<\/td>\n<td>1<\/td>\n<td>1<\/td>\n<td>0<\/td>\n<td>Not one linear separator in these two inputs<\/td>\n<\/tr>\n<tr>\n<td>XNOR<\/td>\n<td>1<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<td>1<\/td>\n<td>Not one linear separator in these two inputs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"geometry\">Geometry<\/h2>\n<p><strong>Decision boundary:<\/strong> wᵀx+b=0. In two dimensions it is a line; in higher dimensions a hyperplane. The vector w is normal/perpendicular to that boundary. Bias shifts the line; changing weight ratios changes orientation. Multiplying all weights and bias by the same positive factor preserves the classification; multiplying by a negative factor reverses the positive side except for tie details.<\/p>\n<p><strong>Linearly separable<\/strong> means one hyperplane can place all positives on the required side and negatives on the other. OR separates00 from01,10,11 using x₁+x₂=0.5. XOR positives occupy opposite corners, and negative examples occupy the other diagonal. Their convex hulls meet, so no straight separator can separate both pairs.<\/p>\n<p><strong>Nonlinear construction for XOR:<\/strong> compute OR and NAND in a hidden layer, then AND their outputs. Thus a multilayer network with nonlinear threshold units can represent a rule a single perceptron cannot. Another approach expands features, for example adding an interaction term x₁x₂ before a suitable separator.<\/p>\n<p><strong>Question traps:<\/strong> exactly one→XOR, not OR; correct numeric output with a false reason is still a false option; score and label are different; a binary input does not imply linear separability; hidden layers need nonlinear operations to improve on a single affine boundary.<\/p>\n"}, {"number": 2, "title": "Week 1 — Perceptron learning", "scope": "Questions 16–20", "html": "<h1 id=\"learn-a-separating-hyperplane\">Learn a separating hyperplane<\/h1>\n<p>For labels y∈{−1,+1}, define score <strong>s=wᵀx+b<\/strong> and signed margin <strong>m=y s<\/strong>. Positive signed margin means the predicted sign agrees with the true label. A negative example should have a negative raw score, not a positive one. The sign of raw score and the sign of signed margin answer different questions.<\/p>\n<p>The assignment uses <strong>update if y(wᵀx)≤0<\/strong>, with no bias and learning rate1: <strong>w←w+yx<\/strong>. More generally <strong>w←w+ηyx<\/strong>, <strong>b←b+ηy<\/strong> when the bias is learned. If the condition is not met, leave parameters unchanged. In a0/1-label convention, another form is w←w+η(y−ŷ)x; follow the question's convention rather than mixing formulas.<\/p>\n<h2 id=\"complete-pass-through-the-parcel-data\">Complete pass through the parcel data<\/h2>\n<p>Start w=(0,0). P₁ has x=(2,1),y=+1. Score0 and margin0 trigger an update: <strong>w=(2,1)<\/strong>. P₂=(1,2),y=+1 now has score2×1+1×2=4 and margin4&gt;0, so no update. P₃=(−1,−1),y=−1 has score−3 and margin3&gt;0, so no update. End-of-pass w remains(2,1).<\/p>\n<p>Another valid separator is <strong>w=(1,1)<\/strong>: scores3,3,−2 match all three labels. Separating weights need not be unique, and perceptron training does not automatically return a maximum-margin separator.<\/p>\n<table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>s&gt;0<\/td>\n<td>Predict positive under a sign-based rule<\/td>\n<\/tr>\n<tr>\n<td>s&lt;0<\/td>\n<td>Predict negative<\/td>\n<\/tr>\n<tr>\n<td>y s&gt;0<\/td>\n<td>Correct sign with positive margin<\/td>\n<\/tr>\n<tr>\n<td>y s&lt;0<\/td>\n<td>Wrong sign<\/td>\n<\/tr>\n<tr>\n<td>y s=0<\/td>\n<td>Boundary case; assignment explicitly updates<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"why-the-update-makes-sense\">Why the update makes sense<\/h2>\n<p>For a misclassified positive x, addingηx increases the score on that same example byη||x||². For a misclassified negative x, subtractingηx decreases its score by that amount. The update pushes the current example toward its correct side, though it may affect other examples and require further passes.<\/p>\n<p><strong>Convergence theorem:<\/strong> for a finite linearly separable dataset, repeated perceptron updates with a suitable positive fixed step converge after finitely many mistakes. Starting from zero weights, a common bound is <strong>mistakes≤(R/γ)²<\/strong>, where ||x||≤R and a unit-norm separator has positive margin at leastγ, under the theorem's assumptions. Larger separation margin permits a better bound. With bias, augment x by a constant coordinate when applying this framework.<\/p>\n<p>Nonseparable or noisy labels can prevent convergence. More epochs do not make XOR representable by one ordinary perceptron. A zero learning rate prevents learning. Feature scaling changes update magnitudes and can change the training path, even when a separator still exists.<\/p>\n<p><strong>Reusable procedure:<\/strong> write label convention; calculate score; multiply by true label; check the stated inequality; update only when required; use the updated w for the next sequential training example. In contrast, a single gradient step on a neural network normally computes all parameter gradients at the same old parameter vector.<\/p>\n<p><strong>Memory:<\/strong> a perceptron repairs mistakes; it does not remember previous examples as a recurrent state during ordinary prediction.<\/p>\n"}], "cases": [{"number": 1, "title": "Smart Classroom Ventilation Control", "html": "<p>Four binary inputs indicate high CO₂ (x₁), high occupancy (x₂), high temperature (x₃), and acceptable outside air (x₄). The unit outputs <strong>y=1 if x₁+x₂+x₃+x₄≥θ<\/strong>, otherwise 0. The desired rule is <strong>at least three of the four indicators active<\/strong>. Inputs are evaluated independently; no training or memory is used.<\/p>\n"}, {"number": 2, "title": "Scholarship Application Screening", "html": "<p>x₁ indicates academic score above cutoff; x₂ indicates verified financial need. Flag an application if <strong>at least one condition is true<\/strong>, including when both are true. The perceptron uses <strong>ŷ=1 if w₁x₁+w₂x₂+b≥0<\/strong>, otherwise 0. Questions 8–9 use <strong>w₁=w₂=1, b=−0.5<\/strong>.<\/p>\n"}, {"number": 3, "title": "Equipment Handover Record Review", "html": "<p>x₁ indicates battery returned; x₂ indicates sensor returned. Flag <strong>exactly one returned item<\/strong>. Desired outputs: <strong>00→0, 01→1, 10→1, 11→0<\/strong>. The proposed implementation is a single perceptron.<\/p>\n"}, {"number": 4, "title": "Parcel Routing Decision Review", "html": "<p>Labels are <strong>+1 express<\/strong>, <strong>−1 standard<\/strong>. No bias. Start <strong>w=(0,0)<\/strong> and update <strong>w←w+yx whenever y(wᵀx)≤0<\/strong>. Process in order: <strong>P₁: x=(2,1), y=+1; P₂: x=(1,2), y=+1; P₃: x=(−1,−1), y=−1<\/strong>. The update corresponds to learning rate 1.<\/p>\n"}], "questions": [{"n": 1, "stem": "Which threshold value implements the desired fan-control rule?", "options": {"A": "θ = 1", "B": "θ = 2", "C": "θ = 3", "D": "θ = 4"}, "answer": "C", "explanation": {"right": "<p>The score is the number of active indicators because every binary input has weight1. At least three means output1 for sums3 or4 and output0 for0,1,2. Therefore θ=3 implements exactly the requested rule.<\/p>\n", "wrong": "<p>A, θ=1, accepts any one active input. B, θ=2, also accepts two-active patterns. D, θ=4, requires all four and incorrectly rejects every three-active pattern.<\/p>\n", "cue": "<p>For an unweighted at-least-k rule, use threshold k with the ≥ comparison. Check the comparison sign before choosing a boundary value.<\/p>\n"}}, {"n": 2, "stem": "For input (1, 0, 1, 1), what output does the controller produce?", "options": {"A": "y = 0, because only one condition is absent", "B": "y = 1, because three indicators are active", "C": "y = 0, because all four indicators must be active", "D": "y = 1, because the first indicator is active"}, "answer": "B", "explanation": {"right": "<p>Substitute the input: 1+0+1+1=3. Since the desired threshold is3 and equality is accepted, y=1. The decision uses the combined count, not one specially privileged indicator.<\/p>\n", "wrong": "<p>A gives the wrong output despite one missing input being allowed. C replaces at least three with all four. D happens to state the correct output but gives a false reason: x₁=1 alone is insufficient.<\/p>\n", "cue": "<p>An option can have the right number and still be wrong because its explanation is false. Evaluate the entire statement.<\/p>\n"}}, {"n": 3, "stem": "How many binary input patterns switch on the fan?", "options": {"A": "5", "B": "4", "C": "6", "D": "8"}, "answer": "A", "explanation": {"right": "<p>Exactly three active positions can be selected in C(4,3)=4 ways. All four active gives C(4,4)=1 additional pattern. Total=4+1=5 out of 2⁴=16 possible inputs.<\/p>\n", "wrong": "<p>B counts exactly three but forgets1111. C,6, equals C(4,2), the count for exactly two. D,8, is not the count for this threshold; a threshold need not divide the input patterns evenly.<\/p>\n", "cue": "<p>At least k among n bits → sum C(n,j) for j=k through n. Exactly k → just C(n,k).<\/p>\n"}}, {"n": 4, "stem": "If the threshold is accidentally changed to θ = 2, what happens?", "options": {"A": "The fan switches on less often than intended.", "B": "The fan switches on when two or more indicators are active.", "C": "The fan switches on only when all inputs are 1, making activation too strict.", "D": "The fan never switches on."}, "answer": "B", "explanation": {"right": "<p>With θ=2, the rule becomes sum≥2, accepting sums2,3,4. It includes all intended positive patterns plus the six patterns with exactly two1s. Activation count rises from5 to C(4,2)+C(4,3)+C(4,4)=11.<\/p>\n", "wrong": "<p>A reverses the effect of lowering a threshold. C describes θ=4. D would require an unreachable threshold above4, not2.<\/p>\n", "cue": "<p>Lower threshold expands the positive region when weights and the ≥ rule stay fixed. Higher threshold shrinks it.<\/p>\n"}}, {"n": 5, "stem": "Which property makes this controller a threshold-logic system?", "options": {"A": "It predicts future classroom occupancy states.", "B": "It updates weights after every incorrect output during a training process.", "C": "It requires a hidden layer to make a decision.", "D": "It compares a summed input value with a fixed threshold."}, "answer": "D", "explanation": {"right": "<p>A threshold unit sums its inputs and compares the result with a fixed cutoff. The mapping is fully specified before evaluating an input; learning is not necessary for it to count as threshold logic.<\/p>\n", "wrong": "<p>A describes forecasting, absent here. B describes a learning procedure such as perceptron training rather than the defining threshold computation. C is false because one threshold unit needs no hidden layer.<\/p>\n", "cue": "<p>Separate architecture/decision rule from training: a unit can compute a threshold without ever learning weights.<\/p>\n"}}, {"n": 6, "stem": "Which logical behavior is described by the desired screening rule?", "options": {"A": "AND", "B": "XOR", "C": "OR", "D": "XNOR"}, "answer": "C", "explanation": {"right": "<p>At least one condition true means outputs00→0,01→1,10→1,11→1. This is inclusive OR; the both-true case is accepted.<\/p>\n", "wrong": "<p>A, AND, accepts only11. B, XOR, accepts01 and10 but rejects11. D, XNOR, accepts equal inputs00 and11, including the unwanted00.<\/p>\n", "cue": "<p>OR means one or both; XOR means exactly one. The word exactly changes the truth table.<\/p>\n"}}, {"n": 7, "stem": "Which parameter setting correctly implements this rule?", "options": {"A": "w1 = 1, w2 = 1, b = −1.5", "B": "w1 = 1, w2 = 1, b = −0.5", "C": "w1 = −1, w2 = −1, b = 0.5", "D": "w1 = 1, w2 = −1, b = 0"}, "answer": "B", "explanation": {"right": "<p>For weights1,1 and bias−0.5, scores for00,01,10,11 are−0.5,0.5,0.5,1.5. Thresholding at0 gives OR exactly.<\/p>\n", "wrong": "<p>A has scores−1.5,−0.5,−0.5,0.5, so it implements AND. C gives0.5,−0.5,−0.5,−1.5, accepting only00: NOR. D uses x₁−x₂≥0, accepting00 and rejecting01, so it is not OR.<\/p>\n", "cue": "<p>For unit positive weights, bias between−1 and0 with suitable tie handling can implement OR. A half-integer avoids ambiguous binary-input ties.<\/p>\n"}}, {"n": 8, "stem": "For w1 = 1, w2 = 1, b = −0.5, what is the score for input (0, 1)?", "options": {"A": "0.5", "B": "−0.5", "C": "0", "D": "1.5"}, "answer": "A", "explanation": {"right": "<p>The requested quantity is the pre-activation score: 1×0+1×1−0.5=0.5. It is nonnegative, so the hard output is1, but the score itself remains0.5.<\/p>\n", "wrong": "<p>B,−0.5, is the00 score. C,0, is not the computed score. D,1.5, is the11 score. Do not substitute the thresholded class label when the question asks for a score.<\/p>\n", "cue": "<p>Compute weighted sum plus bias first; threshold only if the output label is requested.<\/p>\n"}}, {"n": 9, "stem": "What is the decision boundary for the parameter setting w1 = 1, w2 = 1, b = −0.5?", "options": {"A": "x1 − x2 − 0.5 = 0", "B": "x1 + x2 + 0.5 = 0", "C": "2x1 + x2 = 0", "D": "x1 + x2 − 0.5 = 0"}, "answer": "D", "explanation": {"right": "<p>A perceptron's decision boundary is where its score equals0. Here w₁x₁+w₂x₂+b=x₁+x₂−0.5, so the boundary is x₁+x₂−0.5=0.<\/p>\n", "wrong": "<p>A incorrectly changes w₂ to−1. B reverses the bias sign. C changes the coefficients and omits the bias. A boundary includes parameters exactly as specified, even if another line could separate the same finite training points.<\/p>\n", "cue": "<p>Boundary=score0; positive half-space=score≥0. Bias shifts the boundary without changing the normal vector's direction.<\/p>\n"}}, {"n": 10, "stem": "Why can a single perceptron represent this screening rule?", "options": {"A": "The positive and negative cases are linearly separable.", "B": "The rule requires remembering earlier applications before deciding the next output.", "C": "The rule has no decision boundary.", "D": "The output changes randomly for the same input."}, "answer": "A", "explanation": {"right": "<p>OR is linearly separable: x₁+x₂=0.5 leaves00 on the negative side and01,10,11 on the positive side. One perceptron creates exactly such a linear separator.<\/p>\n", "wrong": "<p>B adds a memory requirement absent from independent application screening. C denies the explicit score-zero boundary. D makes the deterministic mapping random without justification.<\/p>\n", "cue": "<p>One perceptron represents one half-space. Ask whether a straight separator can separate the labeled points.<\/p>\n"}}, {"n": 11, "stem": "Which logical behavior does the handover rule represent?", "options": {"A": "AND", "B": "OR", "C": "XOR", "D": "NAND"}, "answer": "C", "explanation": {"right": "<p>The rule accepts01 and10, where inputs differ, and rejects00 and11, where they agree. That is XOR.<\/p>\n", "wrong": "<p>A, AND, accepts11 only. B, OR, also accepts11, violating exactly one. D, NAND, accepts00 as well as01 and10, so it also violates the rule.<\/p>\n", "cue": "<p>XOR = different; XNOR = same. Write all four cases when wording is easy to confuse.<\/p>\n"}}, {"n": 12, "stem": "What output is assigned to the input pattern (1, 1)?", "options": {"A": "y = 1, because one item has been returned", "B": "y = 0, because exactly one item has not been returned", "C": "y = 1, because both checks are complete", "D": "y = 0, because both values are the same"}, "answer": "D", "explanation": {"right": "<p>For11 both items have been returned, so the inputs are equal and exactly-one-returned is false. Therefore y=0 for the reason given in D.<\/p>\n", "wrong": "<p>A ignores the second returned item and chooses output1. B chooses output0 but falsely claims exactly one item has not been returned; actually none is missing. C confuses completion of both checks with the requested flag.<\/p>\n", "cue": "<p>Correct label plus incorrect explanation is still a wrong option. XOR rejects both00 and11.<\/p>\n"}}, {"n": 13, "stem": "Which geometric property prevents a single perceptron from representing this rule?", "options": {"A": "The positive cases lie on opposite corners of the input square.", "B": "The inputs are binary rather than real valued, so the rule cannot use a separator.", "C": "The output has only two possible labels.", "D": "The rule uses two input variables."}, "answer": "A", "explanation": {"right": "<p>The XOR positives01 and10 occupy opposite corners, while negatives00 and11 occupy the other diagonal. Their convex hulls intersect at the square's center, so no single straight line separates the classes.<\/p>\n", "wrong": "<p>B is false: binary inputs can be linearly separable, as AND/OR show. C is false: binary labels are exactly what a perceptron handles. D is false: two inputs do not prevent a separator.<\/p>\n", "cue": "<p>Diagonal positives with the other diagonal negative → XOR geometry. Nonlinearity or an expanded feature space is needed.<\/p>\n"}}, {"n": 14, "stem": "Which modified lab rule would be linearly separable?", "options": {"A": "Flag exactly one returned item.", "B": "Flag when the two item statuses are different.", "C": "Flag only when both items have been returned.", "D": "Flag when neither or both items have been returned."}, "answer": "C", "explanation": {"right": "<p>Flagging only when both items returned is AND, implemented by x₁+x₂−1.5≥0. Only11 has a nonnegative score, so one line suffices.<\/p>\n", "wrong": "<p>A and B are two phrasings of XOR, which is not separable. D is XNOR, the complement of XOR, also not separable with one ordinary perceptron over these inputs.<\/p>\n", "cue": "<p>AND/OR/NAND/NOR are separable; XOR/XNOR are the classic two-bit exceptions.<\/p>\n"}}, {"n": 15, "stem": "What does linear separability mean in this setting?", "options": {"A": "Every input must have label 1 before a straight boundary can be checked.", "B": "A line can separate the 1-labeled and 0-labeled inputs.", "C": "The perceptron must avoid using weights.", "D": "The input values must be stored in a sequence."}, "answer": "B", "explanation": {"right": "<p>Linear separability means there exists a line in this two-feature setting putting the positive and negative examples on different sides, with the chosen decision/tie convention respected. In higher dimensions this becomes a hyperplane.<\/p>\n", "wrong": "<p>A unnecessarily requires all labels positive and misses the two-class separation. C removes the weighted score needed to define the line. D refers to sequence storage, unrelated to geometry.<\/p>\n", "cue": "<p>Two features→line; three→plane; many→hyperplane. Separable concerns labeled geometry, not binary versus real-valued inputs.<\/p>\n"}}, {"n": 16, "stem": "What is the weight vector after processing P1 once?", "options": {"A": "w = (2, 1)", "B": "w = (1, 2)", "C": "w = (−1, −1)", "D": "w = (0, 0)"}, "answer": "A", "explanation": {"right": "<p>At initialization wᵀx=0, so y(wᵀx)=0 satisfies the update condition≤0. For P₁, y=1 and x=(2,1): wnew=(0,0)+1(2,1)=(2,1).<\/p>\n", "wrong": "<p>B swaps P₁ coordinates with P₂. C uses P₃'s coordinates rather than the current positive example. D wrongly skips a zero-margin update despite the explicit≤0 rule.<\/p>\n", "cue": "<p>Follow the stated tie rule. Zero margin triggers an update here even if another prediction convention would label score0 as positive.<\/p>\n"}}, {"n": 17, "stem": "After the update from P1 , what is w⊤ x for P2 ?", "options": {"A": "2", "B": "3", "C": "4", "D": "5"}, "answer": "C", "explanation": {"right": "<p>Using the result w=(2,1), evaluate P₂=(1,2): wᵀx=2×1+1×2=4. Since its label is+1, signed margin is also4, so no update is needed.<\/p>\n", "wrong": "<p>A,2, and B,3, omit contributions or confuse the inputs. D,5, is P₁'s score under this w, not P₂'s.<\/p>\n", "cue": "<p>Dot product multiplies matching coordinates then adds; do not multiply the coordinates within each vector together.<\/p>\n"}}, {"n": 18, "stem": "With w = (2, 1), is P3 correctly classified?", "options": {"A": "No, because the raw score w⊤ x is greater than zero.", "B": "No, because y(w⊤ x) < 0.", "C": "Yes, because w⊤ x = 0.", "D": "Yes, because y(w⊤ x) > 0."}, "answer": "D", "explanation": {"right": "<p>For P₃=(−1,−1), raw score=2(−1)+1(−1)=−3. Its true label is−1, so signed margin=y×score=(−1)(−3)=3&gt;0. A negative raw score is correct for a negative example.<\/p>\n", "wrong": "<p>A falsely says the raw score is positive. B falsely says signed margin&lt;0. C falsely says raw score0. D uses the correct signed-margin test.<\/p>\n", "cue": "<p>Raw sign predicts the class; label×score checks correctness. Both positive and negative classes need positive signed margin.<\/p>\n"}}, {"n": 19, "stem": "Which condition is needed for the perceptron convergence guarantee?", "options": {"A": "Every feature must be binary.", "B": "The data must be linearly separable.", "C": "The learning rate must be zero throughout all training updates.", "D": "All labels must be positive."}, "answer": "B", "explanation": {"right": "<p>The classic perceptron convergence guarantee requires a linearly separable finite dataset, with an appropriate fixed positive update scale and repeated processing. If data are not separable, the algorithm may keep making updates indefinitely.<\/p>\n", "wrong": "<p>A unnecessarily restricts features to bits. C prevents any learning because zero learning rate never changes weights. D excludes the intended two-class setting; all-positive labels are not required.<\/p>\n", "cue": "<p>Perceptron converges if a separator exists; the theorem does not make XOR linearly separable.<\/p>\n"}}, {"n": 20, "stem": "Which vector separates the three listed parcels?", "options": {"A": "w = (−1, 1)", "B": "w = (1, −1)", "C": "w = (−1, −1)", "D": "w = (1, 1)"}, "answer": "D", "explanation": {"right": "<p>For w=(1,1), P₁ score3, P₂ score3, P₃ score−2. These match labels+1,+1,−1, with positive signed margins3,3,2.<\/p>\n", "wrong": "<p>A gives P₁−1 and P₃0, failing separation. B gives P₂−1 and P₃0. C gives P₁/P₂−3 and P₃+2, reversing all required signs.<\/p>\n", "cue": "<p>Check every training point. A vector that classifies one example correctly is not automatically a separator for the dataset.<\/p>\n"}}]}, {"number": 2, "title": "Sigmoid & losses", "notes": [{"number": 3, "title": "Week 2 — Sigmoid networks and output choices", "scope": "Questions 1–5, 11–15", "html": "<h1 id=\"score-activation-and-decision-are-separate\">Score, activation and decision are separate<\/h1>\n<p>An affine neuron computes <strong>z=wᵀx+b<\/strong>. Its activation is <strong>a=φ(z)<\/strong>. A final decision may threshold a. Example: z=0.4 gives sigmoid≈0.599 and class1 at threshold0.5. These are three different answers; return the one requested.<\/p>\n<p><strong>Sigmoid σ(z)=1/(1+e^(−z)).<\/strong> It is increasing, differentiable and bounded0&lt;σ&lt;1 for finite z. σ(0)=0.5, σ(−z)=1−σ(z), derivative <strong>σ'(z)=σ(z)(1−σ(z))<\/strong>. The maximum derivative is¼ at z=0, and it becomes small for large positive or negative inputs.<\/p>\n<table>\n<thead>\n<tr>\n<th>z<\/th>\n<th>Approximate sigmoid<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>−4<\/td>\n<td>0.018<\/td>\n<\/tr>\n<tr>\n<td>−2<\/td>\n<td>0.119<\/td>\n<\/tr>\n<tr>\n<td>0<\/td>\n<td>0.500<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>0.731<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>0.881<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>0.982<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>For probability thresholdt∈(0,1), <strong>σ(z)≥t ⇔ z≥log(t/(1−t))<\/strong>. At t=0.5 this reduces to z≥0, saving exponentials in MCQs. Increasing the probability threshold shrinks the positive set. Making bias more negative also lowers every score and can reduce the number selected.<\/p>\n<h2 id=\"priority-scoring-example\">Priority-scoring example<\/h2>\n<p>z=3x₁+2x₂−2. For(0.4,0.6), z=0.4→selected. The question's four candidate inputs have z=0.6,0.2,0.3,−0.9; only the last fails. Boundary3x₁+2x₂−2=0 is linear despite the sigmoid being nonlinear: a single sigmoid of an affine score with a fixed threshold is still a linear classifier in its input space.<\/p>\n<h2 id=\"hidden-nonlinearities\">Hidden nonlinearities<\/h2>\n<p>The case network computes <strong>h₁=σ(x₁+x₂−1)<\/strong>, <strong>h₂=σ(2x₁−x₂)<\/strong>, then <strong>ŷ=σ(3h₁+2h₂−2)<\/strong>. For input(1,1), h₁'s pre-activation1 gives h₁≈0.731, not1. For input(1,0), h₂'s pre-activation2 gives h₂≈0.881. Compute both hidden values before output.<\/p>\n<p>Without hidden nonlinearities, <strong>W₂(W₁x+b₁)+b₂=(W₂W₁)x+(W₂b₁+b₂)<\/strong>, still one affine map. Nonlinear activation between layers enables genuinely nonlinear representations. Adding depth without adding nonlinearity does not automatically solve XOR.<\/p>\n<h2 id=\"choose-an-output-for-the-task\">Choose an output for the task<\/h2>\n<p><strong>Unrestricted regression:<\/strong> usually linear output, allowing any real value. <strong>Binary classification:<\/strong> one sigmoid and binary cross-entropy are common. <strong>Mutually exclusive K-class classification:<\/strong> K logits with softmax and multiclass cross-entropy. <strong>Multilabel classification:<\/strong> K independent sigmoids, because several classes may be true simultaneously.<\/p>\n<p><strong>Softmax pᵢ=e^(zᵢ)/Σe^(zⱼ)<\/strong> gives positive probabilities summing1. Subtracting max(z) before exponentiating improves numerical stability without changing probabilities. Independent sigmoids do not generally sum1. Bounded outputs are not automatically well calibrated; training and evaluation determine whether predicted confidence agrees with observed frequencies.<\/p>\n<p><strong>Memory:<\/strong> hidden activation controls representation/trainability; output activation matches target constraints.<\/p>\n"}, {"number": 4, "title": "Week 2 — Losses, derivatives and descent", "scope": "Questions 6–10, 16–20", "html": "<h1 id=\"one-prediction-several-possible-loss-conventions\">One prediction, several possible loss conventions<\/h1>\n<p>Residual e=ŷ−y. <strong>Squared loss e²<\/strong> has derivative2e with respect to prediction. <strong>Half-squared loss½e²<\/strong> has derivative e. <strong>MSE=(1/N)Σeᵢ²<\/strong> has derivative2eᵢ/N with respect to each prediction. A mean across features as well as examples introduces another normalization. Constants do not change an unregularized minimizer, but they do change gradient magnitudes and effective step sizes.<\/p>\n<h2 id=\"delivery-errors\">Delivery errors<\/h2>\n<p>Targets12,20,15,18; predictions10,24,13,21. Residuals−2,4,−2,3; squares4,16,4,9. <strong>SSE33, MSE8.25, RMSE√8.25≈2.872<\/strong> in target units. <strong>MAE=(2+4+2+3)/4=2.75<\/strong>. SSE/MSE have squared units, whereas RMSE/MAE have original units. Signed errors should not cancel before squaring or taking absolute values.<\/p>\n<p>Order2 contributes16, the largest square. For its raw squared loss, derivative2(24−20)=8. The second model11,21,14,19 has squares1,1,1,1 and MSE1, so it fits this validation set better. One comparison does not prove universal superiority.<\/p>\n<h2 id=\"chain-rule-for-a-parameter\">Chain rule for a parameter<\/h2>\n<p>If ŷ=wx, then <strong>dL/dw=(dL/dŷ)x<\/strong>. For x=3,y=15 and L=(15−3w)², derivative <strong>−6(15−3w)=6(3w−15)<\/strong>. At w=4: ŷ12,loss9,gradient−18. Update withη0.1 gives <strong>wnew=5.8<\/strong>, not4.6. New loss5.76 is smaller despite crossing the optimum w=5.<\/p>\n<p>Descent uses <strong>wnew=wold−η∇L<\/strong>. Negative gradient means increase the parameter; positive gradient means decrease it. A gradient is a local sensitivity, not the loss, prediction or new weight. Too large a step can increase loss or diverge; a direction that is downhill infinitesimally is not a guarantee for an arbitrary finite step.<\/p>\n<h2 id=\"classification-losses-beyond-the-numerical-quiz\">Classification losses beyond the numerical quiz<\/h2>\n<p><strong>Binary cross-entropy:<\/strong> L=−[y logp+(1−y)log(1−p)]. Correct high confidence reduces loss; confident error is strongly penalized. With sigmoid p=σ(z), <strong>dL/dz=p−y<\/strong>, a particularly simple logit gradient. With mean reduction, divide the batch sum appropriately. Stable implementations operate on logits rather than computing log(0) from rounded probabilities.<\/p>\n<p><strong>Multiclass cross-entropy:<\/strong> L=−Σyᵢlogpᵢ; for one-hot targets, L=−log(probability of correct class). With softmax, logit gradient vector <strong>p−y<\/strong>. Do not confuse classification loss with accuracy: a model's confidence can improve loss without changing the predicted class, or change accuracy without a proportional loss change.<\/p>\n<p><strong>Squared loss versus absolute loss:<\/strong> square amplifies outlier residuals and is smooth; absolute loss is less sensitive to very large residuals and has a nondifferentiable point at zero. An optimizer can use subgradients where appropriate. Choose loss based on task/error cost, not because one numerical scale looks smaller than another.<\/p>\n<p><strong>Question-solving routine:<\/strong> identify target and prediction; copy exact loss prefactors; differentiate in the requested variable; include every chain factor; evaluate at old parameters; then apply the update.<\/p>\n"}], "cases": [{"number": 1, "title": "Clinic Follow-up Priority Scoring", "html": "<p>For normalized inputs x₁,x₂, the model computes <strong>z=3x₁+2x₂−2<\/strong> and <strong>p̂=σ(z)=1/(1+e^(−z))<\/strong>. Select a record for priority follow-up when <strong>p̂≥0.5<\/strong>. The sigmoid is increasing and σ(0)=0.5.<\/p>\n"}, {"number": 2, "title": "Delivery Time Prediction Review", "html": "<table>\n<thead>\n<tr>\n<th>Order<\/th>\n<th>Actual y<\/th>\n<th>Prediction ŷ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>12<\/td>\n<td>10<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>20<\/td>\n<td>24<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>15<\/td>\n<td>13<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>18<\/td>\n<td>21<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Use <strong>L=(y−ŷ)²<\/strong>, <strong>MSE=(1/n)Σ(yᵢ−ŷᵢ)²<\/strong>, and <strong>∂L/∂ŷ=2(ŷ−y)<\/strong>. The second model in Question 10 predicts <strong>11,21,14,19<\/strong> for these same four targets.<\/p>\n"}, {"number": 3, "title": "Machine Energy Use Prediction", "html": "<p>The model is <strong>h₁=σ(x₁+x₂−1)<\/strong>, <strong>h₂=σ(2x₁−x₂)<\/strong>, <strong>ŷ=σ(3h₁+2h₂−2)<\/strong>. The questions use the indicated input values. σ denotes the sigmoid function.<\/p>\n"}, {"number": 4, "title": "Warehouse Routing Time Analysis", "html": "<p>The model is <strong>ŷ=wx<\/strong>, with <strong>x=3,y=15<\/strong>. Use <strong>L(w)=(15−3w)²<\/strong>. Evaluate the specified quantities at <strong>w=4<\/strong> where requested. The gradient-descent example uses <strong>η=0.1<\/strong> and <strong>w←w−η(dL/dw)<\/strong>.<\/p>\n"}], "questions": [{"n": 1, "stem": "Why is the sigmoid function suitable for this priority score?", "options": {"A": "It maps a real-valued input to a value between 0 and 1.", "B": "It removes the need to compute any weighted input value.", "C": "It always gives a hard class label before thresholding.", "D": "It forces both input features to have identical weights."}, "answer": "A", "explanation": {"right": "<p>Sigmoid σ(z)=1/(1+e^(−z)) maps any finite real score to the open interval(0,1), giving a smooth probability-like output. A separate threshold produces the class decision; the bounded output alone does not prove calibration.<\/p>\n", "wrong": "<p>B is false because z still requires a weighted sum and bias. C confuses the smooth score with the hard thresholded label. D is false because different weights,3 and2 here, are allowed.<\/p>\n", "cue": "<p>Sigmoid squashes; threshold decides. At z=0 the sigmoid is0.5, not0.<\/p>\n"}}, {"n": 2, "stem": "For x1 = 0.4 and x2 = 0.6, what is the value of z?", "options": {"A": "0.2", "B": "0.6", "C": "0.4", "D": "0.8"}, "answer": "C", "explanation": {"right": "<p>Substitute before activating: z=3(0.4)+2(0.6)−2=1.2+1.2−2=0.4. Since it is positive, p̂&gt;0.5; its approximate sigmoid is0.599 if needed.<\/p>\n", "wrong": "<p>A,0.2, B,0.6, and D,0.8, are not the weighted sum. In particular0.6 is an input value and also near the sigmoid output, but the question requests z.<\/p>\n", "cue": "<p>Keep z, σ(z) and the thresholded class distinct in every forward-pass calculation.<\/p>\n"}}, {"n": 3, "stem": "The rule p̂ ≥ 0.5 is equivalent to which condition?", "options": {"A": "z < 0", "B": "z ≥ 0", "C": "z > 1", "D": "z ≤ −1"}, "answer": "B", "explanation": {"right": "<p>Sigmoid is increasing and σ(0)=0.5. Therefore σ(z)≥0.5 exactly when z≥0. Equality is accepted on both sides.<\/p>\n", "wrong": "<p>A reverses the condition. C,z&gt;1, is sufficient but excludes valid scores0 through1. D,z≤−1, corresponds to sigmoid below about0.269, not priority.<\/p>\n", "cue": "<p>Probability threshold0.5 corresponds to logit threshold0. General threshold t corresponds to z≥log(t/(1−t)).<\/p>\n"}}, {"n": 4, "stem": "Which input is not sent for priority follow-up?", "options": {"A": "x1 = 0.8, x2 = 0.1", "B": "x1 = 0.2, x2 = 0.8", "C": "x1 = 0.5, x2 = 0.4", "D": "x1 = 0.1, x2 = 0.4"}, "answer": "D", "explanation": {"right": "<p>Compute D's score:3(0.1)+2(0.4)−2=−0.9. Thus its sigmoid is below0.5 and it is not selected.<\/p>\n", "wrong": "<p>A gives z=0.6; B gives0.2; C gives0.3. All three are nonnegative and therefore selected. This is a negative-polarity question: find the one that fails the cutoff.<\/p>\n", "cue": "<p>Use the z≥0 equivalence to avoid evaluating exponentials for every option.<\/p>\n"}}, {"n": 5, "stem": "If the clinic wants fewer records to satisfy p̂ ≥ 0.5, what should happen to the bias term −2?", "options": {"A": "It should become more negative.", "B": "It should be removed from the model entirely.", "C": "It should be made equal to x1 + x2 .", "D": "It should be increased to make every score larger."}, "answer": "A", "explanation": {"right": "<p>Making the bias more negative lowers every z while holding features and weights fixed. The set satisfying z≥0 becomes smaller or stays the same, so fewer records can pass.<\/p>\n", "wrong": "<p>B removes−2, increasing scores by2 and tending to accept more. C replaces a constant bias with an input-dependent term and does not provide the intended fixed-boundary adjustment. D explicitly increases scores and works in the opposite direction.<\/p>\n", "cue": "<p>Bias shifts scores uniformly. More negative bias raises the evidence required to be positive.<\/p>\n"}}, {"n": 6, "stem": "What is the squared error for Order 2?", "options": {"A": "4", "B": "16", "C": "9", "D": "25"}, "answer": "B", "explanation": {"right": "<p>Order2 has target20 and prediction24. Residual y−ŷ=−4; squared error=(−4)²=16. Squaring removes sign but magnifies larger discrepancies.<\/p>\n", "wrong": "<p>A,4, is the absolute error, not its square. C,9, is Order4's squared error. D,25, would require an error magnitude5.<\/p>\n", "cue": "<p>Residual, absolute error and squared error are different quantities: −4,4,16 here.<\/p>\n"}}, {"n": 7, "stem": "What is the mean squared error over the four orders?", "options": {"A": "7.25", "B": "8.00", "C": "9.50", "D": "8.25"}, "answer": "D", "explanation": {"right": "<p>The four squared errors are(12−10)²=4,(20−24)²=16,(15−13)²=4,(18−21)²=9. Sum33; MSE=33/4=8.25.<\/p>\n", "wrong": "<p>A,7.25, B,8.00, and C,9.50, do not equal the mean of these four squares. Do not average residuals first and square the result; cancellation would underestimate error.<\/p>\n", "cue": "<p>Square each error, sum, then divide by the number of examples.<\/p>\n"}}, {"n": 8, "stem": "Which order contributes the largest squared error?", "options": {"A": "Order 1", "B": "Order 3", "C": "Order 2", "D": "Order 4"}, "answer": "C", "explanation": {"right": "<p>Squared errors by order are4,16,4,9, so Order2 contributes the most:16. Its error magnitude4 exceeds the others'2,2,3.<\/p>\n", "wrong": "<p>A names Order1 with error4. B names Order3 with error4. D names Order4 with error9. C is the option label corresponding to Order2; option letters and order numbers are different.<\/p>\n", "cue": "<p>Compare absolute residuals if you only need the largest squared error; squaring preserves ordering of nonnegative magnitudes.<\/p>\n"}}, {"n": 9, "stem": "If y = 20 and ŷ = 24, what is ∂L/∂ŷ?", "options": {"A": "8", "B": "−8", "C": "4", "D": "−4"}, "answer": "A", "explanation": {"right": "<p>For L=(y−ŷ)², derivative with respect to prediction is2(ŷ−y). At ŷ24,y=20:2×4=8. The derivative is positive because raising an already excessive prediction increases loss.<\/p>\n", "wrong": "<p>B,−8, differentiates with the wrong sign for ŷ. C,4, omits factor2. D,−4, both omits2 and reverses sign. A half-squared loss would give4, but that is not the stated loss.<\/p>\n", "cue": "<p>Read both the differentiation variable and the loss prefactor. The target is held constant here.<\/p>\n"}}, {"n": 10, "stem": "A second model predicts 11, 21, 14, 19. Which model has lower MSE?", "options": {"A": "The original model, because its MSE is 8.25.", "B": "The second model, because its MSE is 1.00.", "C": "Both models, because their errors are identical.", "D": "Neither model, because MSE cannot be computed here."}, "answer": "B", "explanation": {"right": "<p>Second-model residuals are1,−1,1,−1, each with squared value1. MSE=4/4=1, below the first model's8.25, so the second is better on this measured set.<\/p>\n", "wrong": "<p>A states the original MSE correctly but chooses the larger loss. C falsely says errors match. D ignores the provided predictions/targets, which are sufficient to compute MSE.<\/p>\n", "cue": "<p>For a loss, lower is better. A single validation comparison does not prove superiority on every future dataset.<\/p>\n"}}, {"n": 11, "stem": "Which quantities are computed first in the feedforward direction?", "options": {"A": "The final loss value", "B": "The parameter update", "C": "The hidden units h1 and h2", "D": "The target label chosen by the model"}, "answer": "C", "explanation": {"right": "<p>A forward pass evaluates dependencies from inputs toward output: compute hidden pre-activations and h₁,h₂, then the output score/activation and finally any loss.<\/p>\n", "wrong": "<p>A is downstream of the prediction. B is a later training step using gradients. D is false because labels are supplied data; the model does not choose the correct target.<\/p>\n", "cue": "<p>Forward: inputs→hidden→prediction→loss. Backward: loss gradients→earlier parameters. Update comes after both.<\/p>\n"}}, {"n": 12, "stem": "For x1 = 1 and x2 = 1, what is the input to the sigmoid in h1 ?", "options": {"A": "1", "B": "0", "C": "2", "D": "3"}, "answer": "A", "explanation": {"right": "<p>The input to h₁'s sigmoid is x₁+x₂−1=1+1−1=1. The hidden activation itself would be σ(1)≈0.731, but that is not requested.<\/p>\n", "wrong": "<p>B,0, forgets one positive input. C,2, omits the bias−1. D,3, is inconsistent with both inputs1 and bias−1.<\/p>\n", "cue": "<p>Input to activation means pre-activation. Do not apply σ unless the hidden output is requested.<\/p>\n"}}, {"n": 13, "stem": "For x1 = 1 and x2 = 0, what is the input to the sigmoid in h2 ?", "options": {"A": "−2", "B": "−1", "C": "1", "D": "2"}, "answer": "D", "explanation": {"right": "<p>For h₂=σ(2x₁−x₂) and input(1,0), pre-activation=2×1−0=2. Its sigmoid would be about0.881.<\/p>\n", "wrong": "<p>A,−2, reverses the sign of the leading contribution. B,−1, and C,1, do not follow the coefficients2 and−1. D correctly returns the pre-activation, not an already squashed output.<\/p>\n", "cue": "<p>Write the exact neuron's formula; h₁ and h₂ use different weights and biases.<\/p>\n"}}, {"n": 14, "stem": "Why can sigmoid hidden units introduce nonlinearity?", "options": {"A": "They copy inputs without changing any value.", "B": "They apply a nonlinear function to weighted input combinations.", "C": "They remove all weights from the network.", "D": "They force the output to be exactly linear for all possible inputs."}, "answer": "B", "explanation": {"right": "<p>Sigmoid is nonlinear, so composing affine maps with sigmoid hidden activations can produce nonlinear functions and nonlinear decision boundaries. Without nonlinear hidden operations, a stack of affine layers collapses into one affine map.<\/p>\n", "wrong": "<p>A is an identity mapping, not sigmoid. C is false because weights remain. D claims the opposite effect and would undermine the purpose of nonlinear hidden units.<\/p>\n", "cue": "<p>Depth alone is not enough for nonlinear expressiveness: the activation between affine layers matters.<\/p>\n"}}, {"n": 15, "stem": "What is the final output range of ŷ?", "options": {"A": "Any real number from −∞ to ∞", "B": "Only the two values −1 and 1", "C": "A value between 0 and 1", "D": "A value greater than 1 for all inputs"}, "answer": "C", "explanation": {"right": "<p>The final operation is sigmoid, which yields0&lt;ŷ&lt;1 for finite pre-activation, regardless of whether the hidden weighted sum is negative or positive.<\/p>\n", "wrong": "<p>A describes an unrestricted linear output. B describes a two-valued sign output. D contradicts sigmoid's upper bound. C's between0 and1 should be understood as the open interval mathematically, even if floating-point software can numerically saturate.<\/p>\n", "cue": "<p>The final activation determines output range; hidden-layer ranges alone do not determine the final task output.<\/p>\n"}}, {"n": 16, "stem": "What is L(w) when w = 4?", "options": {"A": "6", "B": "4", "C": "12", "D": "9"}, "answer": "D", "explanation": {"right": "<p>At w=4, prediction=3×4=12. Loss=(15−12)²=3²=9. This is prediction error squared, not prediction or derivative.<\/p>\n", "wrong": "<p>A,6, and B,4, are not the computed square. C,12, is the prediction, not the loss. A loss value cannot be inferred simply from the weight's magnitude.<\/p>\n", "cue": "<p>Model first, error second, loss third. Keep each intermediate value on a separate line.<\/p>\n"}}, {"n": 17, "stem": "Which value of w gives zero loss?", "options": {"A": "w = 4", "B": "w = 5", "C": "w = 6", "D": "w = 3"}, "answer": "B", "explanation": {"right": "<p>Zero squared loss requires prediction exactly equal to target:3w=15, so w=5. This is the global minimum because a square is nonnegative.<\/p>\n", "wrong": "<p>A,w=4, gives loss9. C,w=6, also gives9. D,w=3, gives(15−9)²=36.<\/p>\n", "cue": "<p>For a simple squared residual, set the residual to zero if the model can fit it.<\/p>\n"}}, {"n": 18, "stem": "What is dL/dw at w = 4?", "options": {"A": "−18", "B": "−6", "C": "18.0", "D": "6"}, "answer": "A", "explanation": {"right": "<p>Differentiate the complete composition: dL/dw=2(15−3w)(−3)=−6(15−3w). At w=4 this is−6×3=−18.<\/p>\n", "wrong": "<p>B,−6, retains the inner derivative/factor but omits the residual3. C,+18, reverses sign. D,+6, has both magnitude and sign wrong. The input x=3 is a chain-rule multiplier.<\/p>\n", "cue": "<p>Derivative of square=2×inside; then multiply by derivative of inside. Do not drop the feature/input factor.<\/p>\n"}}, {"n": 19, "stem": "If gradient descent uses w ← w − η(dL/dw) with η = 0.1, what is the next value from w = 4?", "options": {"A": "3.2", "B": "4.6", "C": "5.8", "D": "2.2"}, "answer": "C", "explanation": {"right": "<p>Use the old gradient−18: wnew=4−0.1(−18)=4+1.8=5.8. It overshoots the minimizer5, but its new loss is(15−17.4)²=5.76, lower than9.<\/p>\n", "wrong": "<p>A,3.2, and D,2.2, move the wrong way; B,4.6, uses an update0.6 rather than1.8. A negative gradient means a descent step increases w.<\/p>\n", "cue": "<p>Subtracting a negative adds. A descent update can cross the minimum; small enough step size determines whether loss still decreases.<\/p>\n"}}, {"n": 20, "stem": "What does the gradient indicate in this example?", "options": {"A": "It gives the class label directly without a model.", "B": "It removes the input feature from the prediction.", "C": "It makes the squared error impossible to compute.", "D": "It shows how the loss changes as w changes."}, "answer": "D", "explanation": {"right": "<p>The derivative measures the local rate of change of loss per small change in w. Its sign identifies the local increasing direction; descent moves oppositely, and magnitude helps scale the step.<\/p>\n", "wrong": "<p>A confuses a derivative with a class label. B removes a feature without basis. C denies a perfectly well-defined loss. D correctly describes sensitivity of loss to the parameter.<\/p>\n", "cue": "<p>Gradient points uphill locally; negative gradient points downhill locally. It is not itself the new parameter.<\/p>\n"}}]}, {"number": 3, "title": "Backpropagation", "notes": [{"number": 5, "title": "Week 3 — Forward graphs and chain rule", "scope": "Questions 1–10", "html": "<h1 id=\"forward-stores-values-backward-propagates-sensitivities\">Forward stores values; backward propagates sensitivities<\/h1>\n<p>A <strong>computational graph<\/strong> represents operations and dependencies. A forward pass computes values in an order where a node's inputs already exist. Backpropagation computes derivatives in reverse dependency order using saved forward values. A feedforward graph has no cyclic recurrence; its operations can still be affine or nonlinear.<\/p>\n<h2 id=\"affine-tutoring-example\">Affine tutoring example<\/h2>\n<p>x₁2,x₂1; z₁=2x₁+x₂=5; z₂=x₁−x₂+1=2; ŷ=z₁+2z₂=9. Expanding the expression gives <strong>ŷ=4x₁−x₂+2<\/strong>, confirming that these stacked affine computations are one affine map. Forward structure does not by itself guarantee nonlinear modeling power.<\/p>\n<h2 id=\"scalar-graph-example\">Scalar graph example<\/h2>\n<p><strong>u=2x; v=u+3; L=v²; x=1.<\/strong> Forward trace: x=1→u2→v=5→L25. Backward trace: <strong>dL/dv=2v=10<\/strong>, <strong>dv/du=1<\/strong>, <strong>du/dx=2<\/strong>, so <strong>dL/du10<\/strong>, <strong>dL/dx20<\/strong>. Independently expand L=(2x+3)²; derivative4(2x+3)=20 at x=1.<\/p>\n<table>\n<thead>\n<tr>\n<th>Operation<\/th>\n<th>Local derivative / backward rule<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>z=a+b<\/td>\n<td>Send upstream gradient to both inputs<\/td>\n<\/tr>\n<tr>\n<td>z=ab<\/td>\n<td>To a multiply by b; to b multiply by a<\/td>\n<\/tr>\n<tr>\n<td>z=a²<\/td>\n<td>Multiply upstream by2a<\/td>\n<\/tr>\n<tr>\n<td>z=c a, c constant<\/td>\n<td>Multiply upstream by c<\/td>\n<\/tr>\n<tr>\n<td>z=σ(a)<\/td>\n<td>Multiply by z(1−z)<\/td>\n<\/tr>\n<tr>\n<td>z=ReLU(a)<\/td>\n<td>Multiply by1 if a&gt;0,0 if a&lt;0<\/td>\n<\/tr>\n<tr>\n<td>z=Σaᵢ<\/td>\n<td>Distribute upstream gradient to every term<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>At ReLU's zero point use the specified subgradient/convention, often0 in software. The derivative of a hard threshold is zero almost everywhere and undefined at the jump, which is why ordinary gradient training uses suitable differentiable/piecewise-differentiable activations instead.<\/p>\n<h2 id=\"multiple-paths-require-addition\">Multiple paths require addition<\/h2>\n<p>If one variable influences loss through several paths, add the path contributions. Example <strong>L=x²+3x<\/strong>, so dL/dx=2x+3. For <strong>L=(x+x)²<\/strong>, either simplify to4x²→8x, or note that the inner sum has two contributions of1, not just one. A reused parameter receives the sum of gradients from every place it is used.<\/p>\n<p>The chain rule <strong>multiplies along one dependency path<\/strong>; the multivariable rule <strong>adds across paths<\/strong>. Confusing these operations is a common reason for missing factors in backpropagation and convolutional weight-sharing derivatives.<\/p>\n<h2 id=\"values-and-gradients-answer-different-questions\">Values and gradients answer different questions<\/h2>\n<p>At v=5, the node value is5, loss25, local derivative10 and input derivative20. All can appear as numerical distractors. A negative gradient is permitted even though a squared loss is nonnegative. A gradient's units are loss units per parameter unit; it need not lie in the activation's output range.<\/p>\n<p><strong>Reusable method:<\/strong> write the forward value at each node; start with dL/dL=1; work backward multiplying local slopes; sum branches; keep old parameters fixed through the entire backward pass. Compute updates only after the required gradients have been collected.<\/p>\n"}, {"number": 6, "title": "Week 3 — Backpropagation through parameters", "scope": "Questions 11–20", "html": "<h1 id=\"assign-the-output-error-to-each-weight\">Assign the output error to each weight<\/h1>\n<p>For <strong>z=W a+b<\/strong>, <strong>h=φ(z)<\/strong>, let δ=∂L/∂z. Then <strong>∂L/∂W=δaᵀ<\/strong>, <strong>∂L/∂b=δ<\/strong>, and gradient to the previous activation is <strong>Wᵀδ<\/strong>. If an activation intervenes, multiply the incoming activation-gradient elementwise by φ'(z). For a mean batch loss, average/sum according to the stated reduction.<\/p>\n<p><strong>Shape check:<\/strong> if a has d coordinates and the layer has m outputs, W is m×d, z/b/δ are m-vectors, δaᵀ is m×d and Wᵀδ is d-dimensional. A scalar formula that cannot extend to these shapes is often missing a transpose or an input factor.<\/p>\n<h2 id=\"one-hidden-unit-calibration\">One-hidden-unit calibration<\/h2>\n<p>x=2,y=5; h=w₁x+b, ŷ=w₂h; w₁1,b=0,w₂2; L=½(ŷ−y)². Forward: <strong>h=2,ŷ4,residual−1,L0.5<\/strong>. Backward:<\/p>\n<table>\n<thead>\n<tr>\n<th>Quantity<\/th>\n<th>Calculation<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>∂L/∂ŷ<\/td>\n<td>ŷ−y<\/td>\n<td>−1<\/td>\n<\/tr>\n<tr>\n<td>∂L/∂w₂<\/td>\n<td>(ŷ−y)h<\/td>\n<td>−2<\/td>\n<\/tr>\n<tr>\n<td>∂L/∂h<\/td>\n<td>(ŷ−y)w₂<\/td>\n<td>−2<\/td>\n<\/tr>\n<tr>\n<td>∂L/∂w₁<\/td>\n<td>(∂L/∂h)x<\/td>\n<td>−4<\/td>\n<\/tr>\n<tr>\n<td>∂L/∂b<\/td>\n<td>∂L/∂h<\/td>\n<td>−2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Earlier parameters receive downstream multipliers. The gradient at w₁ is not simply the output residual or the w₂ gradient. If h had a nonlinear activation, its derivative would be another factor on this path.<\/p>\n<h2 id=\"simultaneous-recommendation-update\">Simultaneous recommendation update<\/h2>\n<p>ŷ=w₁x₁+w₂x₂+b; x=(1,2),target6, initial parameters(1,1,0). Forward ŷ3,residual−3,half-squared loss4.5. Gradients <strong>(∂L/∂w₁,∂L/∂w₂,∂L/∂b)=(−3,−6,−3)<\/strong>. Withη0.1, new parameters <strong>(1.3,1.6,0.3)<\/strong>. New prediction1.3+3.2+0.3=4.8, residual−1.2 and new loss0.72.<\/p>\n<p>Do not change w₁ and recompute the residual before evaluating the same step's w₂/b gradients. That would be a different sequential/coordinate procedure. Perceptron training sequentially processes examples using updated weights; one neural-network gradient step normally updates parameters from one shared old forward/backward evaluation.<\/p>\n<h2 id=\"numerical-gradient-checking\">Numerical gradient checking<\/h2>\n<p>For a scalar parameterθ, compare the analytical gradient with <strong>[L(θ+ε)−L(θ−ε)]/(2ε)<\/strong> for a suitably smallε. Perturb one parameter while holding others fixed. Extremely tinyε can cause floating-point cancellation; nondifferentiable points such as ReLU0 need care. Gradient checking diagnoses implementations; it is not normally the efficient training method for a large network.<\/p>\n<p><strong>Missing-factor checklist:<\/strong> loss includes½ or1/N? input x included? downstream weight included? activation derivative included? multiple paths summed? gradients evaluated at old parameters? Bias gradient multiplies1, not an arbitrary input feature. A nonnegative loss does not imply a nonnegative gradient.<\/p>\n"}], "cases": [{"number": 1, "title": "Tutoring Session Readiness Score", "html": "<p>For <strong>x₁=2,x₂=1<\/strong>, compute <strong>z₁=2x₁+x₂<\/strong>, <strong>z₂=x₁−x₂+1<\/strong>, then <strong>ŷ=z₁+2z₂<\/strong>.<\/p>\n"}, {"number": 2, "title": "Inventory Forecast Calculation Review", "html": "<p>The computational graph is <strong>u=2x<\/strong>, <strong>v=u+3<\/strong>, <strong>L=v²<\/strong>, evaluated at <strong>x=1<\/strong>. Use this graph for forward values and derivatives.<\/p>\n"}, {"number": 3, "title": "Sensor Calibration Error Analysis", "html": "<p><strong>x=2,y=5; h=w₁x+b; ŷ=w₂h.<\/strong> Given parameters are <strong>w₁=1,b=0,w₂=2<\/strong>. The loss is <strong>L=½(ŷ−y)²<\/strong>.<\/p>\n"}, {"number": 4, "title": "Course Recommendation Score Update", "html": "<p><strong>ŷ=w₁x₁+w₂x₂+b<\/strong>, with <strong>x₁=1,x₂=2,y=6<\/strong>. Initially <strong>w₁=w₂=1,b=0<\/strong>. Use <strong>L=½(ŷ−y)²<\/strong>, learning rate <strong>η=0.1<\/strong>, and gradient descent <strong>w←w−η(∂L/∂w)<\/strong>.<\/p>\n"}], "questions": [{"n": 1, "stem": "What is the value of z1 for this session?", "options": {"A": "6", "B": "5", "C": "4", "D": "3"}, "answer": "B", "explanation": {"right": "<p>z₁=2x₁+x₂=2×2+1=5. This is an intermediate affine computation, before the final weighted combination.<\/p>\n", "wrong": "<p>A,6, may accidentally double both inputs. C,4, omits x₂. D,3, adds inputs without applying the coefficient2.<\/p>\n", "cue": "<p>Substitute into one node at a time; do not apply the output formula prematurely.<\/p>\n"}}, {"n": 2, "stem": "What is the value of z2 ?", "options": {"A": "0", "B": "1", "C": "3", "D": "2"}, "answer": "D", "explanation": {"right": "<p>z₂=x₁−x₂+1=2−1+1=2. Both the subtraction and bias+1 matter.<\/p>\n", "wrong": "<p>A,0, B,1, and C,3, do not match the full expression. B would omit the bias after computing2−1.<\/p>\n", "cue": "<p>A bias is a constant contribution, not a multiplicative feature weight.<\/p>\n"}}, {"n": 3, "stem": "What is the final value of ŷ?", "options": {"A": "9", "B": "7", "C": "8", "D": "6"}, "answer": "A", "explanation": {"right": "<p>Using z₁5 and z₂2, ŷ=z₁+2z₂=5+4=9. The output's coefficient2 applies to z₂.<\/p>\n", "wrong": "<p>B,7, sums the two hidden values without the output coefficient. C,8, and D,6, do not follow5+2×2.<\/p>\n", "cue": "<p>Cache forward intermediate values and substitute into the next layer's exact formula.<\/p>\n"}}, {"n": 4, "stem": "Which computation must be completed before ŷ is evaluated?", "options": {"A": "The loss must be minimized over all stored tutoring sessions.", "B": "The target value must be changed by the model before scoring.", "C": "The hidden quantities z1 and z2 must be computed.", "D": "The learning rate must be set to zero."}, "answer": "C", "explanation": {"right": "<p>The output directly depends on z₁,z₂, so their values must be available first. They in turn depend on the inputs, establishing an acyclic evaluation order.<\/p>\n", "wrong": "<p>A, minimizing loss over a dataset, is training, not a prerequisite for one forward evaluation. B incorrectly changes the target. D unnecessarily fixes the learning rate, which is irrelevant to this forward computation.<\/p>\n", "cue": "<p>A node waits for its parents, not for training to finish.<\/p>\n"}}, {"n": 5, "stem": "What makes this a feedforward computation?", "options": {"A": "The output is repeatedly fed back as a new input.", "B": "Information flows from inputs to hidden quantities to output.", "C": "The target label is used before the input features.", "D": "The network stores a separate state for each previous session."}, "answer": "B", "explanation": {"right": "<p>Information goes from the input variables to hidden quantities to output without a feedback cycle. That directional acyclic structure makes it feedforward.<\/p>\n", "wrong": "<p>A describes feedback/recurrence. C uses a target before its relevant computation and is not the given graph. D adds persistent per-session state that is absent.<\/p>\n", "cue": "<p>Feedforward describes graph direction. This particular affine toy graph is still feedforward even though it has no nonlinear activation.<\/p>\n"}}, {"n": 6, "stem": "What is the value of u?", "options": {"A": "2", "B": "1", "C": "3", "D": "4"}, "answer": "A", "explanation": {"right": "<p>The first node is u=2x. At x=1, u=2×1=2.<\/p>\n", "wrong": "<p>B returns x instead of u. C uses the next node's additive constant. D doubles the correct u unnecessarily.<\/p>\n", "cue": "<p>Forward pass follows the node formula, not the derivative alone or a later node's value.<\/p>\n"}}, {"n": 7, "stem": "What is the value of v?", "options": {"A": "3", "B": "4", "C": "6", "D": "5"}, "answer": "D", "explanation": {"right": "<p>After u2, the next node is v=u+3=2+3=5.<\/p>\n", "wrong": "<p>A returns only the constant3. B,4, and C,6, are not2+3. Do not substitute x directly for u in v's formula.<\/p>\n", "cue": "<p>Write x=1→u2→v=5→L25. The forward trace prevents backward-value confusion.<\/p>\n"}}, {"n": 8, "stem": "What is the loss L?", "options": {"A": "20", "B": "15", "C": "25", "D": "10"}, "answer": "C", "explanation": {"right": "<p>L=v² and v=5, so L=25. The loss is the square, not twice the intermediate value.<\/p>\n", "wrong": "<p>A,20, is the final derivative dL/dx in this example. B,15, is not a node value. D,10, is dL/dv rather than L.<\/p>\n", "cue": "<p>Forward values and backward derivatives can have different numbers even at the same node.<\/p>\n"}}, {"n": 9, "stem": "What is ∂L/∂v at v = 5?", "options": {"A": "5", "B": "10", "C": "25", "D": "2"}, "answer": "B", "explanation": {"right": "<p>For L=v², local derivative ∂L/∂v=2v. At v=5, it equals10.<\/p>\n", "wrong": "<p>A,5, is v. C,25, is L. D,2, is the coefficient in2v but omits the current v.<\/p>\n", "cue": "<p>Differentiate first, then evaluate at the current forward value.<\/p>\n"}}, {"n": 10, "stem": "What is ∂L/∂x?", "options": {"A": "10", "B": "5", "C": "40", "D": "20"}, "answer": "D", "explanation": {"right": "<p>Multiply the derivatives along the path: dL/dx=(dL/dv)(dv/du)(du/dx)=10×1×2=20. Equivalently L=(2x+3)² gives derivative4(2x+3), equal20 at x=1.<\/p>\n", "wrong": "<p>A,10, misses du/dx2. B,5, is v rather than a derivative. C,40, adds an extra factor2.<\/p>\n", "cue": "<p>Chain rule multiplies local derivatives along a path; if there are multiple paths, add their contributions.<\/p>\n"}}, {"n": 11, "stem": "What is the hidden value h?", "options": {"A": "1", "B": "4", "C": "2", "D": "5"}, "answer": "C", "explanation": {"right": "<p>h=w₁x+b=1×2+0=2. The output weight w₂ is not part of this hidden-node formula.<\/p>\n", "wrong": "<p>A,1, is w₁. B,4, is the later prediction. D,5, is the target.<\/p>\n", "cue": "<p>Do not mix hidden activation, output prediction and target: here2,4,5 respectively.<\/p>\n"}}, {"n": 12, "stem": "What is the prediction ŷ?", "options": {"A": "3", "B": "5", "C": "2", "D": "4"}, "answer": "D", "explanation": {"right": "<p>ŷ=w₂h=2×2=4. The target5 is used later to calculate the loss/error, not to define the forward prediction.<\/p>\n", "wrong": "<p>A,3, is not2×2. B,5, substitutes the target. C,2, stops at h without multiplying by w₂.<\/p>\n", "cue": "<p>A model predicts from inputs/parameters; the label enters when measuring error.<\/p>\n"}}, {"n": 13, "stem": "What is ∂L/∂ŷ?", "options": {"A": "−1", "B": "1", "C": "−2", "D": "2"}, "answer": "A", "explanation": {"right": "<p>The loss is half-squared error, so ∂L/∂ŷ=ŷ−y=4−5=−1. Factor½ cancels the derivative's factor2.<\/p>\n", "wrong": "<p>B,+1, reverses residual order. C,−2, would be the derivative without½. D,+2, has both sign and prefactor wrong.<\/p>\n", "cue": "<p>Before differentiating, circle whether the loss includes½,1/n or both.<\/p>\n"}}, {"n": 14, "stem": "What is ∂L/∂w₂?", "options": {"A": "−1", "B": "−2", "C": "2", "D": "1"}, "answer": "B", "explanation": {"right": "<p>Since ŷ=w₂h, ∂ŷ/∂w₂=h=2. Thus ∂L/∂w₂=(−1)×2=−2.<\/p>\n", "wrong": "<p>A,−1, omits h. C,+2, reverses sign. D,+1, omits h and reverses sign. Gradients use the original h from the forward pass.<\/p>\n", "cue": "<p>Weight gradient=upstream error×input to that weight. For w₂, the input is h, not raw x by definition.<\/p>\n"}}, {"n": 15, "stem": "What is ∂L/∂w₁?", "options": {"A": "−1", "B": "1", "C": "−4", "D": "4"}, "answer": "C", "explanation": {"right": "<p>The path is w₁→h→ŷ→L. Multiply: ∂L/∂w₁=(ŷ−y)×w₂×x=(−1)×2×2=−4.<\/p>\n", "wrong": "<p>A,−1, keeps only output error. B,+1, also reverses sign. D,+4, has correct magnitude but incorrect descent direction. Omitting w₂ would wrongly give−2.<\/p>\n", "cue": "<p>Earlier layers include downstream weights through the chain rule; the output error alone is not every parameter's gradient.<\/p>\n"}}, {"n": 16, "stem": "What is the initial prediction ŷ?", "options": {"A": "4", "B": "3", "C": "5", "D": "2"}, "answer": "B", "explanation": {"right": "<p>Initial prediction=1×1+1×2+0=3. Target6 has not yet been incorporated into any parameter update.<\/p>\n", "wrong": "<p>A4,C5,D2 are not the sum1+2+0. D would keep only the second feature's contribution.<\/p>\n", "cue": "<p>Compute one original forward pass before computing any of the simultaneous step's gradients.<\/p>\n"}}, {"n": 17, "stem": "What is ∂L/∂ŷ?", "options": {"A": "−3", "B": "3", "C": "−6", "D": "6"}, "answer": "A", "explanation": {"right": "<p>For L=½(ŷ−y)², output derivative=ŷ−y=3−6=−3.<\/p>\n", "wrong": "<p>B,+3, reverses sign. C,−6, forgets the½ prefactor. D,+6, makes both errors.<\/p>\n", "cue": "<p>The same residual can yield different derivatives under different loss normalizations; use the given formula.<\/p>\n"}}, {"n": 18, "stem": "What is ∂L/∂w₂?", "options": {"A": "3", "B": "−3", "C": "6", "D": "−6"}, "answer": "D", "explanation": {"right": "<p>The prediction derivative with respect to w₂ is x₂=2. Therefore ∂L/∂w₂=(−3)×2=−6.<\/p>\n", "wrong": "<p>A,+3, B,−3, and C,+6 fail either the feature multiplier, sign or both. B is the bias gradient rather than w₂'s gradient.<\/p>\n", "cue": "<p>Each weight multiplies its own feature; the bias gradient multiplies1.<\/p>\n"}}, {"n": 19, "stem": "What is the updated value of w1 ?", "options": {"A": "0.7", "B": "1.6", "C": "1.3", "D": "0.4"}, "answer": "C", "explanation": {"right": "<p>For w₁, gradient=(−3)×x₁=−3. Gradient descent gives w₁new=1−0.1(−3)=1.3. All gradients are evaluated at the old parameters.<\/p>\n", "wrong": "<p>A,0.7, uses ascent for this negative gradient. B,1.6, incorrectly applies w₂'s gradient−6. D,0.4, uses that wrong gradient with the wrong sign.<\/p>\n", "cue": "<p>Keep parameter-specific gradients aligned: w₁→−3,w₂→−6,b→−3.<\/p>\n"}}, {"n": 20, "stem": "What is the updated value of b?", "options": {"A": "0.3", "B": "−0.3", "C": "0.6", "D": "−0.6"}, "answer": "A", "explanation": {"right": "<p>Bias enters ŷ with derivative1, so ∂L/∂b=−3. With initial b=0 and η=0.1, bnew=0−0.1(−3)=0.3.<\/p>\n", "wrong": "<p>B,−0.3, uses the wrong sign. C,0.6, incorrectly multiplies the bias gradient by x₂2. D,−0.6, combines both mistakes.<\/p>\n", "cue": "<p>Bias is equivalent to a weight on a constant feature1. Simultaneous updates give(w₁,w₂,b)=(1.3,1.6,0.3).<\/p>\n"}}]}, {"number": 4, "title": "Optimization", "notes": [{"number": 7, "title": "Week 4 — Gradient descent and mini-batches", "scope": "Questions 1–10", "html": "<h1 id=\"choose-a-direction-step-size-and-data-subset\">Choose a direction, step size and data subset<\/h1>\n<p>Gradient descent minimizes differentiable loss by <strong>θnew=θold−η∇L(θold)<\/strong>, η&gt;0. It follows the negative gradient locally. A scalar example is L=(w−4)², gradient2(w−4). From w=1 atη0.1, gradient−6 and new w=1.6. New loss(1.6−4)²=5.76 versus initial9.<\/p>\n<h2 id=\"exact-stability-for-this-quadratic\">Exact stability for this quadratic<\/h2>\n<p>Let error eₜ=wₜ−4. Updating yields <strong>eₜ₊₁=(1−2η)eₜ<\/strong>. Error shrinks if <strong>abs(1−2η)&lt;1<\/strong>, so <strong>0&lt;η&lt;1<\/strong>. Atη0.5, the method reaches4 in one step. With0&lt;η&lt;0.5 it approaches without changing error sign; with0.5&lt;η&lt;1 it oscillates with shrinking amplitude. Atη1 it oscillates without shrinking; above1 it diverges. This bound belongs to this loss curvature, not every model.<\/p>\n<p>For a multidimensional positive quadratic, large curvature/eigenvalues require smaller steps. Deep-network objectives are generally nonconvex, so descent need not find a global optimum, and stationary points include saddles. A zero gradient alone does not prove a global minimum. Large stochastic gradients and numerical issues can also produce unstable loss.<\/p>\n<h2 id=\"dataset-sampling-versus-optimizer\">Dataset sampling versus optimizer<\/h2>\n<table>\n<thead>\n<tr>\n<th>Update granularity<\/th>\n<th>Examples per update<\/th>\n<th>For12 examples<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Full batch<\/td>\n<td>All N<\/td>\n<td>One update/epoch<\/td>\n<\/tr>\n<tr>\n<td>Strict SGD<\/td>\n<td>One<\/td>\n<td>Twelve updates/epoch<\/td>\n<\/tr>\n<tr>\n<td>Mini-batch<\/td>\n<td>B, usually1&lt;B&lt;N<\/td>\n<td>WithB3, four updates/epoch<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>An <strong>epoch<\/strong> is one pass through the training records. An <strong>iteration/step<\/strong> is one parameter update. With N=103,B=20, retain the last partial batch→ceiling(103/20)=6 updates/epoch. If explicitly dropping the last incomplete batch, there are5 and some examples are omitted in that pass. Do not assume divisibility or a drop policy silently.<\/p>\n<p>Mini-batches support hardware vectorization, lower memory demands than full-batch evaluation and less noisy gradients than single-example updates. Larger batches are not guaranteed better generalization; smaller batches are not automatically faster on real hardware. Shuffling affects the update sequence. Time-series tasks may require temporal constraints rather than indiscriminate random splitting.<\/p>\n<h2 id=\"average-gradients-correctly\">Average gradients correctly<\/h2>\n<p>Four equal-size batch mean-gradients2,4,6,8 have overall mean5 <strong>if evaluated at the same parameter vector<\/strong>. During real training, weights change after each batch, so averaging recorded gradients from different steps does not reconstruct an exact full-batch gradient at one point. Unequal batch sizes require weighting by example counts if the target is the full-data mean.<\/p>\n<p><strong>Example:<\/strong> batch sizes2 and8 with mean-gradients1 and6 give whole-data gradient(2×1+8×6)/10=5, not3.5. Accumulating gradients without updating can emulate a larger batch if loss scaling is handled consistently.<\/p>\n<p><strong>Memory:<\/strong> batch size controls data per step; learning rate controls movement per gradient; momentum/Adam control how gradient history is used. These choices are independent axes.<\/p>\n"}, {"number": 8, "title": "Week 4 — Momentum and adaptive optimizers", "scope": "Questions 11–20", "html": "<h1 id=\"track-direction-and-gradient-scale\">Track direction and gradient scale<\/h1>\n<h2 id=\"momentum-obey-the-convention\">Momentum: obey the convention<\/h2>\n<p>Assignment rule: <strong>vₜ=βvₜ₋₁+ηgₜ<\/strong>, <strong>wₜ=wₜ₋₁−vₜ<\/strong>. With vold=0.5,β=0.8,η=0.1,g3,wold=5: vnew0.4+0.3=<strong>0.7<\/strong>, wnew=<strong>4.3<\/strong>. Withβ0, v=0.3 and ordinary GD is recovered.<\/p>\n<p>Another common convention is v=βvold+g, then w←w−ηv. Both encode history but store differently scaled velocities. Yet another uses an exponential average(1−β)g. Do not combine an accumulator from one convention with an update from another. Read whereη and(1−β) occur.<\/p>\n<p>Momentum reinforces aligned gradient directions and smooths oscillatory components. It can accelerate passage through long narrow valleys but can overshoot. A highβ retains longer history. <strong>Nesterov momentum<\/strong> evaluates a gradient using a look-ahead position in a suitable equivalent formulation; the assignment's formula is ordinary momentum, not Nesterov.<\/p>\n<h2 id=\"adagrad\">AdaGrad<\/h2>\n<p>Per parameter: <strong>rₜ=rₜ₋₁+gₜ²<\/strong>, <strong>w←w−ηgₜ/(√rₜ+ε)<\/strong>. The assignment omitsε: r=9+4²=25, denominator5, step0.5×4/5=<strong>0.4<\/strong>. Squaring prevents positive/negative gradients from canceling in the scale accumulator.<\/p>\n<p>Frequently large gradients enlarge the denominator and reduce that coordinate's effective learning rate. Rare features can retain relatively larger steps. Because r only grows, learning can become too slow after a long history. Adaptive methods are coordinate-specific; they do not set one identical step for all weights.<\/p>\n<h2 id=\"rmsprop-and-adam\">RMSProp and Adam<\/h2>\n<p><strong>RMSProp:<\/strong> <strong>rₜ=ρrₜ₋₁+(1−ρ)gₜ²<\/strong>, then divide by a stabilized square root. The moving average forgets old gradients rather than accumulating them forever.<\/p>\n<p><strong>Adam:<\/strong> first moment <strong>mₜ=β₁mₜ₋₁+(1−β₁)gₜ<\/strong>; second moment <strong>vₜ=β₂vₜ₋₁+(1−β₂)gₜ²<\/strong>. Starting from zeros, bias-correct using <strong>m̂ₜ=mₜ/(1−β₁ᵗ)<\/strong>, <strong>v̂ₜ=vₜ/(1−β₂ᵗ)<\/strong>. Update <strong>w←w−ηm̂ₜ/(√v̂ₜ+ε)<\/strong>. β₁ controls direction memory; β₂ controls squared-scale memory. v is a raw second moment estimate, not the variance after subtracting m².<\/p>\n<p><strong>First-step example:<\/strong> g4,mold=vold=0,β₁0.9,β₂0.999 gives m=0.4,v=0.016; corrected moments4 and16. Ignoringε, step=η×4/4=η, notη×4. Sign and coordinate scale still matter across a real optimization trajectory.<\/p>\n<p><strong>Learning-rate schedules<\/strong> reduce or otherwise varyη over training; they are different from per-coordinate adaptive scaling. <strong>Gradient clipping<\/strong> limits unusually large gradients, often by global norm, helping control exploding updates; it does not fix vanishing gradients or replace correct initialization. <strong>Weight decay<\/strong> and data-loss gradients require the specified optimizer convention: L2-in-loss and decoupled weight decay are not generally equivalent for adaptive optimizers.<\/p>\n<p><strong>Likely patterns:<\/strong> history term→momentum; cumulative squares→AdaGrad; decayed squares→RMSProp; first+second moments with bias correction→Adam. ε prevents a zero/small denominator; it is not the learning rate.<\/p>\n"}], "cases": [{"number": 1, "title": "Delivery Delay Parameter Tuning", "html": "<p>The scalar loss is <strong>L(w)=(w−4)²<\/strong>. The current value is <strong>w=1<\/strong>, learning rate <strong>η=0.1<\/strong>. Update using <strong>wₜ₊₁=wₜ−η(dL/dw)<\/strong>.<\/p>\n"}, {"number": 2, "title": "Energy Forecast Training Schedule", "html": "<p>There are <strong>12 training records<\/strong>, mini-batch size <strong>3<\/strong>. One epoch uses each record once. Compare full-batch updates, one-record stochastic updates and mini-batch updates. Question 9 gives four mini-batch gradients <strong>2,4,6,8<\/strong>.<\/p>\n"}, {"number": 3, "title": "Queue Prediction Parameter Update", "html": "<p>Use the convention <strong>vₜ=βvₜ₋₁+ηgₜ<\/strong>, <strong>wₜ=wₜ₋₁−vₜ<\/strong>. Values: <strong>vₜ₋₁=0.5, β=0.8, η=0.1, gₜ=3, wₜ₋₁=5<\/strong>. Here velocity already includes the learning-rate-scaled gradient.<\/p>\n"}, {"number": 4, "title": "Demand Prediction Step-Size Analysis", "html": "<p>Current gradient <strong>g=4<\/strong>, previous accumulator <strong>rₜ₋₁=9<\/strong>, learning rate <strong>η=0.5<\/strong>. Use <strong>rₜ=rₜ₋₁+g²<\/strong>. The simplified update magnitude is <strong>ηg/√rₜ<\/strong>.<\/p>\n"}], "questions": [{"n": 1, "stem": "What is dL/dw at w = 1?", "options": {"A": "6", "B": "−3", "C": "3", "D": "−6"}, "answer": "D", "explanation": {"right": "<p>Differentiate L=(w−4)²: dL/dw=2(w−4). At w=1, gradient=2(−3)=−6. Increasing w locally moves it toward the minimum4.<\/p>\n", "wrong": "<p>A,+6, reverses sign. B,−3, forgets factor2. C,+3, both forgets2 and reverses sign.<\/p>\n", "cue": "<p>For(w−a)², gradient2(w−a) points away from the minimizer; subtract it to move toward a.<\/p>\n"}}, {"n": 2, "stem": "What is the next value of w?", "options": {"A": "1.3", "B": "1.6", "C": "0.4", "D": "2.0"}, "answer": "B", "explanation": {"right": "<p>Use wnew=wold−ηg=1−0.1(−6)=1.6. The step is+0.6 and the distance to4 decreases from3 to2.4.<\/p>\n", "wrong": "<p>A,1.3, uses gradient−3 instead of−6. C,0.4, moves with the gradient rather than against it. D,2.0, uses an unprovided step size.<\/p>\n", "cue": "<p>Write the subtraction explicitly before simplifying a negative gradient.<\/p>\n"}}, {"n": 3, "stem": "Why does w increase in this update?", "options": {"A": "The learning rate is negative.", "B": "The loss is already zero.", "C": "The gradient at w = 1 is negative.", "D": "The update ignores the derivative."}, "answer": "C", "explanation": {"right": "<p>At w=1 the derivative is−6. Descent subtracts that negative number, increasing w. The learning rate is positive; direction comes from the gradient's sign.<\/p>\n", "wrong": "<p>A falsely makes η negative. B falsely says the loss is already zero; it is9. D wrongly says the derivative is ignored, when it determines the update.<\/p>\n", "cue": "<p>Negative derivative→increase parameter for descent; positive derivative→decrease parameter.<\/p>\n"}}, {"n": 4, "stem": "Which value of w minimizes this loss?", "options": {"A": "1", "B": "2", "C": "3", "D": "4"}, "answer": "D", "explanation": {"right": "<p>A square is minimized at zero, so w−4=0 and w=4. The loss there is0, the global minimum of this quadratic.<\/p>\n", "wrong": "<p>A,w=1, gives9; B,w=2, gives4; C,w=3, gives1. Each is above the zero achievable at4.<\/p>\n", "cue": "<p>When the loss is a simple squared distance to a constant, the constant is the minimizer.<\/p>\n"}}, {"n": 5, "stem": "What is the role of the learning rate η?", "options": {"A": "It controls the update step size.", "B": "It stores the final target value.", "C": "It removes the need for a gradient.", "D": "It makes every loss value equal."}, "answer": "A", "explanation": {"right": "<p>The learning rate η multiplies the gradient and controls how far the parameter moves in each step. It affects stability and convergence speed rather than changing the target or removing derivatives.<\/p>\n", "wrong": "<p>B confuses η with the target. C is false because gradient descent still needs gradients. D is false because losses generally remain different at different parameters.<\/p>\n", "cue": "<p>Direction from gradient; distance scaled by learning rate. Too large can overshoot/diverge; too small can train slowly.<\/p>\n"}}, {"n": 6, "stem": "How many mini-batches are processed in one epoch?", "options": {"A": "3", "B": "4", "C": "6", "D": "12"}, "answer": "B", "explanation": {"right": "<p>An epoch uses all12 records. With batches of3, updates per epoch=12/3=4, assuming each batch is processed once.<\/p>\n", "wrong": "<p>A,3, repeats the batch size rather than count. C,6, would correspond to size2. D,12, corresponds to one-record batches.<\/p>\n", "cue": "<p>Batch size=examples per update; batch count=updates per epoch. If not divisible, use ceiling when retaining the last partial batch.<\/p>\n"}}, {"n": 7, "stem": "Which method uses all 12 records for each parameter update?", "options": {"A": "Stochastic gradient descent", "B": "Mini-batch gradient descent", "C": "Batch gradient descent", "D": "Momentum-only update"}, "answer": "C", "explanation": {"right": "<p>Full-batch gradient descent computes each update from the entire dataset, all12 records here. It normally makes one update per epoch in this simple setup.<\/p>\n", "wrong": "<p>A, stochastic GD, uses one record per update in the strict distinction. B, mini-batch GD, uses a subset such as3. D names a momentum mechanism, not the specified full-dataset sampling rule.<\/p>\n", "cue": "<p>Sampling granularity(batch/mini-batch/SGD) and optimizer memory(momentum/Adam) are separate choices.<\/p>\n"}}, {"n": 8, "stem": "Which method uses one record per parameter update?", "options": {"A": "Batch gradient descent", "B": "Adam without gradients or single-example updates", "C": "Full-batch averaging", "D": "Stochastic gradient descent"}, "answer": "D", "explanation": {"right": "<p>Stochastic gradient descent, in the strict one-example terminology used here, updates using a single record at a time. An epoch of12 examples then makes12 updates.<\/p>\n", "wrong": "<p>A and C use the full dataset, not one example. B is an invalid description because Adam still requires gradient information and can itself use mini-batches or single examples.<\/p>\n", "cue": "<p>SGD=one-example updates in textbook comparisons; practical software sometimes uses SGD to include mini-batches.<\/p>\n"}}, {"n": 9, "stem": "If the mini-batch gradients for four batches are 2, 4, 6, 8, what is their average?", "options": {"A": "5", "B": "4", "C": "6", "D": "8"}, "answer": "A", "explanation": {"right": "<p>For four equally weighted given gradients, average=(2+4+6+8)/4=20/4=5.<\/p>\n", "wrong": "<p>B=4,C6,D8 are individual or incorrect aggregate values. If batches had unequal sizes, an example-weighted average would be required for the whole-dataset mean gradient.<\/p>\n", "cue": "<p>Average gradients with the intended weights; equal-size batches permit a simple mean.<\/p>\n"}}, {"n": 10, "stem": "Why might mini-batch gradient descent be preferred in practice?", "options": {"A": "It never uses gradients.", "B": "It balances noisy updates and computational efficiency.", "C": "It requires the loss to be exactly zero before every mini-batch update.", "D": "It updates only after training is complete."}, "answer": "B", "explanation": {"right": "<p>Mini-batches combine useful gradient averaging with efficient vectorized computation while using less memory per update than a full dataset. They often reduce single-example noise without waiting for every record.<\/p>\n", "wrong": "<p>A is false because gradients remain central. C would make normal learning
